name: oxagen-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: oxagen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oxagen
      POSTGRES_PASSWORD: oxagen
      POSTGRES_DB: oxagen
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c log_statement=none
    ports:
      - "5432:5432"
    volumes:
      - oxagen-postgres:/var/lib/postgresql/data
      - ./tools/scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxagen -d oxagen"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.24-community
    container_name: oxagen-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/oxagen-dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - oxagen-neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: oxagen-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: oxagen
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - oxagen-clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oxagen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - oxagen-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oxagen-postgres:
  oxagen-neo4j:
  oxagen-clickhouse:
  oxagen-redis:
