name: oxagen-v2-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: oxagen-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oxagen
      POSTGRES_PASSWORD: oxagen
      POSTGRES_DB: oxagen
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c log_statement=none
    ports:
      # Host 5433 → container 5432; avoids collision with oxagen-platform's
      # postgres on 5432. Update DATABASE_URL in .env.local accordingly.
      - "5433:5432"
    volumes:
      - oxagen-v2-postgres:/var/lib/postgresql/data
      - ./tools/scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxagen -d oxagen"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.24-community
    container_name: oxagen-v2-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-oxagen-dev}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - oxagen-v2-neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: oxagen-v2-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: oxagen
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - oxagen-v2-clickhouse:/var/lib/clickhouse
    healthcheck:
      # clickhouse-alpine doesn't ship wget. Use the bundled client binary
      # to probe the server. Same signal, image-agnostic.
      test: ["CMD", "clickhouse-client", "-q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oxagen-v2-postgres:
  oxagen-v2-neo4j:
  oxagen-v2-clickhouse:
