id: summarize-run-failure
title: Summarize this run's failure
description: Generate a root-cause summary for a failed run, including the failing step and most likely cause.
category: investigate
tags: [run, failure, summary, debug]
applicableTo:
  - routePattern: /{org}/{ws}/agents/runs/:runId
capability: debug_execution
autoSubmit: true
variables:
  - name: run_id
    resolver: param
    source: params.runId
    required: true
body: |
  Diagnose the failure of run {{run_id}} using debug_execution with
  summarize:true. Report the failing step, the error class and message, the
  ranked suspect files, and the root-cause diagnosis. Format as:
  Problem → Root Cause → Recommended Fix.
