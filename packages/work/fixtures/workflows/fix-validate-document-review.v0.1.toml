# The v0.1 workflow in tasks-spec.md §10.1, copied verbatim. v0.3 reads it unchanged.
# .oxagen/workflows/fix-validate-document-review.toml
schema = "oxagen-workflow/v0.1"
name = "Fix, validate, document, review"

[[stage]]
role = "Fix"
agent = "aintel.core.bug-fixer"
owns = ["code"]
on_fail = "stop"

[[stage]]
role = "Validate"
agent = "aintel.core.validator"
owns = ["test"]
on_fail = "return"
return_to = 1
max_returns = 2

[[stage]]
role = "Document"
agent = "aintel.core.documenter"
owns = ["docs"]
on_fail = "stop"

[[stage]]
role = "Review"
agent = "aintel.core.architect"
owns = ["review"]
on_fail = "return"
return_to = 1
max_returns = 1

[accept]
by = "operator"   # the last stage is always a person
