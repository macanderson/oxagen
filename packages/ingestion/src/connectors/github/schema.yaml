apiVersion: oxagen.ai/v1alpha1
kind: ConnectorPlugin

metadata:
  id: github
  displayName: GitHub
  description: Sync repository, pull request, issue, commit, and release metadata from GitHub.
  icon: github
  category: developer-tools
  version: "1.0.0"
  schemaVersion: "1"
  publisher:
    name: Oxagen
    verified: true

auth:
  schemes:
    - id: oauth2
      kind: oauth2_authorization_code
      displayName: Connect with GitHub (OAuth)
      scopes:
        - repo
        - read:org
        - read:user
    - id: pat
      kind: api_key
      displayName: Personal Access Token
      fields:
        - key: apiKey
          label: Personal Access Token
          widget: secret
          description: Generate at github.com/settings/tokens — requires repo and read:org scopes.
          validation:
            required: true
            pattern: "^(ghp_|github_pat_)[A-Za-z0-9_]{20,}$"

config:
  fields:
    - key: organizations
      label: Organizations
      widget: tag-input
      description: GitHub organization slugs to sync (e.g. acme-corp). At least one required.
      validation:
        required: true
        minItems: 1
        itemPattern: "^[a-zA-Z0-9][a-zA-Z0-9\\-]{0,38}$"

    - key: repositories
      label: Repositories (optional)
      widget: tag-input
      description: Restrict sync to specific repos (owner/repo). Leave empty to sync all accessible repos in the listed organizations.
      validation:
        itemPattern: "^[a-zA-Z0-9_\\.\\-]+/[a-zA-Z0-9_\\.\\-]+$"

    - key: syncDepthDays
      label: Initial Sync Depth (days)
      widget: number
      description: How far back to pull history on the first sync.
      defaultValue: 90
      validation:
        min: 1
        max: 730

recordTypes:
  selectionMode: multi
  defaultAll: false
  items:
    - id: pull_request
      displayName: Pull Requests
      description: Merged, open, and closed pull requests including descriptions, labels, and review metadata.
      defaultEnabled: true

    - id: issue
      displayName: Issues
      description: Bug reports, feature requests, and tasks tracked as GitHub issues.
      defaultEnabled: true

    - id: release
      displayName: Releases
      description: Tagged releases with changelogs and semantic version metadata.
      defaultEnabled: true

    - id: commit
      displayName: Commits
      description: Individual commit metadata (SHA, message, author, timestamp).
      defaultEnabled: false

    - id: repository
      displayName: Repositories
      description: "Repository metadata: name, description, language, visibility."
      defaultEnabled: true

    - id: code_review
      displayName: Code Reviews
      description: Pull request review bodies and approval/change-request states.
      defaultEnabled: false

    - id: comment
      displayName: Comments
      description: Issue and pull request comments.
      defaultEnabled: false

filters:
  labelFilters:
    enabled: true
    appliesTo:
      - issue
      - pull_request

sync:
  delivery: webhook
  pollingSupported: true
  webhookEvents:
    - push
    - pull_request
    - issues
    - release
    - create
  polling:
    defaultIntervalSeconds: 300
    minIntervalSeconds: 60
    maxIntervalSeconds: 86400

defaultFieldMappings:
  pull_request:
    title: title
    body: description
    author: author
    state: status
    labels: tags
    mergedAt: closedAt
    url: sourceUrl
  issue:
    title: title
    body: description
    author: author
    state: status
    labels: tags
    url: sourceUrl
  release:
    name: title
    body: description
    tagName: version
    publishedAt: publishedAt
    url: sourceUrl
  repository:
    fullName: title
    description: description
    language: language
    url: sourceUrl
