apiVersion: oxagen.ai/v1alpha1
kind: ConnectorPlugin

metadata:
  id: salesforce
  displayName: Salesforce
  description: Sync opportunities, contacts, accounts, leads, and cases from Salesforce CRM.
  icon: salesforce
  category: crm
  version: "1.0.0"
  schemaVersion: "1"
  publisher:
    name: Oxagen
    verified: true

auth:
  schemes:
    - id: oauth2_authorization_code
      kind: oauth2_authorization_code
      displayName: Connect with Salesforce (OAuth)
      scopes:
        - api
        - refresh_token

    - id: oauth2_client_credentials
      kind: oauth2_client_credentials
      displayName: Salesforce Connected App (Client Credentials)
      scopes:
        - api

config:
  fields:
    - key: instanceUrl
      label: Salesforce Instance URL
      widget: url
      description: Your Salesforce org URL (e.g. https://yourorg.my.salesforce.com).
      validation:
        required: true
        pattern: "^https://[a-zA-Z0-9][a-zA-Z0-9.\\-]+\\.salesforce\\.com(/.*)?$"

    - key: objectTypes
      label: Salesforce Object Types
      widget: multi-select
      description: Which Salesforce standard objects to sync. Custom objects can be added via the objectTypes field.
      defaultValue:
        - Opportunity
        - Contact
        - Account
        - Lead
        - Case
      options:
        - label: Opportunities
          value: Opportunity
        - label: Contacts
          value: Contact
        - label: Accounts
          value: Account
        - label: Leads
          value: Lead
        - label: Cases
          value: Case
      validation:
        minItems: 1

    - key: syncDepthDays
      label: Initial Sync Depth (days)
      widget: number
      description: How far back to pull records on the first sync.
      defaultValue: 180
      validation:
        min: 1
        max: 730

recordTypes:
  selectionMode: multi
  defaultAll: false
  items:
    - id: opportunity
      displayName: Opportunities
      description: Sales opportunities with stage, amount, close date, and probability.
      defaultEnabled: true

    - id: contact
      displayName: Contacts
      description: Individual contacts with name, email, phone, and account association.
      defaultEnabled: true

    - id: account
      displayName: Accounts
      description: Company accounts with industry, type, revenue, and employee count.
      defaultEnabled: true

    - id: lead
      displayName: Leads
      description: Unqualified prospects with contact details and lead source.
      defaultEnabled: false

    - id: case
      displayName: Cases
      description: Support cases with subject, status, priority, and resolution data.
      defaultEnabled: false

filters:
  pathFilters:
    enabled: false
  labelFilters:
    enabled: false

inference:
  enabled: true
  defaultEnabled: true
  toggleLabel: Enable AI relationship inference
  perRecordType:
    opportunity: true
    contact: true
    account: true
    lead: false
    case: false
  confidenceThreshold:
    defaultValue: 0.75
    min: 0.50
    max: 0.99
  ontologyPrompt: |
    Infer customer relationships and sales context from Salesforce CRM data.

    Look for:
    - Opportunity names that reference product features, tiers, or use cases
    - Account industry and size signals that indicate market segment
    - Contacts whose titles suggest engineering, product, or executive roles
    - Cases that surface recurring product pain points or feature requests

    Create edges:
    - Account -[has_opportunity]-> Opportunity (Account is the parent of Opportunity)
    - Contact -[associated_with]-> Account (Contact belongs to Account)
    - Lead -[converted_to]-> Contact (when IsConverted is true)
    - Case -[reported_by]-> Contact (when Contact is linked to Case)
    - Opportunity -[in_stage]-> SalesStage (map StageName to a canonical pipeline stage node)

    Cross-source links:
    - If an Account name matches a GitHub organization, create an ALIAS_OF edge
    - If a Contact email matches a known Linear or GitHub user, link to that person node

sync:
  delivery: polling
  pollingSupported: true
  polling:
    defaultIntervalSeconds: 900
    minIntervalSeconds: 300
    maxIntervalSeconds: 86400

defaultFieldMappings:
  opportunity:
    Name: title
    Description: description
    StageName: status
    OwnerId: owner
    CloseDate: dueDate
    Amount: amount
  contact:
    Name: displayName
    Email: email
    Title: jobTitle
    AccountId: parentId
    CreatedDate: createdAt
    LastModifiedDate: updatedAt
  account:
    Name: title
    Description: description
    Industry: tags
    Website: sourceUrl
    CreatedDate: createdAt
    LastModifiedDate: updatedAt
  lead:
    Name: displayName
    Email: email
    Company: organization
    LeadSource: source
    Status: status
    CreatedDate: createdAt
  case:
    Subject: title
    Description: description
    Status: status
    Priority: priority
    CreatedDate: createdAt
    LastModifiedDate: updatedAt
