apiVersion: oxagen.ai/v1alpha1
kind: ConnectorPlugin

metadata:
  id: google-meet
  displayName: Google Meet
  description: Sync meeting records, participants, and transcripts from Google Meet.
  icon: google-meet
  category: communication
  version: "1.0.0"
  schemaVersion: "1"
  publisher:
    name: Oxagen
    verified: true

auth:
  schemes:
    - id: oauth2
      kind: oauth2_authorization_code
      displayName: Connect with Google
      scopes:
        - https://www.googleapis.com/auth/meetings.space.readonly
        - https://www.googleapis.com/auth/meetings.space.created

config:
  fields:
    - key: includeRecordings
      label: Include Recording Metadata
      widget: checkbox
      description: Sync recording artifacts linked to each conference record.
      defaultValue: false

    - key: includeTranscripts
      label: Include Transcripts
      widget: checkbox
      description: Sync auto-generated meeting transcripts (requires Meet transcript access).
      defaultValue: false

    - key: syncDaysBack
      label: Initial Sync Depth (days)
      widget: number
      description: How many days of past meetings to pull on the first sync.
      defaultValue: 30
      validation:
        min: 1
        max: 365

recordTypes:
  selectionMode: multi
  defaultAll: false
  items:
    - id: conference_record
      displayName: Conference Records
      description: Google Meet session records with space ID, start/end time, and participant count.
      defaultEnabled: true

    - id: participant
      displayName: Participants
      description: Individual participant records per meeting with join/leave times.
      defaultEnabled: false

    - id: transcript
      displayName: Transcripts
      description: Auto-generated meeting transcripts stored in Google Docs.
      defaultEnabled: false

filters:
  pathFilters:
    enabled: false
  labelFilters:
    enabled: false

inference:
  enabled: true
  defaultEnabled: false
  toggleLabel: Enable AI relationship inference
  perRecordType:
    conference_record: true
    participant: false
    transcript: true
  confidenceThreshold:
    defaultValue: 0.75
    min: 0.50
    max: 0.99
  ontologyPrompt: |
    Infer team collaboration patterns from Google Meet sessions.

    Look for:
    - Recurring meeting spaces that indicate team rituals (standups, retros, planning)
    - Participant lists correlating to known team membership
    - Transcript content referencing decisions, action items, or product features

    Create edges:
    - ConferenceRecord -[involves]-> Person (link participant emails to known person nodes)
    - Transcript -[records]-> ConferenceRecord (transcript belongs to its meeting)
    - ConferenceRecord -[discusses]-> Feature (when transcript content mentions a product feature)

    Cross-source links:
    - If a participant email matches a known GitHub or Linear user, create an ALIAS_OF edge

sync:
  delivery: polling
  pollingSupported: true
  polling:
    defaultIntervalSeconds: 3600
    minIntervalSeconds: 900
    maxIntervalSeconds: 86400

defaultFieldMappings:
  conference_record:
    space: title
    startTime: createdAt
    endTime: updatedAt
  participant:
    displayName: displayName
    email: email
    earliestStartTime: createdAt
  transcript:
    conferenceRecord: parentId
    startTime: createdAt
    docsDestination: sourceUrl
