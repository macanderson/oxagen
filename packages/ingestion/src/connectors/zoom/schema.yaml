apiVersion: oxagen.ai/v1alpha1
kind: ConnectorPlugin

metadata:
  id: zoom
  displayName: Zoom
  description: Sync meetings, recordings, participants, and transcripts from Zoom.
  icon: zoom
  category: communication
  version: "1.0.0"
  schemaVersion: "1"
  publisher:
    name: Oxagen
    verified: true

auth:
  schemes:
    - id: oauth2
      kind: oauth2_authorization_code
      displayName: Connect with Zoom (OAuth)
      scopes:
        - meeting:read
        - recording:read
        - user:read

config:
  fields:
    - key: includePastMeetings
      label: Include Past Meetings
      widget: checkbox
      description: Sync completed meetings in addition to scheduled upcoming meetings.
      defaultValue: true

    - key: includeRecordings
      label: Include Cloud Recordings
      widget: checkbox
      description: Sync cloud recording metadata and transcripts (requires recording:read scope).
      defaultValue: false

    - key: syncDaysBack
      label: Initial Sync Depth (days)
      widget: number
      description: How far back to pull past meeting history on the first sync.
      defaultValue: 30
      validation:
        min: 1
        max: 365

recordTypes:
  selectionMode: multi
  defaultAll: false
  items:
    - id: meeting
      displayName: Meetings
      description: Zoom meeting records including topic, host, start time, duration, and join URL.
      defaultEnabled: true

    - id: recording
      displayName: Cloud Recordings
      description: Cloud recording metadata including file list, download URLs, and total size.
      defaultEnabled: false

    - id: participant
      displayName: Participants
      description: Meeting participant data including join/leave times and attentiveness score.
      defaultEnabled: false

    - id: transcript
      displayName: Transcripts
      description: Meeting transcript files generated from cloud recordings.
      defaultEnabled: false

filters:
  pathFilters:
    enabled: false
  labelFilters:
    enabled: false

inference:
  enabled: true
  defaultEnabled: false
  toggleLabel: Enable AI relationship inference
  perRecordType:
    meeting: true
    recording: false
    participant: false
    transcript: true
  confidenceThreshold:
    defaultValue: 0.75
    min: 0.50
    max: 0.99
  ontologyPrompt: |
    Infer team collaboration patterns and project context from Zoom meeting data.

    Look for:
    - Meeting topics that reference product features, sprint names, or project codenames
    - Recurring meeting patterns that indicate team rituals (standup, retro, planning)
    - Participant lists that correlate to known team or squad membership
    - Transcript content mentioning decisions, action items, or architectural discussions

    Create edges:
    - Meeting -[discusses]-> Feature (when meeting topic references a product feature by name)
    - Meeting -[involves]-> Person (link each participant email to a known person node)
    - Transcript -[records]-> Meeting (transcript belongs to its parent meeting)
    - Meeting -[part_of]-> Sprint (when topic contains sprint name or cycle reference)

    Cross-source links:
    - If a participant email matches a known GitHub or Linear user, create an ALIAS_OF edge
    - If a meeting topic mentions a Linear ticket ID (e.g. OXA-123), reference that issue node

sync:
  delivery: webhook
  pollingSupported: true
  webhookEvents:
    - meeting.started
    - meeting.ended
    - recording.completed
    - recording.transcript_completed
  polling:
    defaultIntervalSeconds: 3600
    minIntervalSeconds: 900
    maxIntervalSeconds: 86400

defaultFieldMappings:
  meeting:
    topic: title
    agenda: description
    hostEmail: author
    start_time: createdAt
    joinUrl: sourceUrl
    uuid: externalKey
  recording:
    topic: title
    hostEmail: author
    start_time: createdAt
    shareUrl: sourceUrl
  participant:
    name: displayName
    email: email
    joinTime: createdAt
  transcript:
    meeting_id: parentId
    downloadUrl: sourceUrl
    startTime: createdAt
