#:schema https://oxagen.sh/schemas/mcp-tools/v1.json
schema = "mcp-tools/v1"

[tools.list_charges]
operation = "listCharges"
description = "List one customer's charges, newest first. Amounts are in cents."
risk = "low"
side_effect = "read"
egress = "org_tenant"
paginate = "cursor"

[tools.create_refund]
operation = "createRefund"
description = "Refund part or all of a captured charge. amount is in cents and defaults to the whole charge."
risk = "high"
side_effect = "irreversible"
egress = "org_tenant"
impacts = ["moves_money"]
hide = ["X-Request-Source"]
fixed = { "X-Request-Source" = "oxagen" }
idempotency_header = "Idempotency-Key"
