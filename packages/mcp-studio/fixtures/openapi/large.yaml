components:
  parameters:
    Cursor:
      name: cursor
      in: query
      description: The next_cursor from the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    NotFound:
      description: No record has that id.
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
              detail:
                type: string
  schemas:
    NewBillingAccount:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
        labels:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - active
            - archived
    BillingAccount:
      allOf:
        - $ref: "#/components/schemas/NewBillingAccount"
        - type: object
          required:
