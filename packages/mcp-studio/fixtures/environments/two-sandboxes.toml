#:schema https://oxagen.sh/schemas/mcp-server/v1.json
# Invalid: two environments both marked sandbox.
schema = "mcp-server/v1"
name = "stripe"
label = "Stripe"
description = "Payments, refunds, and invoices in the a-intel Stripe account."

[source]
type = "remote"
url = "https://mcp.stripe.com"
transport = "http"

[auth]
mode = "service"
scheme = "oauth"

[environments.test]
sandbox = true
credential = "oxagen:credential/stripe-test"

[environments.live]
sandbox = true
credential = "oxagen:credential/stripe-live"

[exposure]
mode = "direct"

[sync]
schedule = "daily"
