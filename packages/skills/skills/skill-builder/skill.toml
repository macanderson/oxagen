schema_version = 1
kind = "skill"
name = "skill-builder"
description = "Use when creating, editing, or reviewing an Oxagen skill artifact or its supporting bundle files."
instructions = "# Building a skill\n\nLoad this skill when creating, editing, or reviewing an Oxagen skill.\n\nAn Oxagen skill is a directory bundle whose canonical manifest is `skill.toml`. The manifest contains metadata and instructions; supporting references stay beside it. Markdown with frontmatter is a foreign import format, not an Oxagen runtime format.\n\n## Canonical bundle\n\n```text\n.oxagen/skills/my-skill/\n├── skill.toml\n└── references/\n    └── style-guide.md\n```\n\n```toml\nschema_version = 1\nkind = \"skill\"\nname = \"my-skill\"\ndescription = \"Use when a task needs the team style guide.\"\ninstructions = \"Apply the style guide before drafting or reviewing copy.\"\nreferences = [\"references/style-guide.md\"]\n\n[metadata]\nweight = \"high\"\ncategory = \"writing\"\n```\n\n## Manifest contract\n\n- `schema_version` is `1`.\n- `kind` is `\"skill\"`.\n- `name` is lowercase kebab-case and is the skill identity.\n- `description` states when the skill should be loaded.\n- `instructions` contains the behavior the model applies.\n- `references` explicitly lists relative sidecar paths. Paths must remain inside the bundle.\n- `metadata.weight` may be `low`, `high`, or `critical`; reserve `critical` for guidance that prevents real harm.\n\n## Writing instructions\n\n- Open with the conditions that make the skill relevant.\n- State concrete rules before their rationale.\n- Prefer specific, imperative guidance over vague advice.\n- Keep one focused, reusable topic per skill.\n- Put large references or reusable assets in sidecars and declare them explicitly.\n\n## When not to write a skill\n\n- The guidance is only for one task; provide it inline.\n- The requirement can be enforced in code, a type, lint rule, or test; enforce it there.\n- An existing skill already covers the behavior; improve that bundle instead.\n\nBefore activation, parse the TOML, verify every reference is contained, and confirm the skill loads through the canonical Oxagen loader."
references = []

[metadata]
weight = "high"
category = "meta"
