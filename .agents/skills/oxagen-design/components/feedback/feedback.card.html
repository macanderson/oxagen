<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { Button, Dialog, Drawer, ToastProvider, useToast, Badge } = window.OxagenDesignSystem_2dfe15;
function Demo() {
  const [dlg, setDlg] = React.useState(false);
  const [drw, setDrw] = React.useState(false);
  const { push } = useToast();
  return (
    <div>
      <div className="lab">Click to trigger</div>
      <div className="row">
        <Button variant="primary" onClick={() => setDlg(true)}>Open dialog</Button>
        <Button variant="secondary" onClick={() => setDrw(true)}>Open drawer</Button>
        <Button variant="outline" onClick={() => push({ tone: "success", title: "Source connected", description: "GitHub · 1,284 edges synced." })}>Success toast</Button>
        <Button variant="outline" onClick={() => push({ tone: "warning", title: "Approval needed", description: "3 inferred edges are awaiting review." })}>Warning toast</Button>
      </div>
      <Dialog
        open={dlg}
        onClose={() => setDlg(false)}
        title="Revoke API token?"
        description="Agents using tok_live_9f2 will lose access immediately. This cannot be undone."
        footer={<><Button variant="ghost" onClick={() => setDlg(false)}>Cancel</Button><Button variant="destructive" onClick={() => setDlg(false)}>Revoke token</Button></>}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <Badge variant="neutral" mono>tok_live_9f2</Badge>
          <span style={{ color: "var(--muted-foreground)" }}>last used 4m ago</span>
        </div>
      </Dialog>
      <Drawer
        open={drw}
        onClose={() => setDrw(false)}
        title="Edge details"
        description="prn_8fa21c → CAN_READ → doc_41be09"
        footer={<><Button variant="ghost" onClick={() => setDrw(false)}>Deny</Button><Button variant="primary" onClick={() => setDrw(false)}>Approve</Button></>}
      >
        <p style={{ marginTop: 0, fontSize: 13, lineHeight: 1.6, color: "var(--muted-foreground)" }}>
          Inferred from a GitHub CODEOWNERS entry with 92% confidence. Approving writes a permission-checked edge into the knowledge graph.
        </p>
        <Badge variant="risk-low" dot>low risk</Badge>
      </Drawer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<ToastProvider><Demo /></ToastProvider>);
</script>
</body>
</html>
