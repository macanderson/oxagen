<!-- @dsCard group="Brand" viewport="400x400" name="Social avatar" subtitle="Square profile picture for company social accounts" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  .av { width: 400px; height: 400px; position: relative; display: grid; place-items: center;
    background:
      radial-gradient(60% 60% at 28% 24%, color-mix(in oklch, #7c5aed 46%, transparent), transparent 68%),
      radial-gradient(55% 55% at 84% 84%, color-mix(in oklch, #df2a5d 34%, transparent), transparent 70%),
      #0b0a11; }
</style>
</head>
<body>
  <div class="av">
    <svg viewBox="0 0 100 100" width="232" height="232" fill="none">
      <defs><linearGradient id="g" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#7ce8f4"/><stop offset=".52" stop-color="#9b7bff"/><stop offset="1" stop-color="#df2a5d"/>
      </linearGradient></defs>
      <circle cx="50" cy="50" r="37" stroke="url(#g)" stroke-width="13"/>
    </svg>
  </div>
</body>
</html>
