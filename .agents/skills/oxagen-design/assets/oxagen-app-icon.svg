<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 100 100" fill="none" aria-label="Oxagen">
  <title>Oxagen logomark</title>
  <desc>Thick circle outline stroked in the nebula gradient (cyan to violet to cosmos).</desc>
  <defs>
    <linearGradient id="oxneb" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ce8f4"></stop>
      <stop offset="0.52" stop-color="#9b7bff"></stop>
      <stop offset="1" stop-color="#df2a5d"></stop>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="37" stroke="url(#oxneb)" stroke-width="13"></circle>
</svg>