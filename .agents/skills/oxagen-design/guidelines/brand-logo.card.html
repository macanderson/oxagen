<!-- @dsCard group="Brand" viewport="700x300" name="Logo — mark, lockups, mono" subtitle="Nebula ring + Aeonik Fono wordmark" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 116px; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; }
  .v { font-family: var(--font-sans); font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-foreground); }
  .onlight { background: #f5f6fa; }
  .onlight .v { color: #6b6878; }
  .ondark { background: #0f0e15; }
  .h { display: inline-flex; align-items: center; gap: 12px; }
  .vbox { display: inline-flex; flex-direction: column; align-items: center; gap: 12px; }
  .wm { font-family: var(--font-display); font-weight: 500; letter-spacing: -.04em; line-height: 1; }
  svg { display: block; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="grid">
    <!-- Horizontal lockup -->
    <div class="cell">
      <span class="h">
        <svg width="34" height="34" viewBox="0 0 100 100" fill="none"><defs><linearGradient id="g1" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7ce8f4"/><stop offset=".52" stop-color="#9b7bff"/><stop offset="1" stop-color="#df2a5d"/></linearGradient></defs><circle cx="50" cy="50" r="37" stroke="url(#g1)" stroke-width="13"/></svg>
        <span class="wm" style="font-size:34px;color:var(--foreground)">Oxagen</span>
      </span>
      <span class="v">Horizontal lockup</span>
    </div>
    <!-- Vertical lockup -->
    <div class="cell">
      <span class="vbox">
        <svg width="46" height="46" viewBox="0 0 100 100" fill="none"><defs><linearGradient id="g2" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7ce8f4"/><stop offset=".52" stop-color="#9b7bff"/><stop offset="1" stop-color="#df2a5d"/></linearGradient></defs><circle cx="50" cy="50" r="37" stroke="url(#g2)" stroke-width="13"/></svg>
        <span class="wm" style="font-size:30px;color:var(--foreground)">Oxagen</span>
      </span>
      <span class="v">Vertical lockup</span>
    </div>
    <!-- Mark -->
    <div class="cell">
      <svg width="56" height="56" viewBox="0 0 100 100" fill="none"><defs><linearGradient id="g3" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7ce8f4"/><stop offset=".52" stop-color="#9b7bff"/><stop offset="1" stop-color="#df2a5d"/></linearGradient></defs><circle cx="50" cy="50" r="37" stroke="url(#g3)" stroke-width="13"/></svg>
      <span class="v">Mark</span>
    </div>
    <!-- Wordmark -->
    <div class="cell">
      <span class="wm" style="font-size:34px;color:var(--foreground)">Oxagen</span>
      <span class="v">Wordmark</span>
    </div>
    <!-- Mono light on dark -->
    <div class="cell ondark">
      <span class="h">
        <svg width="30" height="30" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="37" stroke="#f4f6fb" stroke-width="13"/></svg>
        <span class="wm" style="font-size:30px;color:#f4f6fb">Oxagen</span>
      </span>
      <span class="v" style="color:#8b90a3">Mono light · on dark</span>
    </div>
    <!-- Mono dark on light -->
    <div class="cell onlight">
      <span class="h">
        <svg width="30" height="30" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="37" stroke="#0f0e15" stroke-width="13"/></svg>
        <span class="wm" style="font-size:30px;color:#0f0e15">Oxagen</span>
      </span>
      <span class="v">Mono dark · on light</span>
    </div>
  </div>
</body>
</html>
