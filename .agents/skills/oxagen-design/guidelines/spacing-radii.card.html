<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="sm 6 · md 8 · lg 12 · xl 16 · 2xl 24" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .b { width: 80px; height: 64px; background: var(--card); border: 1px solid var(--border-strong); border-top: 2px solid var(--violet-400); border-right: 2px solid var(--violet-400); }
  .v { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted-foreground); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="b" style="border-radius:var(--radius-sm)"></div><div class="v">sm · 6</div></div>
    <div class="col"><div class="b" style="border-radius:var(--radius-md)"></div><div class="v">md · 8</div></div>
    <div class="col"><div class="b" style="border-radius:var(--radius-lg)"></div><div class="v">lg · 12</div></div>
    <div class="col"><div class="b" style="border-radius:var(--radius-xl)"></div><div class="v">xl · 16</div></div>
    <div class="col"><div class="b" style="border-radius:var(--radius-2xl)"></div><div class="v">2xl · 24</div></div>
    <div class="col"><div class="b" style="border-radius:var(--radius-full)"></div><div class="v">full</div></div>
  </div>
</body>
</html>
