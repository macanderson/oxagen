<!-- @dsCard group="Colors" viewport="700x190" name="Surfaces — dark & light" subtitle="Deep-space hero · clean light theme" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pane { border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 16px; background: var(--background); }
  .stack { display: flex; gap: 8px; }
  .chip { flex: 1; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .t { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted-foreground); margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="pair">
    <div class="pane">
      <div class="t">:root · dark</div>
      <div class="stack">
        <div class="chip" style="background:var(--background)"></div>
        <div class="chip" style="background:var(--card)"></div>
        <div class="chip" style="background:var(--elevated)"></div>
        <div class="chip" style="background:var(--primary)"></div>
      </div>
    </div>
    <div class="pane light">
      <div class="t">.light</div>
      <div class="stack">
        <div class="chip" style="background:var(--background)"></div>
        <div class="chip" style="background:var(--card)"></div>
        <div class="chip" style="background:var(--secondary)"></div>
        <div class="chip" style="background:var(--primary)"></div>
      </div>
    </div>
  </div>
</body>
</html>
