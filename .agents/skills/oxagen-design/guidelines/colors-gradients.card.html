<!-- @dsCard group="Colors" viewport="700x200" name="Signature gradients" subtitle="Nebula · Aurora · Cosmos · Sunset" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .g { height: 64px; border-radius: var(--radius-lg); display: flex; align-items: flex-end; padding: 10px 14px; border: 1px solid var(--border); }
  .g span { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.4); }
</style>
</head>
<body>
  <div class="grid">
    <div class="g" style="background:var(--grad-nebula)"><span>Nebula</span></div>
    <div class="g" style="background:var(--grad-aurora)"><span>Aurora</span></div>
    <div class="g" style="background:var(--grad-cosmos)"><span>Cosmos</span></div>
    <div class="g" style="background:var(--grad-sunset)"><span>Sunset</span></div>
  </div>
</body>
</html>
