<!-- @dsCard group="Type" viewport="700x210" name="Mono — Aeonik Mono" subtitle="Code, eyebrows, IDs, metrics" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px; font-family: var(--font-mono); }
  .eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted-foreground); margin-bottom: 14px; }
  pre { font-family: var(--font-mono); font-size: 13px; line-height: 1.65; margin: 0; color: var(--foreground); }
  .k { color: var(--cyan-400); }
  .s { color: var(--violet-bright, #9b7bff); }
  .c { color: var(--muted-foreground); }
  .id { color: var(--cosmos-400); }
  .tag { display:inline-block; margin-top:16px; font-size: 11px; letter-spacing:.14em; text-transform:uppercase; background: var(--muted); border:1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 8px; color: var(--muted-foreground); }
</style>
</head>
<body>
  <div class="eyebrow">Aeonik Mono · 400 – 500</div>
  <pre><span class="c">// scoped graph query — RBAC enforced</span>
<span class="k">MATCH</span> (u:User)-[:<span class="s">CAN_READ</span>]->(d:Document)
<span class="k">WHERE</span> u.id = <span class="id">"prn_8fa21c"</span>
<span class="k">RETURN</span> d.title, d.confidence</pre>
  <span class="tag">node · prn_8fa21c</span>
</body>
</html>
