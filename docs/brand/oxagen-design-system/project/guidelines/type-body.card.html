<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted-foreground); margin-bottom: 14px; }
  p { font-family: var(--font-sans); font-size: 15px; line-height: 1.6; max-width: 60ch; margin: 0 0 12px; }

  .muted { color: var(--muted-foreground); font-size: 14px; }
  .wts { display: flex; gap: 22px; margin-top: 18px; font-family: var(--font-sans); font-size: 16px; }
  .wts span { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); margin-top: 2px; }
</style>
</head>
<body>
  <div class="eyebrow">Aeonik · Body & UI</div>
  <p class="lead">Oxagen gives AI agents secure, role-aware context drawn from a typed knowledge graph.</p>
  <p class="muted">Every edge is permission-checked before an agent ever sees it — so retrieval respects the same RBAC boundaries your humans do.</p>
  <div class="wts">
    <div style="font-weight:400">Regular<span>400</span></div>
    <div style="font-weight:500">Medium<span>500</span></div>
    <div style="font-weight:600">Semibold<span>600</span></div>
    <div style="font-weight:400;font-style:italic">Italic<span>400i</span></div>
  </div>
