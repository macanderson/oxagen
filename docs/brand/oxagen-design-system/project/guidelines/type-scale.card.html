<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; }
  .r { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--border); padding: 6px 0; }
  .r:last-child { border-bottom: 0; }
  .t { font-family: var(--font-display); font-weight: 500; letter-spacing: -0.02em; color: var(--foreground); white-space: nowrap; }
  .m { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted-foreground); margin-left: auto; }
</style>
</head>
<body>
  <div class="r"><span class="t" style="font-size:48px">Knowledge</span><span class="m">4xl · 48</span></div>
  <div class="r"><span class="t" style="font-size:36px">Knowledge graph</span><span class="m">3xl · 36</span></div>
  <div class="r"><span class="t" style="font-size:28px">Scoped retrieval context</span><span class="m">2xl · 28</span></div>
  <div class="r"><span class="t" style="font-size:22px">Permission-checked edges</span><span class="m">xl · 22</span></div>
  <div class="r"><span class="t" style="font-size:18px">Typed entities and relations</span><span class="m">lg · 18</span></div>
</body>
</html>
