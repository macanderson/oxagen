<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation & glow" subtitle="Shadows on dark · jewel focus glows" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 30px; background: var(--background-2); }
  .row { display: flex; gap: 26px; align-items: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .b { width: 96px; height: 64px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .v { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted-foreground); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="b" style="box-shadow:var(--shadow-sm)"></div><div class="v">sm</div></div>
    <div class="col"><div class="b" style="box-shadow:var(--shadow-md)"></div><div class="v">md</div></div>
    <div class="col"><div class="b" style="box-shadow:var(--shadow-lg)"></div><div class="v">lg</div></div>
    <div class="col"><div class="b" style="box-shadow:var(--glow-violet)"></div><div class="v">glow · violet</div></div>
    <div class="col"><div class="b" style="box-shadow:var(--glow-cyan)"></div><div class="v">glow · cyan</div></div>
  </div>
</body>
</html>
