<!-- @dsCard group="Colors" viewport="700x190" name="Brand jewel triad" subtitle="Cyan · Violet · Cosmos — the Oxagen identity" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .sw { border-radius: var(--radius-lg); padding: 16px; height: 110px; display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid var(--border); }
  .nm { font-family: var(--font-display); font-size: 15px; font-weight: 500; }
  .hx { font-family: var(--font-mono); font-size: 11px; opacity: .85; margin-top: 2px; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#7ce8f4;color:#08080d"><div class="nm">Cyan</div><div class="hx">#7CE8F4</div></div>
    <div class="sw" style="background:#7c5aed;color:#fff"><div class="nm">Violet</div><div class="hx">#7C5AED</div></div>
    <div class="sw" style="background:#df2a5d;color:#fff"><div class="nm">Cosmos</div><div class="hx">#DF2A5D</div></div>
  </div>
</body>
</html>
