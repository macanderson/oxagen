<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; }
  .lab { font-family: var(--font-sans); font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-foreground); margin: 0 0 12px; }
  .sec { margin-bottom: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/framer-motion@11.18.2/dist/framer-motion.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { CodeBlock, CodeTabs } = window.OxagenDesignSystem_2dfe15;
const tsCode = `import { Oxagen } from "@oxagen/sdk";

// Retrieval is RBAC-scoped to the caller's grants
const ox = new Oxagen(process.env.OXAGEN_KEY);
const ctx = await ox.graph.query(
  "MATCH (u:User)-[:CAN_READ]->(d:Document) RETURN d"
);`;
const pyCode = `from oxagen import Oxagen

ox = Oxagen(os.environ["OXAGEN_KEY"])
ctx = ox.graph.query(
    "MATCH (u:User)-[:CAN_READ]->(d:Document) RETURN d"
)`;
const curlCode = `curl https://api.oxagen.ai/v1/graph/query \\
  -H "Authorization: Bearer $OXAGEN_KEY" \\
  -d '{"cypher": "MATCH (u:User) RETURN u"}'`;
function Demo() {
  return (
    <div>
      <div className="sec">
        <div className="lab">CodeTabs — multi-language</div>
        <CodeTabs tabs={[
          { language: "ts", label: "TypeScript", filename: "client.ts", code: tsCode },
          { language: "py", label: "Python", code: pyCode },
          { language: "curl", label: "cURL", code: curlCode },
        ]} />
      </div>
      <div className="sec">
        <div className="lab">CodeBlock — single listing, line numbers</div>
        <CodeBlock language="cypher" filename="scope.cypher" showLineNumbers code={`// only edges the caller can read\nMATCH (u:User { id: "prn_8fa21c" })\nMATCH (u)-[r:CAN_READ]->(d:Document)\nRETURN d.title, r.confidence`} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
