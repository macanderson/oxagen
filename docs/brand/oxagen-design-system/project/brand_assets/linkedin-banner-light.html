<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  .b { width: 1584px; height: 396px; box-sizing: border-box; position: relative; overflow: hidden;
    display: flex; align-items: center; padding: 0 96px;
    background:
      radial-gradient(40% 120% at 8% 10%, color-mix(in oklch, #7c5aed 16%, transparent), transparent 62%),
      radial-gradient(38% 120% at 96% 96%, color-mix(in oklch, #df2a5d 13%, transparent), transparent 64%),
      #f5f6fa; color: #16191f; }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(20,19,27,.05) 1.4px, transparent 1.4px); background-size: 38px 38px; }
  .left { position: relative; max-width: 60%; }
  .row { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
  .wm { font-family: var(--font-display); font-weight: 500; font-size: 52px; letter-spacing: -.04em; }
  h1 { font-family: var(--font-sans); font-weight: 600; font-size: 46px; line-height: 1.08; letter-spacing: -.025em; margin: 0; }
  .grad { background: var(--grad-nebula); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 14px; font-size: 22px; color: #6b6878; }
  .ring { position: absolute; right: -40px; top: 50%; transform: translateY(-50%); }
</style>
</head>
<body>
  <div class="b">
    <div class="dots"></div>
    <div class="left">
      <div class="row">
        <svg width="56" height="56" viewBox="0 0 100 100" fill="none"><defs><linearGradient id="g" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22b8cf"/><stop offset=".52" stop-color="#7c5aed"/><stop offset="1" stop-color="#df2a5d"/></linearGradient></defs><circle cx="50" cy="50" r="37" stroke="url(#g)" stroke-width="13"/></svg>
        <span class="wm">Oxagen</span>
      </div>
      <h1>Secure context for <span class="grad">AI agents</span>.</h1>
      <div class="sub">Typed knowledge graph · RBAC-scoped retrieval · built for developers</div>
    </div>
    <svg class="ring" width="520" height="520" viewBox="0 0 100 100" fill="none"><defs><linearGradient id="g2" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22b8cf" stop-opacity=".42"/><stop offset=".52" stop-color="#7c5aed" stop-opacity=".42"/><stop offset="1" stop-color="#df2a5d" stop-opacity=".42"/></linearGradient></defs><circle cx="50" cy="50" r="37" stroke="url(#g2)" stroke-width="13"/></svg>
  </div>
</body>
</html>
