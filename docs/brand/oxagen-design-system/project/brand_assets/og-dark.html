<!-- @dsCard group="Social" viewport="1200x630" name="OG image — dark" subtitle="Open Graph / link preview · 1200×630" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  .og { width: 1200px; height: 630px; box-sizing: border-box; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between; padding: 72px;
    background:
      radial-gradient(50% 60% at 12% 6%, color-mix(in oklch, #7c5aed 34%, transparent), transparent 64%),
      radial-gradient(46% 56% at 92% 96%, color-mix(in oklch, #df2a5d 26%, transparent), transparent 66%),
      radial-gradient(40% 50% at 96% 8%, color-mix(in oklch, #22e1ff 20%, transparent), transparent 64%),
      #0b0a11;
    color: #f4f6fb; }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.06) 1.4px, transparent 1.4px); background-size: 34px 34px; }
  .row { position: relative; display: flex; align-items: center; gap: 18px; }
  .mark { width: 64px; height: 64px; }
  .wm { font-family: var(--font-display); font-weight: 500; font-size: 50px; letter-spacing: -.04em; }
  h1 { position: relative; font-family: var(--font-sans); font-weight: 600; font-size: 72px; line-height: 1.04; letter-spacing: -.03em; max-width: 16ch; margin: 0; }
  .grad { background: var(--grad-nebula); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .foot { position: relative; display: flex; align-items: center; gap: 14px; font-size: 24px; color: #aab0c2; }
  .pill { font-size: 19px; color: #c9cdda; border: 1px solid #2a2937; border-radius: 999px; padding: 7px 16px; }
</style>
</head>
<body>
  <div class="og">
    <div class="dots"></div>
    <div class="row">
      <svg class="mark" viewBox="0 0 100 100" fill="none"><defs><linearGradient id="g" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7ce8f4"/><stop offset=".52" stop-color="#9b7bff"/><stop offset="1" stop-color="#df2a5d"/></linearGradient></defs><circle cx="50" cy="50" r="37" stroke="url(#g)" stroke-width="13"/></svg>
      <span class="wm">Oxagen</span>
    </div>
    <h1>Secure context for <span class="grad">AI agents</span>.</h1>
    <div class="foot">
      <span class="pill">Typed knowledge graph</span>
      <span class="pill">RBAC-scoped retrieval</span>
    </div>
  </div>
</body>
</html>
