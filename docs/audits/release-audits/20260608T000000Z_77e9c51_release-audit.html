<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>20260608T000000Z · 77e9c51 · Release Audit</title>
<style>
  :root {
    --bg:#0B1020; --panel:rgba(255,255,255,.04); --border:rgba(255,255,255,.08);
    --fg:#E8EAF2; --muted:#9aa3b2;
    --pass:#3CFF52; --warn:#FFC53C; --fail:#FF5C7A;
    --good:#3CFF52; --fair:#9BE15D; --mid:#FFC53C; --poor:#FF9F45; --crit:#FF5C7A;
    --grad:linear-gradient(135deg,#7182FF,#3CFF52);
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#F7F8FC;--panel:rgba(10,16,32,.03);--border:rgba(10,16,32,.10);--fg:#0B1020;--muted:#5a6478;}
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;padding:40px}
  .wrap{max-width:1120px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
  .grad{height:3px;background:var(--grad);border-radius:3px;margin:18px 0 28px}
  h2{font-size:16px;margin:38px 0 14px}
  .meta{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}

  /* hero readiness band — big, bold, color-coded overall grade */
  .hero{display:flex;align-items:center;gap:30px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 32px}
  .hero .score{font-size:88px;font-weight:800;line-height:.95;letter-spacing:-.03em}
  .hero .score small{font-size:28px;font-weight:600;color:var(--muted);margin-left:4px}
  .hero .verdict{display:flex;flex-direction:column;gap:10px}
  .hero .pill{font-size:22px;font-weight:800;padding:8px 22px;border-radius:999px;
    letter-spacing:.02em;text-transform:uppercase}
  .hero .label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .hero .badge{align-self:flex-start;font-size:14px;padding:5px 14px}

  /* score stat-box grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar,var(--muted))}
  .stat .name{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
  .stat .val{font-size:38px;font-weight:800;line-height:1}
  .stat .val small{font-size:15px;font-weight:600;color:var(--muted)}
  .stat .track{height:6px;border-radius:999px;background:rgba(127,127,127,.18);margin-top:12px;overflow:hidden}
  .stat .fill{height:100%;border-radius:999px}
  .stat .conf{font-size:11px;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.04em}

  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  tr:last-child td{border-bottom:none}
  td.num{font-weight:800;font-size:18px;white-space:nowrap}
  .badge{font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .PASS{color:var(--pass);background:color-mix(in srgb,var(--pass) 14%,transparent)}
  .WARN{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
  .FAIL{color:var(--fail);background:color-mix(in srgb,var(--fail) 14%,transparent)}
  ul{margin:0;padding-left:20px} li{margin:4px 0}
  .foot{color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Oxagen Release Audit</h1>
  <div class="sub"><span class="meta" id="meta"></span><br><span id="reqAt"></span></div>
  <div class="grad"></div>

  <section id="hero"></section>

  <h2>Readiness scores</h2>
  <div class="grid" id="scores"></div>

  <h2>App maturity</h2>
  <table id="appsTbl"><thead><tr><th>App</th><th>Score</th><th>Band</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Package maturity</h2>
  <table id="pkgsTbl"><thead><tr><th>Package</th><th>Score</th><th>Band</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Checks</h2>
  <table id="checksTbl"><thead><tr><th>#</th><th>Check</th><th>Status</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Blockers</h2><ul id="blockers"></ul>
  <h2>Actions taken</h2><ul id="actions"></ul>
  <h2>Needs human</h2><ul id="human"></ul>

  <p class="foot" id="method"></p>
</div>

<script>
const DATA = {
  repo: "oxagen-monorepo", branch: "main", sha: "77e9c51d074095d76143c0c86fc93927c9fc22d3", requestedAt: "2026-06-08 00:00:00 UTC",
  composite: 39,
  verdict: "NO-GO",
  status: "FAIL",
  scores: [
    { name: "Maintainability",     value: 50, conf: "high" },
    { name: "Security",            value: 30, conf: "high" },
    { name: "SOC 2 compliance",    value: 35, conf: "high" },
    { name: "GDPR compliance",     value: 70, conf: "med" },
    { name: "PCI compliance",      value: 70, conf: "med" },
    { name: "Ops / CI maturity",   value: 20, conf: "high" },
    { name: "Observability",       value: 30, conf: "high" },
    { name: "Docs — end-user",     value: 20, conf: "high" },
    { name: "Docs — internal",     value: 40, conf: "high" },
    { name: "Platform stability",  value: 25, conf: "high" }
  ],
  apps: [
    { name: "app", value: 45, finding: "54% line coverage measured; threshold too low at 40%. Needs ratchet to ≥75%. E2E specs good but /mcp endpoint not directly tested." },
    { name: "api", value: 88, finding: "91% lines / 98% branches. PASS. Cache-poisoning risk: STRIPE_TAX_ENABLED missing from override env array in apps/api/turbo.json." },
    { name: "mcp", value: 92, finding: "100% lines / 99% branches. PASS. Missing from vitest.workspace.ts DX impact only." },
    { name: "cli", value: 40, finding: "No unit tests for most commands. 51 commands shipped but CLI parity is not in manifest or checked by check:manifest. 13 wired MCP tools lack CLI equivalents." },
    { name: "docs", value: 85, finding: "PASS. Static site, no runtime tests. CLAUDE.md has stale docs (15→18 gap count, missing developer.* caveat)." }
  ],
  packages: [
    { name: "handlers", value: 72, finding: "CRITICAL: security-audit-arity FAIL in organization.create + workspace.create (wrong function called, silent drop in prod). 2 untested handlers (workspace.invite.send, workspace.member.list) at 0%. Fix arity first." },
    { name: "database", value: 20, finding: "FAIL — 33% line threshold. Schema, migrations, RLS policies are core but under-tested. 3 RLS tables missing from manifest (agent.agent_executions, agent_execution_steps, agent_tool_calls)." },
    { name: "telemetry", value: 25, finding: "FAIL — 40% line threshold. recordSecurityEventAsync misused (wrong arity). Security event layer is the misused-API source; it is under-tested." },
    { name: "auth", value: 55, finding: "WARN — 49% line threshold, below 85% target. Auth is security-critical." },
    { name: "billing", value: 60, finding: "WARN — 62% line threshold, below 85% target. Privileged mutations. Cache poisoning risk: STRIPE_TAX_ENABLED not in apps/mcp/turbo.json env override." },
    { name: "sandbox", value: 20, finding: "FAIL — 37% line threshold. Implementation class untested." },
    { name: "ontology", value: 75, finding: "PASS. Graph queries reasonable coverage. Neo4j driver properly isolated." },
    { name: "ui", value: 88, finding: "PASS. Base UI components well-tested." },
    { name: "storage", value: 80, finding: "PASS. Vercel Blob adapter isolated; no vendor lock." },
    { name: "ai", value: 85, finding: "PASS. AI Gateway provider usage through adapters. modelIdOf() enforced." },
    { name: "mcp", value: 92, finding: "PASS. Tool definitions well-typed." }
  ],
  checks: [
    { n: 1, name: "Overengineering", status: "WARN", finding: "StorageAdapter, BillingProvider single-impl interfaces. Justified vendor-neutral seams but depth disproportionate today." },
    { n: 2, name: "NotImplemented", status: "WARN", finding: "14 stub handlers return synthetic data. image.analyze literal string 'Stub analysis...' bleeds to user output. Tracked but not-thrown WARNs only." },
    { n: 3, name: "Vendor lock", status: "PASS", finding: "All vendor SDKs (Stripe, Neo4j, AI) confined to adapter boundaries. No direct vendor calls in domain/route code." },
    { n: 4, name: "Dead schema", status: "WARN", finding: "org_billing_profiles is write-only; never read after org creation. Dead-read table." },
    { n: 5, name: "Append-only hygiene", status: "WARN", finding: "credit_ledger + usage_records lack time-based partitioning / retention. High-volume append-only with no strategy." },
    { n: 6, name: "SOC 2 risks", status: "WARN", finding: "CRITICAL: organization.create + workspace.create call recordSecurityEventAsync with wrong arity (1 arg, should be 2) — audit events silently dropped in prod. Also: Modal credentials in ops/.env, RLS flag can default to false, ClickHouse HTTP not enforced." },
    { n: 7, name: "RLS / tenant scoping", status: "FAIL", finding: "agent.agent_executions, agent_execution_steps, agent_tool_calls added by migration 0019 with org-only RLS (should be standard) and NOT in POLICY_MANIFEST. Workspace-level isolation gap." },
    { n: 11, name: "Skill adherence", status: "FAIL", finding: "organization.create + workspace.create call wrong lower-level function with wrong arity. Tests do not assert security events emitted. Silent audit trail breach." },
    { n: 12, name: "Regressions", status: "PASS", finding: "26 affected tasks green. 1907 tests in @oxagen/app pass. 283 tests in @oxagen/handlers pass. No regressions detected by CI." },
    { n: 13, name: "Test coverage", status: "FAIL", finding: "6 packages below 85% floor: database (33%), telemetry (40%), sandbox (37%), auth (49%), billing (62%), app (54%). 2 whole modules at 0%: workspace.invite.send, workspace.member.list." },
    { n: 15, name: "Turbo cache hygiene", status: "FAIL", finding: "STRIPE_TAX_ENABLED undeclared in apps/api/turbo.json and apps/mcp/turbo.json build.env overrides — cache poisoning risk. Root 'test' task has no inputs. apps/mcp + apps/cli missing from vitest.workspace.ts." },
    { n: 16, name: "Remote cache", status: "PASS", finding: "Single TURBO_TOKEN + TURBO_TEAM for CI and all Vercel projects. teamId consistent. turbo-ignore wired." },
    { n: 17, name: "PR build-time budget", status: "PASS", finding: "test:unit ~16s locally. CI ~4-6 min total. E2e lane long pole at ~20-30 min with workers:1. Increase workers:2-4." },
    { n: 18, name: "Test lane separation", status: "WARN", finding: "E2e job runs on every PR push (not pre-merge only). Moves 44-spec Playwright suite off PR lane per policy." },
    { n: 19, name: "E2e critical paths", status: "PASS", finding: "Auth, tenant isolation, MCP parity, billing all covered. WARN: no spec hits /mcp streamable HTTP endpoint directly." },
    { n: 22, name: "CI on main", status: "FAIL", finding: "4 of 5 recent push runs failed. E2e shards 1 + 3 are recurring blockers. ci-nightly cancelled at e2e stage (unit/typecheck/build were green)." },
    { n: 23, name: "Open PRs", status: "PASS", finding: "No open PRs. Zero review thread gaps." },
    { n: 20, name: "Stale docs — CLAUDE.md", status: "FAIL", finding: "Gap count says '15 wired capabilities lack docs' but actual is 18. Parity caveat omits developer.* stubs. check:manifest description omits CLI." },
    { n: 20, name: "Stale docs — AGENTS.md", status: "FAIL", finding: "CLI description entirely wrong: says '1 command (oxagen dev)' but ships 51. Capability-wiring guide omits CLI." },
    { n: 14, name: "Headless parity", status: "FAIL", finding: "13 plugin-management tools + video.generate + svg.generate + documents.* + image.generate + workflow.cancel/status + agent.memory/task/plan + workspace.model.settings/invite.accept + org.member.invite all lack CLI commands." },
    { n: 21, name: "Missing guidance", status: "FAIL", finding: "No CLI parity rule in CLAUDE.md. check:manifest title says 'API↔MCP parity' only. db:reset, db:check, test:coverage, test:e2e absent from Common Commands." }
  ],
  blockers: [
    "<strong>CRITICAL: Security audit silent drop in production.</strong> organization.create.ts:139 and workspace.create.ts:98 call recordSecurityEventAsync({...}) with 1 argument. Correct signature is recordSecurityEventAsync(insert, event) with 2 args. At runtime the event object is passed as insert, causing 'insert is not a function' error. Audit events silently drop in prod. Tests do not assert emission occurred. Fix: replace with emitSecurityEvent({...}) from @oxagen/database/security.",
    "<strong>RLS workspace-isolation gap.</strong> agent.agent_executions, agent_execution_steps, agent_tool_calls (migration 0019) use org-only RLS predicate (should be standard org+workspace) and are missing from POLICY_MANIFEST. Workspace members in the same org can read each other's execution records.",
    "<strong>Cache poisoning: STRIPE_TAX_ENABLED undeclared.</strong> apps/api/turbo.json and apps/mcp/turbo.json override build.env but omit STRIPE_TAX_ENABLED. Consumed at runtime by @oxagen/billing. Change to STRIPE_TAX_ENABLED will not invalidate cached api/mcp builds.",
    "<strong>6 packages below 85% coverage floor.</strong> database (33%), telemetry (40%), sandbox (37%), auth (49%), billing (62%), app (54%). database + telemetry are the most critical gaps.",
    "<strong>E2e job runs on every PR push.</strong> Per policy, e2e (heavy 44-spec Playwright suite) should run pre-merge only, not on every push to PR branch. Inflates CI cost.",
    "<strong>CI on main is red:</strong> 4 of 5 recent push runs failed. E2e shards 1 and 3 are recurring blockers. nightly run cancelled at e2e stage; unit/typecheck/build were all green."
  ],
  actions: [],
  human: [
    "Fix recordSecurityEventAsync arity in organization.create.ts:139 and workspace.create.ts:98 before deploying. This is a SOC2-blocking audit trail breach.",
    "Confirm RLS scope for agent.agent_* tables (should be standard org+workspace, not org-only). Add to POLICY_MANIFEST if fixing.",
    "Add STRIPE_TAX_ENABLED to build.env overrides in apps/api/turbo.json and apps/mcp/turbo.json to resolve cache poisoning.",
    "Decide whether to move e2e job gate from every-push to pre-merge-only (policy-compliant) or keep current (cost vs coverage trade-off).",
    "Prioritize test coverage ratcheting: database (33→85%), telemetry (40→85%), sandbox (37→85%) are the most critical. app (40→75%), auth (49→75%), billing (62→75%) are secondary.",
    "Stale docs: Fix CLAUDE.md gap count (15→18), add developer.* to parity caveat, add CLI guidance, update AGENTS.md CLI description from '1 cmd' to '51 commands'. Verify CLI parity gaps (13 plugin tools, video.generate, etc.) are tracked in Linear.",
    "Investigate e2e shard 1 + 3 recurring failures on main. The ci-nightly run shows unit/typecheck/build all green, so the issue is isolated to e2e."
  ]
};

function band(v){
  if(v>=90) return {label:"Excellent", col:"var(--good)"};
  if(v>=75) return {label:"Good",      col:"var(--fair)"};
  if(v>=60) return {label:"Fair",      col:"var(--mid)"};
  if(v>=40) return {label:"Poor",      col:"var(--poor)"};
  return        {label:"Critical",  col:"var(--crit)"};
}
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};

document.getElementById("meta").textContent = `${DATA.repo} · ${DATA.branch} · ${DATA.sha}`;
document.getElementById("reqAt").textContent = `Requested ${DATA.requestedAt}`;

(function(){
  const b = band(DATA.composite);
  const vcol = DATA.verdict==="GO" ? "var(--pass)" : "var(--fail)";
  document.getElementById("hero").innerHTML = `
    <div class="hero">
      <div>
        <div class="label">Release readiness</div>
        <div class="score" style="color:${b.col}">${DATA.composite}<small>/100</small></div>
      </div>
      <div class="verdict">
        <span class="pill" style="color:${vcol};background:color-mix(in srgb,${vcol} 16%,transparent)">${DATA.verdict}</span>
        <span class="badge ${DATA.status}">${DATA.status}</span>
        <span class="label">${b.label}</span>
      </div>
    </div>`;
})();

document.getElementById("scores").append(...DATA.scores.map(s=>{
  const b = band(s.value);
  const box = el("div","stat");
  box.style.setProperty("--bar", b.col);
  box.append(
    el("div","name", s.name),
    el("div","val", `${s.value}<small>/100</small>`),
    (()=>{const t=el("div","track"),f=el("div","fill"); f.style.width=s.value+"%"; f.style.background=b.col; t.append(f); return t;})(),
    el("div","conf", `${b.label} · confidence ${s.conf}`)
  );
  return box;
}));

function fillMaturity(tblId, rows){
  const tb = document.querySelector(`#${tblId} tbody`);
  if(!rows.length){ tb.append(el("tr",null,`<td colspan="4" style="color:var(--muted)">No projects found.</td>`)); return; }
  rows.forEach(r=>{
    const b = band(r.value);
    tb.append(el("tr",null,
      `<td><span class="meta">${r.name}</span></td>`+
      `<td class="num" style="color:${b.col}">${r.value}</td>`+
      `<td>${b.label}</td><td>${r.finding||""}</td>`));
  });
}
fillMaturity("appsTbl", DATA.apps);
fillMaturity("pkgsTbl", DATA.packages);

(function(){
  const tb = document.querySelector("#checksTbl tbody");
  DATA.checks.forEach(c=> tb.append(el("tr",null,
    `<td>${c.n}</td><td>${c.name}</td>`+
    `<td><span class="badge ${c.status}">${c.status}</span></td><td>${c.finding||""}</td>`)));
})();

const li = (id,items,fallback)=>{
  const ul=document.getElementById(id);
  if(!items.length){ ul.append(el("li",null,`<span style="color:var(--muted)">${fallback}</span>`)); return; }
  items.forEach(t=> ul.append(el("li",null,t)));
};
li("blockers", DATA.blockers, "No blockers.");
li("actions",  DATA.actions,  "No actions taken.");
li("human",    DATA.human,    "Nothing pending.");

document.getElementById("method").textContent =
  "Scoring: each score starts at 100 and is deducted by severity of findings across 6 parallel auditors (architecture, compliance, code quality, test coverage, CI/CD, docs/parity). FAILs in critical areas (security, audit trail, coverage, parity) drive scores to 0-40 range. Composite is the weighted roll-up; any unresolved blocker forces NO-GO verdict. Bands: ≥90 Excellent · 75–89 Good · 60–74 Fair · 40–59 Poor · <40 Critical.";
</script>
</body>
</html>
