<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>20260607 · Release Audit</title>
<style>
  :root {
    --bg:#0B1020; --panel:rgba(255,255,255,.04); --border:rgba(255,255,255,.08);
    --fg:#E8EAF2; --muted:#9aa3b2;
    --pass:#3CFF52; --warn:#FFC53C; --fail:#FF5C7A;
    --good:#3CFF52; --fair:#9BE15D; --mid:#FFC53C; --poor:#FF9F45; --crit:#FF5C7A;
    --grad:linear-gradient(135deg,#7182FF,#3CFF52);
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#F7F8FC;--panel:rgba(10,16,32,.03);--border:rgba(10,16,32,.10);--fg:#0B1020;--muted:#5a6478;}
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;padding:40px}
  .wrap{max-width:1120px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
  .grad{height:3px;background:var(--grad);border-radius:3px;margin:18px 0 28px}
  h2{font-size:16px;margin:38px 0 14px}
  .meta{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}

  /* hero readiness band — big, bold, color-coded overall grade */
  .hero{display:flex;align-items:center;gap:30px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 32px}
  .hero .score{font-size:88px;font-weight:800;line-height:.95;letter-spacing:-.03em}
  .hero .score small{font-size:28px;font-weight:600;color:var(--muted);margin-left:4px}
  .hero .verdict{display:flex;flex-direction:column;gap:10px}
  .hero .pill{font-size:22px;font-weight:800;padding:8px 22px;border-radius:999px;
    letter-spacing:.02em;text-transform:uppercase}
  .hero .label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .hero .badge{align-self:flex-start;font-size:14px;padding:5px 14px}

  /* score stat-box grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar,var(--muted))}
  .stat .name{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
  .stat .val{font-size:38px;font-weight:800;line-height:1}
  .stat .val small{font-size:15px;font-weight:600;color:var(--muted)}
  .stat .track{height:6px;border-radius:999px;background:rgba(127,127,127,.18);margin-top:12px;overflow:hidden}
  .stat .fill{height:100%;border-radius:999px}
  .stat .conf{font-size:11px;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.04em}

  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  tr:last-child td{border-bottom:none}
  td.num{font-weight:800;font-size:18px;white-space:nowrap}
  .badge{font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .PASS{color:var(--pass);background:color-mix(in srgb,var(--pass) 14%,transparent)}
  .WARN{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
  .FAIL{color:var(--fail);background:color-mix(in srgb,var(--fail) 14%,transparent)}
  ul{margin:0;padding-left:20px} li{margin:4px 0}
  .foot{color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Oxagen Release Audit</h1>
  <div class="sub"><span class="meta" id="meta"></span><br><span id="reqAt"></span></div>
  <div class="grad"></div>

  <section id="hero"></section>

  <h2>Readiness scores</h2>
  <div class="grid" id="scores"></div>

  <h2>App maturity</h2>
  <table id="appsTbl"><thead><tr><th>App</th><th>Score</th><th>Band</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Package maturity</h2>
  <table id="pkgsTbl"><thead><tr><th>Package</th><th>Score</th><th>Band</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Checks</h2>
  <table id="checksTbl"><thead><tr><th>#</th><th>Check</th><th>Status</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Blockers</h2><ul id="blockers"></ul>
  <h2>Actions taken</h2><ul id="actions"></ul>
  <h2>Needs human</h2><ul id="human"></ul>

  <p class="foot" id="method"></p>
</div>

<script>
const DATA = {
  repo: "oxagen-monorepo", branch: "main", sha: "HEAD", requestedAt: "2026-06-07T00:00:00Z",
  composite: 48,
  verdict: "NO-GO",
  status: "FAIL",
  scores: [
    { name: "Maintainability",     value: 68, conf: "high" },
    { name: "Security",            value: 58, conf: "high" },
    { name: "SOC 2 compliance",    value: 52, conf: "high" },
    { name: "GDPR compliance",     value: 62, conf: "med" },
    { name: "PCI compliance",      value: 88, conf: "high" },
    { name: "Ops / CI maturity",   value: 62, conf: "high" },
    { name: "Observability",       value: 78, conf: "high" },
    { name: "Docs — end-user",     value: 72, conf: "med" },
    { name: "Docs — internal",     value: 68, conf: "high" },
    { name: "Platform stability",  value: 48, conf: "high" }
  ],
  apps: [
    { name: "app", value: 58, finding: "Main CI failing (3 errors); CLI coverage gap (72.76% lines); RLS + billing logic sound but blocked by CI" },
    { name: "api", value: 85, finding: "Routes wired, contracts parity checked, coverage adequate (92% lines)" },
    { name: "mcp", value: 86, finding: "Tool wiring complete, parity verified, coverage at 91% lines" },
    { name: "cli", value: 52, finding: "22 commands at parity; 6 tests failing (async not awaited); coverage 72.76% lines (below 85% target)" }
  ],
  packages: [
    { name: "database", value: 78, finding: "0020 + 0021 drop all orphan tables; 47 scoped tables with RLS ENABLE + FORCE; tenant-policy.manifest clean" },
    { name: "handlers", value: 62, finding: "7 plugin handlers use withSystemDb instead of withTenantDb; 7 lack domain-specific security events" },
    { name: "billing", value: 92, finding: "Coverage 94.37% lines / 82.01% branches; 2 handlers lack audit trail at checkout initiation" },
    { name: "auth", value: 44, finding: "Coverage 44% lines (below 70% threshold); tests insufficient" },
    { name: "telemetry", value: 40, finding: "Coverage 40% lines (below 70% threshold); needs test expansion" },
    { name: "sandbox", value: 37, finding: "Coverage 37% lines (critical); incomplete test suite" },
    { name: "ui", value: 76, finding: "Component library stable; no dead code or overengineering found" },
    { name: "inngest-functions", value: 52, finding: "Main CI eslint exit 1; CapabilityContext missing conversationId on PDF handler" },
    { name: "compliance", value: 85, finding: "SECURITY_EVENT_TYPES well-structured; lacks plugin.* and billing audit event types for domain events" }
  ],
  checks: [
    { n: 1, name: "Overengineering", status: "PASS", finding: "No single-implementation interfaces, factories with one product, or premature generics found." },
    { n: 2, name: "NotImplemented stubs", status: "PASS", finding: "No unimplemented!(), todo!(), panic!(\"not\"), or NotImplementedError on reachable code paths." },
    { n: 3, name: "Vendor lock", status: "PASS", finding: "Stripe, Google, GitHub SDKs imported only through adapters (billing, config). No direct calls in domain code." },
    { n: 4, name: "Dead schema", status: "FAIL", finding: "src/migrations/0014 and 0015 are dead code (unreachable by db-migrate); deleted. Created 0021 to drop 6 remaining orphan tables." },
    { n: 5, name: "Append-only hygiene", status: "WARN", finding: "ClickHouse events / traces / ledger lack explicit partition/TTL strategy; recommend time-based partitioning." },
    { n: 6, name: "SOC 2 risks", status: "WARN", finding: "e2e logs leak 15-char BETTER_AUTH_SECRET + 50-char DATABASE_URL; CLI prints live API keys intentionally (UX); 7 plugin + 2 billing handlers lack domain-specific audit events." },
    { n: 7, name: "RLS / tenant scoping", status: "PASS", finding: "All 47 scoped tables have RLS ENABLE + FORCE with tenant_isolation policies. POLICY_MANIFEST matches live schema. No data isolation gaps." },
    { n: 8, name: "Infra spend", status: "PASS", finding: "Modal sandbox scales to zero; Docker local; no GPU, multi-region, or managed AlloyDB/Neo4j tier. Cost-efficient for pre-revenue stage." },
    { n: 9, name: "Portability", status: "PASS", finding: "No Terraform/Pulumi vendor lock; Postgres/Neo4j/ClickHouse all portable; Vercel app is portable via Next.js standard." },
    { n: 10, name: "Env vars & secrets", status: "WARN", finding: "turbo.json declares all consumed vars (STRIPE_TAX_ENABLED, LOG_LEVEL, etc.); .env.example reflects reality; root has all keys documented." },
    { n: 11, name: "Skill adherence", status: "WARN", finding: "oxagen-engineering-policy: admin/website packages removed ✓, dead migrations deleted ✓, RLS sound ✓. CLAUDE.md/AGENTS.md stale (4 apps → 2, admin/website removed)." },
    { n: 12, name: "Regressions", status: "FAIL", finding: "Main CI red: (1) inngest-functions eslint exit 1, (2) TS2339 conversationId missing on CapabilityContext handlers/documents.pdf.create.ts:157, (3) billing test missing payment method fixture." },
    { n: 13, name: "Test coverage", status: "FAIL", finding: "CLI 72.76% lines / 61.11% branches (target 85/80); auth 44%, telemetry 40%, sandbox 37% (all <70%). 6 CLI tests failing (Commander async not awaited)." },
    { n: 14, name: "Headless parity", status: "FAIL", finding: "9 UI-only billing/account/security actions missing from API/MCP. 6 dead contracts defined but unwired (not reachable). API↔MCP parity verified for wired contracts." },
    { n: 15, name: "Turborepo correctness", status: "WARN", finding: "turbo.json has explicit inputs/outputs; dependsOn correct; env list complete (fixed STRIPE_TAX_ENABLED, LOG_LEVEL, KNOWLEDGE_GRAPH_ENABLED). Cache hits adequate." },
    { n: 16, name: "Remote cache", status: "PASS", finding: "CI and Vercel both use TURBO_TOKEN + TURBO_TEAM; cache hits >70% on stable PRs. Vercel runs turbo run build --filter=app." },
    { n: 17, name: "PR build time", status: "WARN", finding: "Affected graph (database migration only) <30s. Full build budget: 12–18 min (typecheck, test, build in parallel); default 8 min budget sufficient." },
    { n: 18, name: "Test lane separation", status: "PASS", finding: "PR lane: unit + contract tests (fast). Pre-merge: e2e Playwright sharded. Nightly: full suite. No heavy e2e on every PR." },
    { n: 19, name: "E2e critical paths", status: "WARN", finding: "Auth & tenant isolation covered; MCP parity missing (no e2e for dead contracts); billing e2e present. Recommend e2e for wired capability surfaces." },
    { n: 20, name: "Stale docs", status: "FAIL", finding: "CLAUDE.md claims 4 Next apps (app, website, api, admin); 2 exist (app, api). Website/admin removed. AGENTS.md implies apps/admin exists. Update required." },
    { n: 21, name: "Missing agent guidance", status: "WARN", finding: "Propose: (1) doc tenancy boundary (withTenantDb/withSystemDb), (2) RLS ENABLE+FORCE intent, (3) audit event emission pattern, (4) handler security event checklist." },
    { n: 22, name: "CI on main", status: "FAIL", finding: "Last 5 runs: RED. Blockers: inngest-functions eslint, CapabilityContext TS2339, billing test fixture. Must fix before release." },
    { n: 23, name: "Open PRs", status: "PASS", finding: "0 open PRs. No review threads or conflicts to resolve." },
    { n: 24, name: "Mark ready / merge", status: "BLOCKED", finding: "Phase 8 gated on main CI green and overall score >85. Current: 48/100 (5+ blockers). Cannot proceed to merge until CI fixed." }
  ],
  blockers: [
    "<strong>Main CI failures (Phase 7, check 22):</strong> 3 distinct errors: (1) inngest-functions eslint exit 1, (2) TS2339 conversationId missing on CapabilityContext, (3) billing test missing payment method fixture. Blocker classification: FAIL. Impact: release blocked.",
    "<strong>CLI test failures (Phase 4, check 13):</strong> 6 failing tests (Commander async not awaited). Coverage 72.76% lines / 61.11% branches (target 85/80). Blocker classification: FAIL. Impact: CLI parity incomplete.",
    "<strong>Coverage gaps (Phase 4, check 13):</strong> auth 44%, telemetry 40%, sandbox 37% all below 70% threshold. Blocker classification: FAIL. Impact: packages untestable.",
    "<strong>Stale documentation (Phase 6, check 20):</strong> CLAUDE.md claims 4 Next apps, website/admin sections present; 2 exist. AGENTS.md implies admin. Blocker classification: FAIL. Impact: agent confusion, outdated guidance.",
    "<strong>Dead contract parity gap (Phase 4, check 14):</strong> 6 contracts defined but unwired (not reachable from API/MCP/UI). 9 UI-only actions lacking API/MCP surfaces. Blocker classification: FAIL. Impact: no-drift principle violated.",
    "<strong>Plugin handler security (Phase 2, check 6):</strong> 7 plugin handlers use withSystemDb (RLS bypass) instead of withTenantDb. Single-point-of-failure if IAM_ENFORCEMENT_ENABLED=false. Blocker classification: FAIL. Impact: tenant isolation risk."
  ],
  actions: [
    "Deleted /packages/database/src/migrations/0014_agent_executions.sql (dead code, unreachable by db-migrate).",
    "Deleted /packages/database/src/migrations/0015_drop_dead_schemas.sql (dead code, superseded by drizzle/ migrations).",
    "Created /packages/database/drizzle/0021_drop_remaining_orphan_tables.sql to drop content.documents, agent.tools, workflow.*, event.*, integration.connections, execution schema. Applied successfully.",
    "Updated /packages/database/src/tenant-policy.manifest.ts to remove entries for dropped tables and add migration notes."
  ],
  human: [
    "<strong>Fix main CI (blocker):</strong> (1) inngest-functions eslint: run `pnpm lint --filter=@oxagen/inngest-functions`. (2) CapabilityContext TS2339 conversationId: add field to handlers/documents.pdf.create.ts:157. (3) billing test fixture: add payment method to test setup.",
    "<strong>Fix CLI test failures (blocker):</strong> 6 tests failing; Commander actions not awaited in src/commands/. Fix async/await, then re-run tests. Target 85% lines / 80% branch coverage.",
    "<strong>Expand auth/telemetry/sandbox test coverage (blocker):</strong> auth 44% → 85%, telemetry 40% → 85%, sandbox 37% → 85%. Add real assertions (not assertion-light tests).",
    "<strong>Update CLAUDE.md (blocker):</strong> Remove claims about 4 Next apps, website/admin sections. Update to reflect 2 existing apps (app, api).",
    "<strong>Update AGENTS.md (blocker):</strong> Remove references to apps/admin which was deleted.",
    "<strong>Refactor plugin handlers to use withTenantDb (blocker):</strong> 7 handlers currently use withSystemDb; migrate to withTenantDb for RLS enforcement. Verify IAM layer is sole backup.",
    "<strong>Add domain-specific audit events (blocker):</strong> Define plugin.* and billing.* event types in SECURITY_EVENT_TYPES. Emit from 7 plugin handlers and 2 billing handlers. Needed for SOC 2 CC6.3 audit trail.",
    "<strong>Add e2e coverage for critical paths (Phase 5, check 19):</strong> Auth ✓, tenant isolation ✓, billing ✓. MCP parity e2e missing (6 dead contracts unwired). Add e2e for wired capability surfaces.",
    "<strong>Confirm Phase 8 gating (user decision):</strong> Release-readiness composite is 48/100 (NO-GO). 6+ unresolved blockers. Phase 8 (mark ready / merge / deploy) is gated until score >85 and all FAILs resolved. User approval required to proceed."
  ]
};

function band(v){
  if(v>=90) return {label:"Excellent", col:"var(--good)"};
  if(v>=75) return {label:"Good",      col:"var(--fair)"};
  if(v>=60) return {label:"Fair",      col:"var(--mid)"};
  if(v>=40) return {label:"Poor",      col:"var(--poor)"};
  return        {label:"Critical",  col:"var(--crit)"};
}
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};

document.getElementById("meta").textContent = `${DATA.repo} · ${DATA.branch} · ${DATA.sha}`;
document.getElementById("reqAt").textContent = `Requested ${DATA.requestedAt}`;

(function(){
  const b = band(DATA.composite);
  const vcol = DATA.verdict==="GO" ? "var(--pass)" : "var(--fail)";
  document.getElementById("hero").innerHTML = `
    <div class="hero">
      <div>
        <div class="label">Release readiness</div>
        <div class="score" style="color:${b.col}">${DATA.composite}<small>/100</small></div>
      </div>
      <div class="verdict">
        <span class="pill" style="color:${vcol};background:color-mix(in srgb,${vcol} 16%,transparent)">${DATA.verdict}</span>
        <span class="badge ${DATA.status}">${DATA.status}</span>
        <span class="label">${b.label}</span>
      </div>
    </div>`;
})();

document.getElementById("scores").append(...DATA.scores.map(s=>{
  const b = band(s.value);
  const box = el("div","stat");
  box.style.setProperty("--bar", b.col);
  box.append(
    el("div","name", s.name),
    el("div","val", `${s.value}<small>/100</small>`),
    (()=>{const t=el("div","track"),f=el("div","fill"); f.style.width=s.value+"%"; f.style.background=b.col; t.append(f); return t;})(),
    el("div","conf", `${b.label} · confidence ${s.conf}`)
  );
  return box;
}));

function fillMaturity(tblId, rows){
  const tb = document.querySelector(`#${tblId} tbody`);
  if(!rows.length){ tb.append(el("tr",null,`<td colspan="4" style="color:var(--muted)">No projects found.</td>`)); return; }
  rows.forEach(r=>{
    const b = band(r.value);
    tb.append(el("tr",null,
      `<td><span class="meta">${r.name}</span></td>`+
      `<td class="num" style="color:${b.col}">${r.value}</td>`+
      `<td>${b.label}</td><td>${r.finding||""}</td>`));
  });
}
fillMaturity("appsTbl", DATA.apps);
fillMaturity("pkgsTbl", DATA.packages);

(function(){
  const tb = document.querySelector("#checksTbl tbody");
  DATA.checks.forEach(c=> tb.append(el("tr",null,
    `<td>${c.n}</td><td>${c.name}</td>`+
    `<td><span class="badge ${c.status}">${c.status}</span></td><td>${c.finding||""}</td>`)));
})();

const li = (id,items,fallback)=>{
  const ul=document.getElementById(id);
  if(!items.length){ ul.append(el("li",null,`<span style="color:var(--muted)">${fallback}</span>`)); return; }
  items.forEach(t=> ul.append(el("li",null,t)));
};
li("blockers", DATA.blockers, "No blockers.");
li("actions",  DATA.actions,  "No actions taken.");
li("human",    DATA.human,    "Nothing pending.");

document.getElementById("method").textContent =
  "Scoring: each score starts at 100 and deducts per finding (FAIL −15…−25 by blast radius, WARN −5…−10), floored at 0. Bands: ≥90 Excellent · 75–89 Good · 60–74 Fair · 40–59 Poor · <40 Critical. Composite is severity-weighted average across 10 dimensions; any unresolved blocker-class finding forces NO-GO. Phase 8 (mark ready, merge, deploy watch) is gated on score >85 and zero FAILs remaining.";
</script>
</body>
</html>
