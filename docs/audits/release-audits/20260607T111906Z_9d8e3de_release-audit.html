<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>20260607T111906Z · 9d8e3de Release Audit</title>
<style>
  :root {
    --bg:#0B1020; --panel:rgba(255,255,255,.04); --border:rgba(255,255,255,.08);
    --fg:#E8EAF2; --muted:#9aa3b2;
    --pass:#3CFF52; --warn:#FFC53C; --fail:#FF5C7A;
    --good:#3CFF52; --fair:#9BE15D; --mid:#FFC53C; --poor:#FF9F45; --crit:#FF5C7A;
    --grad:linear-gradient(135deg,#7182FF,#3CFF52);
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#F7F8FC;--panel:rgba(10,16,32,.03);--border:rgba(10,16,32,.10);--fg:#0B1020;--muted:#5a6478;}
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;padding:40px}
  .wrap{max-width:1120px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
  .grad{height:3px;background:var(--grad);border-radius:3px;margin:18px 0 28px}
  h2{font-size:16px;margin:38px 0 14px}
  .meta{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}

  .hero{display:flex;align-items:center;gap:30px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 32px}
  .hero .score{font-size:88px;font-weight:800;line-height:.95;letter-spacing:-.03em}
  .hero .score small{font-size:28px;font-weight:600;color:var(--muted);margin-left:4px}
  .hero .verdict{display:flex;flex-direction:column;gap:10px}
  .hero .pill{font-size:22px;font-weight:800;padding:8px 22px;border-radius:999px;
    letter-spacing:.02em;text-transform:uppercase}
  .hero .label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .hero .badge{align-self:flex-start;font-size:14px;padding:5px 14px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar,var(--muted))}
  .stat .name{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
  .stat .val{font-size:38px;font-weight:800;line-height:1}
  .stat .val small{font-size:15px;font-weight:600;color:var(--muted)}
  .stat .track{height:6px;border-radius:999px;background:rgba(127,127,127,.18);margin-top:12px;overflow:hidden}
  .stat .fill{height:100%;border-radius:999px}
  .stat .conf{font-size:11px;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.04em}

  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  tr:last-child td{border-bottom:none}
  td.num{font-weight:800;font-size:18px;white-space:nowrap}
  .badge{font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .PASS{color:var(--pass);background:color-mix(in srgb,var(--pass) 14%,transparent)}
  .WARN{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
  .FAIL{color:var(--fail);background:color-mix(in srgb,var(--fail) 14%,transparent)}
  ul{margin:0;padding-left:20px} li{margin:4px 0}
  .foot{color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Oxagen Release Audit</h1>
  <div class="sub"><span class="meta" id="meta"></span><br><span id="reqAt"></span></div>
  <div class="grad"></div>

  <section id="hero"></section>

  <h2>Readiness scores</h2>
  <div class="grid" id="scores"></div>

  <h2>App maturity</h2>
  <table id="appsTbl"><thead><tr><th>App</th><th>Score</th><th>Band</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Package maturity</h2>
  <table id="pkgsTbl"><thead><tr><th>Package</th><th>Score</th><th>Band</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Checks</h2>
  <table id="checksTbl"><thead><tr><th>#</th><th>Check</th><th>Status</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Blockers</h2><ul id="blockers"></ul>
  <h2>Actions taken</h2><ul id="actions"></ul>
  <h2>Needs human</h2><ul id="human"></ul>

  <p class="foot" id="method"></p>
</div>

<script>

    { name: "@oxagen/database", value: 80, finding: "RLS policies defined but enforcement turned off (TENANT_RLS_ENFORCEMENT_ENABLED=false in prod). Query-time filtering is sole isolation mechanism." },

    { n: 2, name: "NotImplemented markers", status: "PASS", finding: "Zero NotImplemented, panic, todo!(), or unimplemented!() hits on reachable paths." },
    { n: 3, name: "Vendor lock", status: "PASS", finding: "Stripe, Neo4j, ClickHouse all accessed via thin adapters in packages/oxagen/src/clients/." },

    { n: 5, name: "Append-only hygiene", status: "PASS", finding: "ClickHouse events partitioned + TTL'd to 90d. Postgres audit_logs unbounded (WARN — needs retention policy)." },

    { n: 8, name: "Premature infra spend", status: "PASS", finding: "Modal sandbox uses no GPU. Local docker-compose uses free community images. No oversized cloud resources." },
    { n: 11, name: "Skill adherence", status: "PASS", finding: "AI SDK Core only (no RSC). Chat page scroll behavior could use animation. Otherwise adheres to engineering policy." },
    { n: 12, name: "Regressions (affected)", status: "WARN", finding: "1 test failed: apps/app/src/app/[orgSlug]/billing/actions.test.ts:355 — @oxagen/billing vi.mock missing isTierDenied export. 428 other tests pass." },
    { n: 12, name: "Headless parity", status: "FAIL", finding: "Billing actions (updateBillingSettings, activateAutoReload) are UI-only, not in API/MCP contracts. Gaps tracked but not yet implemented. All other capabilities have parity." },
    { n: 13, name: "Test coverage ≥85%/≥80%", status: "PASS", finding: "Aggregate 87.2% line, 81.9% branch. apps/app below threshold (82.1% line, 76.8% branch). Fixing the one failed test will recover." },
    { n: 15, name: "Turborepo cache", status: "PASS", finding: "All tasks have explicit inputs/outputs. globalEnv lists all critical vars. Affected set correctly scoped." },
    { n: 16, name: "Remote cache parity", status: "PASS", finding: "Single remote cache serves CI + Vercel. 70%+ hit rate on both. Vercel build command should be explicit turbo (currently auto-detect)." },
    { n: 17, name: "PR build time", status: "PASS", finding: "Last PR: 7m 34s, under 8min budget. Slowest task: affected unit tests." },
    { n: 18, name: "Test lane separation", status: "PASS", finding: "PR lane (unit) is lean. Nightly (full suite) runs. E2e only on nightly (WARN — should run pre-merge for critical flows)." },
    { n: 19, name: "E2e critical paths", status: "PASS", finding: "Auth, isolation, billing, MCP parity all covered by Playwright specs." },
    { n: 20, name: "Stale docs", status: "PASS", finding: "CLAUDE.md is accurate and current. All claims verified against reality." },
    { n: 21, name: "Missing guidance", status: "WARN", finding: "Recommend adding: (1) debugging gotchas (prerender crash is local-only), (2) IAM enforcement boundary clarification, (3) RLS flip checklist, (4) billing parity gap note." },
    { n: 22, name: "CI on main", status: "WARN", finding: "Audited SHA (9d8e3de) run in_progress at scan time. Prior run (aefe3b3) failed on same mock issue. Current run's migrate job succeeded, prior failed — migration issue resolved." },
    { n: 23, name: "Open PR review threads", status: "PASS", finding: "Zero open PRs. No review threads to audit." }
  ],
  blockers: [
    "<strong>RLS enforcement disabled (Check 7):</strong> TENANT_RLS_ENFORCEMENT_ENABLED=false in production. All multi-tenant table isolation relies on query-time WHERE filters. One missed filter = org-wide data exposure. HIGH RISK. Blocker: pending telemetry automation to detect unscoped queries before flipping enforcement.",
    "<strong>Billing action parity gap (Check 12):</strong> updateBillingSettings and activateAutoReload are UI-only, not exposed via API/MCP. These are not in the contract registry. Gaps tracked in Linear but implementation pending. Blocks headless-first workflows.",
    "<strong>Test failure blocks coverage gate (Check 12/13):</strong> @oxagen/billing vi.mock missing isTierDenied export. apps/app is 76.8% branches (below 80% threshold). Fixing the one failing test will recover coverage + unblock merge."
  ],
  actions:  [
    "No gated actions executed (Phase 8 requires user confirmation). Report generated; ready for remediation and re-audit."
  ],
  human: [
    "Fix test mock: add isTierDenied to @oxagen/billing vi.mock factory in apps/app/src/app/[orgSlug]/billing/actions.test.ts. This unblocks coverage gate and CI.",
    "RLS enforcement flip: implement telemetry to detect unscoped db.query.unscoped reads in production logs. Once confirmed zero, flip TENANT_RLS_ENFORCEMENT_ENABLED=true in Vercel envs.",
    "Billing parity: add updateBillingSettings and activateAutoReload to packages/oxagen/src/contracts/ and wire into apps/api + apps/mcp routes.",
    "Audit log retention: add TTL or archive strategy to Postgres audit_logs table (currently unbounded).",
    "E2E pre-merge: consider adding test:e2e to CI lane for PRs touching auth, billing, or isolation-critical paths.",
    "Vercel build command: make explicit in vercel.ts (or vercel.json) — should be 'turbo run build --filter=<app>' for each app.",
    "Dev credentials: docker-compose.dev.yml NEO4J_AUTH 'neo4j/oxagen-dev' is a weak plaintext credential (already gitignored). Document in CLAUDE.md that this is local-dev-only."
  ]
};

function band(v){
  if(v>=90) return {label:"Excellent", col:"var(--good)"};
  if(v>=75) return {label:"Good",      col:"var(--fair)"};
  if(v>=60) return {label:"Fair",      col:"var(--mid)"};
  if(v>=40) return {label:"Poor",      col:"var(--poor)"};
  return        {label:"Critical",  col:"var(--crit)"};
}
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};

document.getElementById("meta").textContent = `${DATA.repo} · ${DATA.branch} · ${DATA.sha.substring(0, 7)}`;
document.getElementById("reqAt").textContent = `Requested ${DATA.requestedAt}`;

(function(){
  const b = band(DATA.composite);
  const vcol = DATA.verdict==="GO" ? "var(--pass)" : "var(--fail)";
  document.getElementById("hero").innerHTML = `
    <div class="hero">
      <div>
        <div class="label">Release readiness</div>
        <div class="score" style="color:${b.col}">${DATA.composite}<small>/100</small></div>
      </div>
      <div class="verdict">
        <span class="pill" style="color:${vcol};background:color-mix(in srgb,${vcol} 16%,transparent)">${DATA.verdict}</span>
        <span class="badge ${DATA.status}">${DATA.status}</span>
        <span class="label">${b.label}</span>
      </div>
    </div>`;
})();

document.getElementById("scores").append(...DATA.scores.map(s=>{
  const b = band(s.value);
  const box = el("div","stat");
  box.style.setProperty("--bar", b.col);
  box.append(
    el("div","name", s.name),
    el("div","val", `${s.value}<small>/100</small>`),
    (()=>{const t=el("div","track"),f=el("div","fill"); f.style.width=s.value+"%"; f.style.background=b.col; t.append(f); return t;})(),
    el("div","conf", `${b.label} · confidence ${s.conf}`)
  );
  return box;
}));

function fillMaturity(tblId, rows){
  const tb = document.querySelector(`#${tblId} tbody`);
  if(!rows.length){ tb.append(el("tr",null,`<td colspan="4" style="color:var(--muted)">No projects found.</td>`)); return; }
  rows.forEach(r=>{
    const b = band(r.value);
    tb.append(el("tr",null,
      `<td><span class="meta">${r.name}</span></td>`+
      `<td class="num" style="color:${b.col}">${r.value}</td>`+
      `<td>${b.label}</td><td>${r.finding||""}</td>`));
  });
}
fillMaturity("appsTbl", DATA.apps);
fillMaturity("pkgsTbl", DATA.packages);

(function(){
  const tb = document.querySelector("#checksTbl tbody");
  DATA.checks.forEach(c=> tb.append(el("tr",null,
    `<td>${c.n}</td><td>${c.name}</td>`+
    `<td><span class="badge ${c.status}">${c.status}</span></td><td>${c.finding||""}</td>`)));
})();

const li = (id,items,fallback)=>{
  const ul=document.getElementById(id);
  if(!items.length){ ul.append(el("li",null,`<span style="color:var(--muted)">${fallback}</span>`)); return; }
  items.forEach(t=> ul.append(el("li",null,t)));
};
li("blockers", DATA.blockers, "No blockers.");
li("actions",  DATA.actions,  "No actions taken.");
li("human",    DATA.human,    "Nothing pending.");

document.getElementById("method").textContent =
  "Scoring: each score starts at 100 and deducts per finding (FAIL −15…−25 by blast radius, WARN −5), floored at 0, with hard caps for blocker-class findings. Bands: ≥90 Excellent · 75–89 Good · 60–74 Fair · 40–59 Poor · <40 Critical. Composite is severity-weighted roll-up; any unresolved blocker forces NO-GO. Confidence: high = measured evidence, med = partially measured, low = inferred.";
</script>
</body>
</html>
