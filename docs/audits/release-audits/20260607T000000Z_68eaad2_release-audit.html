<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root {
    --bg:#0B1020; --panel:rgba(255,255,255,.04); --border:rgba(255,255,255,.08);
    --fg:#E8EAF2; --muted:#9aa3b2;
    --pass:#3CFF52; --warn:#FFC53C; --fail:#FF5C7A;
    --good:#3CFF52; --fair:#9BE15D; --mid:#FFC53C; --poor:#FF9F45; --crit:#FF5C7A;
    --grad:linear-gradient(135deg,#7182FF,#3CFF52);
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#F7F8FC;--panel:rgba(10,16,32,.03);--border:rgba(10,16,32,.10);--fg:#0B1020;--muted:#5a6478;}
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;padding:40px}
  .wrap{max-width:1120px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
  .grad{height:3px;background:var(--grad);border-radius:3px;margin:18px 0 28px}
  h2{font-size:16px;margin:38px 0 14px}
  .meta{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}

  /* hero readiness band */
  .hero{display:flex;align-items:center;gap:30px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 32px}
  .hero .score{font-size:88px;font-weight:800;line-height:.95;letter-spacing:-.03em}
  .hero .score small{font-size:28px;font-weight:600;color:var(--muted);margin-left:4px}
  .hero .verdict{display:flex;flex-direction:column;gap:10px}
  .hero .pill{font-size:22px;font-weight:800;padding:8px 22px;border-radius:999px;
    letter-spacing:.02em;text-transform:uppercase}
  .hero .label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .hero .badge{align-self:flex-start;font-size:14px;padding:5px 14px}

  /* score grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar,var(--muted))}
  .stat .name{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
  .stat .val{font-size:38px;font-weight:800;line-height:1}
  .stat .val small{font-size:15px;font-weight:600;color:var(--muted)}
  .stat .track{height:6px;border-radius:999px;background:rgba(127,127,127,.18);margin-top:12px;overflow:hidden}
  .stat .fill{height:100%;border-radius:999px}
  .stat .conf{font-size:11px;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.04em}

  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  tr:last-child td{border-bottom:none}
  td.num{font-weight:800;font-size:18px;white-space:nowrap}
  .badge{font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .PASS{color:var(--pass);background:color-mix(in srgb,var(--pass) 14%,transparent)}
  .WARN{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
  .FAIL{color:var(--fail);background:color-mix(in srgb,var(--fail) 14%,transparent)}
  ul{margin:0;padding-left:20px} li{margin:4px 0}
  .foot{color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Oxagen Release Audit</h1>
  <div class="sub"><span class="meta" id="meta"></span><br><span id="reqAt"></span></div>
  <div class="grad"></div>

  <section id="hero"></section>

  <h2>Readiness scores</h2>
  <div class="grid" id="scores"></div>

  <h2>App maturity</h2>
  <table id="appsTbl"><thead><tr><th>App</th><th>Score</th><th>Band</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Package maturity</h2>

  <h2>Checks</h2>
  <table id="checksTbl"><thead><tr><th>#</th><th>Check</th><th>Status</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Blockers</h2><ul id="blockers"></ul>
  <h2>Actions taken</h2><ul id="actions"></ul>
  <h2>Needs human</h2><ul id="human"></ul>

  <p class="foot" id="method"></p>
</div>

// Render hero band
function renderHero() {
  const h = DATA;
  const band = document.getElementById('hero');
  const colorMap = {
    "GO": "var(--good)",
    "NO-GO": "var(--fail)"
  };
  const statusColor = h.status === "FAIL" ? "var(--fail)" : h.status === "WARN" ? "var(--warn)" : "var(--pass)";
  band.innerHTML = `
    <section class="hero" style="--bar: ${statusColor}">
      <div class="score" style="color: ${colorMap[h.verdict] || 'var(--fail)'}">
        ${h.composite}<small>/100</small>
      </div>
      <div class="verdict">
        <span class="label">Readiness verdict</span>
        <div class="pill" style="background: ${colorMap[h.verdict] || 'var(--fail)'}; color: var(--bg)">${h.verdict}</div>
        <span class="badge" style="background: color-mix(in srgb, var(--${h.status.toLowerCase()}) 30%, transparent); color: var(--${h.status.toLowerCase()})">${h.status}</span>
      </div>
    </section>
  `;
}

// Render metadata
function renderMeta() {
  const h = DATA;
  const d = new Date(h.requestedAt);
  const fmt = d.toLocaleString('en-US', { year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', timeZoneName: 'short' });
  document.getElementById('meta').innerHTML = `${h.repo} · ${h.branch} · ${h.sha}`;
  document.getElementById('reqAt').innerHTML = `Requested ${fmt}`;
}

// Render score grid
function renderScores() {
  const grid = document.getElementById('scores');
  grid.innerHTML = DATA.scores.map(s => {
    const band = s.value >= 80 ? 'var(--good)' : s.value >= 70 ? 'var(--fair)' : s.value >= 60 ? 'var(--mid)' : s.value >= 50 ? 'var(--poor)' : 'var(--crit)';
    return `
      <div class="stat" style="--bar: ${s.bar || band}">
        <div class="name">${s.name}</div>
        <div class="val">${s.value}<small>/100</small></div>
        <div class="track"><div class="fill" style="width: ${s.value}%; background: ${band}"></div></div>
        <div class="conf">Confidence: ${s.conf}</div>
      </div>
    `;
  }).join('');
}

// Render app maturity table
function renderApps() {
  const tbody = document.querySelector('#appsTbl tbody');
  tbody.innerHTML = DATA.apps.map(a => {
    const band = a.value >= 80 ? '✓ Good' : a.value >= 70 ? '△ Fair' : a.value >= 60 ? '⚠ Poor' : '✗ Critical';
    const color = a.value >= 80 ? 'var(--good)' : a.value >= 70 ? 'var(--fair)' : a.value >= 60 ? 'var(--poor)' : 'var(--crit)';
    return `<tr><td>${a.name}</td><td class="num">${a.value}</td><td style="color: ${color}">${band}</td><td>${a.finding}</td></tr>`;
  }).join('');
}

// Render package maturity table
function renderPackages() {
  const tbody = document.querySelector('#pkgsTbl tbody');
  tbody.innerHTML = DATA.packages.map(p => {
    const band = p.value >= 80 ? '✓ Good' : p.value >= 70 ? '△ Fair' : p.value >= 60 ? '⚠ Poor' : '✗ Critical';
    const color = p.value >= 80 ? 'var(--good)' : p.value >= 70 ? 'var(--fair)' : p.value >= 60 ? 'var(--poor)' : 'var(--crit)';
    return `<tr><td>${p.name}</td><td class="num">${p.value}</td><td style="color: ${color}">${band}</td><td>${p.finding}</td></tr>`;
  }).join('');
}

// Render checks table
function renderChecks() {
  const tbody = document.querySelector('#checksTbl tbody');
  tbody.innerHTML = DATA.checks.map(c => {
    const badgeClass = c.status;
    return `<tr><td class="num">${c.n}</td><td>${c.name}</td><td><span class="badge ${badgeClass}">${c.status}</span></td><td>${c.finding}</td></tr>`;
  }).join('');
}

// Render blockers list
function renderBlockers() {
  document.getElementById('blockers').innerHTML = DATA.blockers.map(b => `<li>${b}</li>`).join('');
}

// Render actions list
function renderActions() {
  document.getElementById('actions').innerHTML = DATA.actions.map(a => `<li>${a}</li>`).join('');
}

// Render needs human list
function renderHuman() {
  document.getElementById('human').innerHTML = DATA.human.map(h => `<li>${h}</li>`).join('');
}

// Render methodology
function renderMethod() {
  document.getElementById('method').innerHTML = `
    <strong>Scoring methodology:</strong> Composite grade is 0–100 with deductions for each FAIL (−5 to −8 per FAIL depending on severity) and each WARN (−2 to −3 per WARN).
    Confidence bands: <strong>high</strong> = measured via automated tools + code review, <strong>med</strong> = partially measured, <strong>low</strong> = inferred from patterns.
    Bands: ✓ Good (80+), △ Fair (70–79), ⚠ Poor (60–69), ✗ Critical (&lt;60).
    All checks correspond to release-audit Phase 1 (Architecture) through Phase 6 (Docs).
  `;
}

// Initialize
renderHero();
renderMeta();
renderScores();
renderApps();
renderPackages();
renderChecks();
renderBlockers();
renderActions();
renderHuman();
renderMethod();
</script>
</body>
