<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>20260608T200000Z · 66e5fad · Release Audit</title>
<style>
  :root {
    --bg:#0B1020; --panel:rgba(255,255,255,.04); --border:rgba(255,255,255,.08);
    --fg:#E8EAF2; --muted:#9aa3b2;
    --pass:#3CFF52; --warn:#FFC53C; --fail:#FF5C7A;
    --good:#3CFF52; --fair:#9BE15D; --mid:#FFC53C; --poor:#FF9F45; --crit:#FF5C7A;
    --grad:linear-gradient(135deg,#7182FF,#3CFF52);
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#F7F8FC;--panel:rgba(10,16,32,.03);--border:rgba(10,16,32,.10);--fg:#0B1020;--muted:#5a6478;}
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;padding:40px}
  .wrap{max-width:1120px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
  .grad{height:3px;background:var(--grad);border-radius:3px;margin:18px 0 28px}
  h2{font-size:16px;margin:38px 0 14px}
  .meta{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}

  .hero{display:flex;align-items:center;gap:30px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 32px}
  .hero .score{font-size:88px;font-weight:800;line-height:.95;letter-spacing:-.03em}
  .hero .score small{font-size:28px;font-weight:600;color:var(--muted);margin-left:4px}
  .hero .verdict{display:flex;flex-direction:column;gap:10px}
  .hero .pill{font-size:22px;font-weight:800;padding:8px 22px;border-radius:999px;
    letter-spacing:.02em;text-transform:uppercase}
  .hero .label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .hero .badge{align-self:flex-start;font-size:14px;padding:5px 14px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar,var(--muted))}
  .stat .name{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
  .stat .val{font-size:38px;font-weight:800;line-height:1}
  .stat .val small{font-size:15px;font-weight:600;color:var(--muted)}
  .stat .track{height:6px;border-radius:999px;background:rgba(127,127,127,.18);margin-top:12px;overflow:hidden}
  .stat .fill{height:100%;border-radius:999px}
  .stat .conf{font-size:11px;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.04em}

  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  tr:last-child td{border-bottom:none}
  td.num{font-weight:800;font-size:18px;white-space:nowrap}
  .badge{font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .PASS{color:var(--pass);background:color-mix(in srgb,var(--pass) 14%,transparent)}
  .WARN{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
  .FAIL{color:var(--fail);background:color-mix(in srgb,var(--fail) 14%,transparent)}
  .GO{color:var(--pass);background:color-mix(in srgb,var(--pass) 20%,transparent)}
  .NOGO{color:var(--fail);background:color-mix(in srgb,var(--fail) 20%,transparent)}
  ul{margin:0;padding-left:20px} li{margin:4px 0}
  .foot{color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Oxagen Release Audit</h1>
  <div class="sub"><span class="meta" id="meta"></span><br><span id="reqAt"></span></div>
  <div class="grad"></div>

  <section id="hero"></section>

  <h2>Readiness scores</h2>
  <div class="grid" id="scores"></div>

  <h2>App maturity</h2>
  <table id="appsTbl"><thead><tr><th>App</th><th>Score</th><th>Band</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Package maturity</h2>
  <table id="pkgsTbl"><thead><tr><th>Package</th><th>Score</th><th>Band</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Checks</h2>
  <table id="checksTbl"><thead><tr><th>#</th><th>Check</th><th>Status</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Blockers</h2><ul id="blockers"></ul>
  <h2>Actions taken</h2><ul id="actions"></ul>
  <h2>Needs human</h2><ul id="human"></ul>

  <p class="foot" id="method"></p>
</div>

<script>
const DATA = {

    { name: "config",            value: 88, finding: "Env validation schema; loadEnv normalization; no hard-coded URLs" },

    { n:  6, name: "SOC 2 risks",               status: "WARN", finding: "No secrets in code ✓. PII logging absent ✓. apps/app IAM bypass documented and mitigated with explicit gates. rateLimits plural fix deployed." },
    { n:  7, name: "RLS / tenant scoping",      status: "PASS", finding: "TENANT_RLS_ENFORCEMENT_ENABLED=true in prod. 44-entry POLICY_MANIFEST covers all tenant tables. oxagen_app NOSUPERUSER/NOBYPASSRLS role deployed." },
    { n:  8, name: "Premature spend",           status: "PASS", finding: "All free/cheap tiers: Vercel serverless, Neo4j Aura free, Neon/PG managed. No standing GPU or multi-region replicas." },
    { n:  9, name: "Portability",               status: "WARN", finding: "Vercel Blob lock-in mitigated by @oxagen/storage adapter. Inngest dependency for async workflows — portable but non-trivial to swap." },
    { n: 10, name: "Env vars / secrets",        status: "WARN", finding: "Vercel CLI outdated: 50.35.0 → 54.9.1. .env.example files accurate. True secrets encrypted in Vercel. datastore vars team-shared." },
    { n: 11, name: "Skill adherence",           status: "PASS", finding: "Engineering policy followed throughout. coss-ui/Base UI components used. ai/rsc forbidden pattern absent. proxy.ts convention correct." },
    { n: 12, name: "Regressions",               status: "WARN", finding: "FIXED: e2e fixture referenced dropped tables (agent.tools, execution.*). Root-cause fixed in commits 7e8d546+6b1b442+42b9ca1. CI pending green." },
    { n: 13, name: "Test coverage",             status: "WARN", finding: "21/21 packages have vitest thresholds. Ink TSX excluded from unit coverage (requires e2e renderer). 4 e2e gaps remain." },
    { n: 14, name: "Headless parity",           status: "WARN", finding: "82 contracts, 92 CLI commands (>1:1). workflow.* API exists in combined route (manifest false-positive). 4 missing e2e surfaces." },
    { n: 15, name: "Turbo cache hygiene",       status: "WARN", finding: "test task has no env key declared — cache poisoning risk if env vars change behavior. No cache:false on deterministic tasks ✓." },
    { n: 16, name: "Remote cache",              status: "PASS", finding: "TURBO_TOKEN + TURBO_TEAM shared CI↔Vercel. Builds use turbo --filter. Single cache pool for PR + deploy." },

    { n: 18, name: "Test lane separation",      status: "PASS", finding: "PR lane: unit+contract. Pre-merge: e2e via pull_request trigger. Nightly: full suite + coverage merge." },

    { n: 20, name: "Stale docs",                status: "PASS", finding: "CLAUDE.md current: proxy.ts, turbopack, RLS, IAM bypass, gotchas all accurate. Minor: capability gap count (18→20)." },
    { n: 21, name: "Missing agent guidance",    status: "PASS", finding: "CLAUDE.md comprehensive with model escalation rubric, deployment URLs, env vars, commands, gotchas. No thrash-inducing gaps." },
    { n: 22, name: "CI on main",                status: "WARN", finding: "FIXED: 5 consecutive red runs before this session. Root-cause (dropped-table e2e refs) resolved and pushed. Awaiting next run." },
    { n: 23, name: "Open PRs",                  status: "PASS", finding: "No open PRs. All work committed directly to main per pre-launch operating model." }
  ],
  blockers: [
    "<strong>[FIXED — pending CI verification]</strong> CI was red 5 consecutive runs on main. Root cause: e2e fixture inserted into/deleted from dropped tables (agent.tools, execution.*). Fixed in commits 7e8d546 + 6b1b442 + 42b9ca1. Next CI run should be green.",

  ],
  actions: [
    "Resolved merge conflict in packages/database/src/schema/workflow.ts (feat/hardening branch HEAD vs main — took feat branch's 5-table schema).",
    "Resolved merge conflict in packages/handlers/src/workspace.invite.send.ts (kept real implementation with org.invitations insert, not stub).",
    "Removed all references to dropped tables (agent.tools, execution.executions, execution.execution_steps, execution.tool_calls) from apps/app/e2e/helpers/agent-runtime-fixture.ts.",
    "Fixed process.exit type signatures in apps/cli/src/commands.test.ts (4 occurrences: _code?: number → _code?: string | number | null).",
    "Added 12 new CLI commands: plugin.org.install_bulk, plugin.org.list, plugin.org.set_enabled, plugin.registry.remove, plugin.registry.sync, plugin.settings.set_auth_alerts, plugin.workspace.set_enabled, system.install.instructions, user.preferences.read, user.preferences.write, workflow.cancel, workflow.status.",

    "Verify CI goes green on next push to main — root-cause fixed and pushed, awaiting the run.",
    "File Linear tickets for 4 missing e2e tests: billing.credits.purchase, org.member.add, org.member.invite.accept, org.member.invite.decline.",
    "Upgrade Vercel CLI: currently 50.35.0, latest is 54.9.1 — run <code>pnpm add -g vercel@latest</code>.",
    "12 capability docs still missing (82 total − 70 documented). Remaining gaps tracked in CLAUDE.md; prioritise workflow-adjacent and agent.* docs.",

  ],
  method: "Scoring: each dimension starts at 100. Deductions: FAIL −15…−25 scaled by blast radius; WARN −5…−10. Composite = arithmetic mean of the 10 required dimensions. Bands: ≥90 Excellent (green), 80–89 Good (yellow-green), 70–79 Fair (amber), 60–69 Poor (orange), <60 Critical (red). GO verdict requires composite >85 with no unresolved FAIL blockers."
};

/* ─── renderer ─────────────────────────────────────────────────────────────── */

function band(v) {
  if (v >= 90) return { label: "Excellent", color: "var(--good)" };
  if (v >= 80) return { label: "Good",      color: "var(--fair)" };
  if (v >= 70) return { label: "Fair",      color: "var(--mid)"  };
  if (v >= 60) return { label: "Poor",      color: "var(--poor)" };
  return               { label: "Critical", color: "var(--crit)" };
}

// hero
const b = band(DATA.composite);
document.getElementById("hero").innerHTML = `
  <div class="score" style="color:${b.color}">${DATA.composite}<small>/100</small></div>
  <div class="verdict">
    <div class="label">Release readiness</div>
    <div class="pill badge ${DATA.verdict === "GO" ? "GO" : "NOGO"}">${DATA.verdict}</div>
    <div class="badge ${DATA.status}">${DATA.status}</div>
    <div class="label" style="margin-top:4px">${b.label}</div>
  </div>`;

document.getElementById("meta").textContent =
  `${DATA.repo} · ${DATA.branch} · ${DATA.sha.slice(0,12)}`;
document.getElementById("reqAt").textContent = `Audit requested: ${DATA.requestedAt}`;

// score grid
const sg = document.getElementById("scores");
DATA.scores.forEach(s => {
  const b2 = band(s.value);
  sg.innerHTML += `<div class="stat" style="--bar:${b2.color}">
    <div class="name">${s.name}</div>
    <div class="val" style="color:${b2.color}">${s.value}<small>/100</small></div>
    <div class="track"><div class="fill" style="width:${s.value}%;background:${b2.color}"></div></div>
    <div class="conf">confidence: ${s.conf}</div>
  </div>`;
});

// apps table
const ab = document.querySelector("#appsTbl tbody");
DATA.apps.forEach(a => {
  const b3 = band(a.value);
  ab.innerHTML += `<tr>
    <td><strong>${a.name}</strong></td>
    <td class="num" style="color:${b3.color}">${a.value}</td>
    <td><span class="badge" style="color:${b3.color};background:color-mix(in srgb,${b3.color} 14%,transparent)">${b3.label}</span></td>
    <td>${a.finding}</td>
  </tr>`;
});

// packages table
const pb = document.querySelector("#pkgsTbl tbody");
DATA.packages.forEach(p => {
  const b4 = band(p.value);
  pb.innerHTML += `<tr>
    <td><strong>${p.name}</strong></td>
    <td class="num" style="color:${b4.color}">${p.value}</td>
    <td><span class="badge" style="color:${b4.color};background:color-mix(in srgb,${b4.color} 14%,transparent)">${b4.label}</span></td>
    <td>${p.finding}</td>
  </tr>`;
});

// checks table

DATA.checks.forEach(c => {
  cb.innerHTML += `<tr>
    <td class="num" style="opacity:.5">${c.n}</td>
    <td><strong>${c.name}</strong></td>
    <td><span class="badge ${c.status}">${c.status}</span></td>
    <td>${c.finding}</td>
  </tr>`;
});

// blockers / actions / human
const bl = document.getElementById("blockers");
DATA.blockers.forEach(x => { bl.innerHTML += `<li>${x}</li>`; });

const al = document.getElementById("actions");
DATA.actions.forEach(x => { al.innerHTML += `<li>${x}</li>`; });

const hl = document.getElementById("human");
DATA.human.forEach(x => { hl.innerHTML += `<li>${x}</li>`; });

document.getElementById("method").textContent = DATA.method;
</script>
</body>
</html>
