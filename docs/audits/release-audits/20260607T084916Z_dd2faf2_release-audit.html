          "DECISION: 30 static-mock pages — implement, roll back, or file real Linear tickets to replace the OXA-XXXX placeholder? (Currently shipped to authenticated users as no-op UI.)",
          "DECISION: 4 orphan tables (folders, connections, documents, iam_sessions) — implement the features or drop the schema? iam_sessions specifically blocks the SOC2 session-revocation control.",
          "ACTION: upgrade pnpm/action-setup@v4 → @v5 in CI workflows before 2026-06-16 (Node 20 runner deprecation).",
          "GDPR PRODUCT DECISION: no DSAR/data-export path, no right-to-erasure handler, no consent recording, no data-residency controls exist. Needed before any EU exposure.",
          "Concurrent edits observed in the working tree during the audit (packages/billing/src/checkout.ts, subscriptions.ts, settings/general tests) — not part of this audit; confirm they are intended user work before any push to main.",
        ],
      };

      function band(v) {
        if (v >= 90) return { label: "Excellent", col: "var(--good)" };
        if (v >= 75) return { label: "Good", col: "var(--fair)" };
        if (v >= 60) return { label: "Fair", col: "var(--mid)" };
        if (v >= 40) return { label: "Poor", col: "var(--poor)" };
        return { label: "Critical", col: "var(--crit)" };
      }
      const el = (t, c, h) => {
        const e = document.createElement(t);
        if (c) e.className = c;
        if (h != null) e.innerHTML = h;
        return e;
      };

      document.getElementById("meta").textContent =
        `${DATA.repo} · ${DATA.branch} · ${DATA.sha}`;
      document.getElementById("reqAt").textContent =
        `Requested ${DATA.requestedAt}`;

      (function () {
        const b = band(DATA.composite);
        const vcol = DATA.verdict === "GO" ? "var(--pass)" : "var(--fail)";
        document.getElementById("hero").innerHTML = `
    <div class="hero">
      <div>
        <div class="label">Release readiness</div>
        <div class="score" style="color:${b.col}">${DATA.composite}<small>/100</small></div>
      </div>
      <div class="verdict">
        <span class="pill" style="color:${vcol};background:color-mix(in srgb,${vcol} 16%,transparent)">${DATA.verdict}</span>
        <span class="badge ${DATA.status}">${DATA.status}</span>
        <span class="label">${b.label}</span>
      </div>
    </div>`;
      })();

      document.getElementById("scores").append(
        ...DATA.scores.map((s) => {
          const b = band(s.value);
          const box = el("div", "stat");
          box.style.setProperty("--bar", b.col);
          box.append(
            el("div", "name", s.name),
            el("div", "val", `${s.value}<small>/100</small>`),
            (() => {
              const t = el("div", "track"),
                f = el("div", "fill");
              f.style.width = s.value + "%";
              f.style.background = b.col;
              t.append(f);
              return t;
            })(),
            el("div", "conf", `${b.label} · confidence ${s.conf}`),
          );
          return box;
        }),
      );

      function fillMaturity(tblId, rows) {
        const tb = document.querySelector(`#${tblId} tbody`);
        if (!rows.length) {
          tb.append(
            el(
              "tr",
              null,
              `<td colspan="4" style="color:var(--muted)">No projects found.</td>`,
            ),
          );
          return;
        }
        rows.forEach((r) => {
          const b = band(r.value);
          tb.append(
            el(
              "tr",
              null,
              `<td><span class="meta">${r.name}</span></td>` +
                `<td class="num" style="color:${b.col}">${r.value}</td>` +
                `<td>${b.label}</td><td>${r.finding || ""}</td>`,
            ),
          );
        });
      }
      fillMaturity("appsTbl", DATA.apps);
      fillMaturity("pkgsTbl", DATA.packages);

      (function () {
        const tb = document.querySelector("#checksTbl tbody");
        DATA.checks.forEach((c) =>
          tb.append(
            el(
              "tr",
              null,
              `<td>${c.n}</td><td>${c.name}</td>` +
                `<td><span class="badge ${c.status}">${c.status}</span></td><td>${c.finding || ""}</td>`,
            ),
          ),
        );
      })();

      const li = (id, items, fallback) => {
        const ul = document.getElementById(id);
        if (!items.length) {
          ul.append(
            el(
              "li",
              null,
              `<span style="color:var(--muted)">${fallback}</span>`,
            ),
          );
          return;
        }
        items.forEach((t) => ul.append(el("li", null, t)));
      };
      li("blockers", DATA.blockers, "No blockers.");
      li("actions", DATA.actions, "No actions taken.");
      li("human", DATA.human, "Nothing pending.");

      document.getElementById("method").textContent =
        "Scoring: each score starts at 100 and deducts per finding (FAIL −15…−25 by blast radius, WARN −5), floored at 0, with hard caps for blocker-class findings. Bands: ≥90 Excellent · 75–89 Good · 60–74 Fair · 40–59 Poor · <40 Critical. Composite is the severity-weighted roll-up; the unresolved RLS data-isolation blocker forces NO-GO.";
    </script>
  </body>
</html>
