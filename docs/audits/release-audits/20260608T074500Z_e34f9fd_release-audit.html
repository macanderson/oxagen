  .stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar,var(--muted))}
  .stat .name{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
  .stat .val{font-size:38px;font-weight:800;line-height:1}

  .stat .track{height:6px;border-radius:999px;background:rgba(127,127,127,.18);margin-top:12px;overflow:hidden}
  .stat .fill{height:100%;border-radius:999px}
  .stat .conf{font-size:11px;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.04em}

  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top}

// Renderer
function scoreColor(v) {
  if (v >= 85) return '--good';
  if (v >= 70) return '--fair';
  if (v >= 55) return '--mid';
  if (v >= 40) return '--poor';
  return '--crit';
}

function render() {
  const meta = document.getElementById('meta');
  meta.textContent = `Branch: ${DATA.branch} | SHA: ${DATA.sha} | Requested: ${DATA.requestedAt}`;

  const hero = document.getElementById('hero');
  const verdictColor = DATA.verdict === 'GO' ? 'var(--pass)' : 'var(--fail)';
  hero.innerHTML = `
    <div class="score" style="color:${verdictColor}">${DATA.composite}<small>%</small></div>
    <div class="verdict">
      <div class="label">Release-readiness</div>
      <div class="pill" style="background:color-mix(in srgb,${verdictColor} 20%,transparent);color:${verdictColor}">${DATA.verdict}</div>
      <div class="badge ${DATA.status}">${DATA.status}</div>
    </div>
  `;

  const scores = document.getElementById('scores');
  DATA.scores.forEach(s => {
    const barColor = `var(${scoreColor(s.value)})`;
    const fillPct = s.value;
    scores.innerHTML += `
      <div class="stat" style="--bar:${barColor}">
        <div class="name">${s.name}</div>
        <div class="val">${s.value}<small>%</small></div>
        <div class="track"><div class="fill" style="width:${fillPct}%;background:${barColor}"></div></div>
        <div class="conf">${s.conf} confidence</div>
      </div>
    `;
  });

  const appTbl = document.getElementById('appsTbl').querySelector('tbody');
  DATA.apps.forEach(a => {
    const barColor = `var(${scoreColor(a.value)})`;
    appTbl.innerHTML += `<tr><td>${a.name}</td><td class="num">${a.value}</td><td style="color:${barColor}">${scoreColor(a.value).slice(2)}</td><td>${a.finding}</td></tr>`;
  });

  const pkgTbl = document.getElementById('pkgsTbl').querySelector('tbody');
  DATA.packages.forEach(p => {
    const barColor = `var(${scoreColor(p.value)})`;
    pkgTbl.innerHTML += `<tr><td>${p.name}</td><td class="num">${p.value}</td><td style="color:${barColor}">${scoreColor(p.value).slice(2)}</td><td>${p.finding}</td></tr>`;
  });

  const checkTbl = document.getElementById('checksTbl').querySelector('tbody');
  DATA.checks.forEach(c => {
    checkTbl.innerHTML += `<tr><td class="num">${c.n}</td><td>${c.name}</td><td><span class="badge ${c.status}">${c.status}</span></td><td>${c.finding}</td></tr>`;
  });

  document.getElementById('blockers').innerHTML = DATA.blockers.map(b => `<li>${b}</li>`).join('');
  document.getElementById('actions').innerHTML = DATA.actions.map(a => `<li>${a}</li>`).join('');
  document.getElementById('human').innerHTML = DATA.human.map(h => `<li>${h}</li>`).join('');

  document.getElementById('method').innerHTML = `<strong>Scoring methodology:</strong> PASS=4 pts, WARN=2 pts, FAIL=0 pts. Composite = (12×4 + 8×2 + 5×0) / 100 = 64/100. Confidence flags reflect audit certainty. Blockers ranked by release impact. GO/NO-GO based on CI status (NO-GO while main is red) and blocker count.`;
}

render();
</script>
