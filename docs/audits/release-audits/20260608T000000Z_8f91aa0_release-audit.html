<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>20260608T000000Z · 8f91aa0 · Release Audit</title>
<style>
  :root {
    --bg:#0B1020; --panel:rgba(255,255,255,.04); --border:rgba(255,255,255,.08);
    --fg:#E8EAF2; --muted:#9aa3b2;
    --pass:#3CFF52; --warn:#FFC53C; --fail:#FF5C7A;
    --good:#3CFF52; --fair:#9BE15D; --mid:#FFC53C; --poor:#FF9F45; --crit:#FF5C7A;
    --grad:linear-gradient(135deg,#7182FF,#3CFF52);
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#F7F8FC;--panel:rgba(10,16,32,.03);--border:rgba(10,16,32,.10);--fg:#0B1020;--muted:#5a6478;}
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;padding:40px}
  .wrap{max-width:1120px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
  .grad{height:3px;background:var(--grad);border-radius:3px;margin:18px 0 28px}
  h2{font-size:16px;margin:38px 0 14px}
  .meta{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}
  .hero{display:flex;align-items:center;gap:30px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 32px}
  .hero .score{font-size:88px;font-weight:800;line-height:.95;letter-spacing:-.03em}
  .hero .score small{font-size:28px;font-weight:600;color:var(--muted);margin-left:4px}
  .hero .verdict{display:flex;flex-direction:column;gap:10px}
  .hero .pill{font-size:22px;font-weight:800;padding:8px 22px;border-radius:999px;
    letter-spacing:.02em;text-transform:uppercase}
  .hero .label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .hero .badge{align-self:flex-start;font-size:14px;padding:5px 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar,var(--muted))}
  .stat .name{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
  .stat .val{font-size:38px;font-weight:800;line-height:1}
  .stat .val small{font-size:15px;font-weight:600;color:var(--muted)}
  .stat .track{height:6px;border-radius:999px;background:rgba(127,127,127,.18);margin-top:12px;overflow:hidden}
  .stat .fill{height:100%;border-radius:999px}
  .stat .conf{font-size:11px;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.04em}
  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  tr:last-child td{border-bottom:none}
  td.num{font-weight:800;font-size:18px;white-space:nowrap}
  .badge{font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .PASS{color:var(--pass);background:color-mix(in srgb,var(--pass) 14%,transparent)}
  .WARN{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
  .FAIL{color:var(--fail);background:color-mix(in srgb,var(--fail) 14%,transparent)}
  ul{margin:0;padding-left:20px} li{margin:4px 0}
  .foot{color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Oxagen Release Audit</h1>
  <div class="sub"><span class="meta" id="meta"></span><br><span id="reqAt"></span></div>
  <div class="grad"></div>

  <section id="hero"></section>

  <h2>Readiness scores</h2>
  <div class="grid" id="scores"></div>

  <h2>App maturity</h2>
  <table id="appsTbl"><thead><tr><th>App</th><th>Score</th><th>Band</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Package maturity</h2>
  <table id="pkgsTbl"><thead><tr><th>Package</th><th>Score</th><th>Band</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Checks</h2>
  <table id="checksTbl"><thead><tr><th>#</th><th>Check</th><th>Status</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Blockers</h2><ul id="blockers"></ul>
  <h2>Actions needed</h2><ul id="actions"></ul>
  <h2>Needs human decision</h2><ul id="human"></ul>

  <p class="foot" id="method"></p>
</div>

<script>

    { name: "handlers", value: 50, finding: "76% test coverage (below 85%), file.serve deleted, recordExecution unwired." },
    { name: "iam", value: 65, finding: "81% test coverage (below 85%), needs improvement to reach quality bar." },
    { name: "inngest-functions", value: 45, finding: "Workflow fanout unimplemented, execution recording unwired." },
    { name: "notifications", value: 70, finding: "Basic implementation, tests passing." }
  ],
  checks: [
    { n: 1, name: "Overengineering", status: "PASS", finding: "No excessive abstraction detected." },
    { n: 2, name: "NotImplemented", status: "FAIL", finding: "7 reachable panic!/unimplemented!() paths: studio routes (2), resolveExecutionStatus, recordExecution unwired, workflow fanout." },
    { n: 3, name: "Vendor lock", status: "PASS", finding: "All vendor SDKs isolated behind adapters." },
    { n: 4, name: "Dead schema", status: "PASS", finding: "Prior session removed orphans (content.files, workspace.folders, org.iam_sessions). Current schema clean." },
    { n: 5, name: "Append-only hygiene", status: "WARN", finding: "event_log, audit_log, credential_log lack time-based partitioning/retention strategy." },
    { n: 6, name: "SOC 2 risks", status: "PASS", finding: "No secrets committed, audit trails on mutations, TLS enforced, IAM grants appropriate." },
    { n: 7, name: "RLS / tenant scoping", status: "PASS", finding: "All 37 tenant-scoped tables have RLS policies, TENANT_RLS_ENFORCEMENT_ENABLED=true in prod." },
    { n: 8, name: "Env vars & secrets", status: "WARN", finding: "APP_URL not declared in turbo.json build env, dev passThroughEnv missing 14 vars (cache poisoning risk)." },
    { n: 9, name: "Secrets committed", status: "WARN", finding: "CLI prints API key to stdout at creation (one-time UX, but logs token). Test fixtures ok." },
    { n: 11, name: "Skill adherence", status: "FAIL", finding: "Stubs with panic! violate 'move rock forward' prime directive; no tracking tickets (OXA-1619)." },
    { n: 12, name: "Regressions", status: "FAIL", finding: "Test schema stale: migrations 0021/0022 not applied to test fixture after dead table removal." },
    { n: 13, name: "Test coverage", status: "WARN", finding: "Handlers 76%, IAM 81%, Auth 72% below 85% target. App 71%. Database 88% (pass)." },
    { n: 14, name: "Headless parity", status: "WARN", finding: "3 API gaps (studio.generate/publish/list) are known stubs. 1 MCP tool gap (workflow.list has no UI call)." },
    { n: 15, name: "Turborepo correctness", status: "WARN", finding: "Missing env declarations on build/typecheck tasks (NEXT_PUBLIC_*, NODE_ENV), cache poisoning risk." },
    { n: 16, name: "Remote cache", status: "PASS", finding: "CI and Vercel share cache via same TURBO_TOKEN + TURBO_TEAM. Hit rate 68% on no-op (acceptable)." },
    { n: 17, name: "PR build time", status: "WARN", finding: "12 min wall-clock (checks 3m, test 4m, build 5m), 50% over 8 min budget. Build + test are the long pole." },
    { n: 18, name: "Test lane separation", status: "FAIL", finding: "E2e tests run on every push to main when they should run PR-only. rls-integration gate is PR-only but e2e is not." },
    { n: 19, name: "E2e coverage", status: "FAIL", finding: "No Playwright suite exists. Critical paths (auth, conversation+MCP+invocation, billing) have zero browser tests." },
    { n: 20, name: "Stale docs", status: "PASS", finding: "CLAUDE.md stack, commands, paths, auth flow all verified as current." },
    { n: 21, name: "Missing agent guidance", status: "WARN", finding: "Should document 7 unimplemented sites, test fixture sync pattern, turbo env declarations, studio stub status, e2e lane gating." },
    { n: 22, name: "CI on main", status: "FAIL", finding: "All 5 recent CI runs RED: checks (lint/typecheck) failing + e2e (1) failing. Blocks all PRs." },
    { n: 23, name: "Open PRs", status: "PASS", finding: "No open PRs to audit." }
  ],
  blockers: [
    "<strong>Check 22 — CI on main RED:</strong> Both 'checks' (lint/typecheck) and 'e2e (1)' are failing across all recent main pushes. This blocks all PR merges.",
    "<strong>Check 2 — 7 Unimplemented paths:</strong> Violates 'move rock forward' prime directive. Reachable stubs: studio routes (2), agent.resolveExecutionStatus, recordExecution unwired, workflow fanout. No tracking tickets.",
    "<strong>Check 19 — No E2e coverage:</strong> Playwright tests completely absent. Critical flows (auth, MCP invocation, billing) unverified in browser context.",
    "<strong>Check 12 — Test regression:</strong> Schema stale: migrations 0021/0022 dropped tables but test fixture not synced. Must run 'pnpm db:migrate --env test' before tests pass.",
    "<strong>Check 18 — E2e lane gating broken:</strong> E2e tests run unconditionally on main push, should run PR-only via rls-integration gate."
  ],
  actions: [
    "1. Fix CI: Investigate 'checks' (lint/typecheck) failures. Most recent run 27120636151 failed on commit 'fix: drop dead content.files'. May be stale doc references or import errors.",
    "2. Sync test schema: Run <code>pnpm db:migrate --env test</code> to apply migrations 0021/0022 and clear schema-append-only test failure.",
    "3. Fix e2e lane gating: Add workflow conditional <code>if: github.event_name == 'pull_request'</code> to prevent e2e running on main push.",
    "4. File tracking tickets: Create parent OXA-1619 for 7 unimplemented sites + sub-issues (studio.generate, studio.publish, studio.list panic, agent.resolveExecutionStatus, recordExecution, workflow fanout, chat.sendMessage). Mark as in-progress work, document deadline.",
    "5. Add turbo.json env declarations: Declare NEXT_PUBLIC_API_URL, NEXT_PUBLIC_MCP_URL, NODE_ENV, DATABASE_URL, APP_URL on respective tasks to prevent cache poisoning.",
    "6. Add dev passThroughEnv: Declare 14 missing vars (TENANT_RLS_ENFORCEMENT_ENABLED, BLOB_READ_WRITE_TOKEN, LOG_LEVEL, STRIPE_TAX_ENABLED, KNOWLEDGE_GRAPH_ENABLED, MCP_PORT, SMTP_*, LINEAR_API_KEY, LINEAR_PROJECT_ID) in dev task passThroughEnv."
  ],
  human: [
    "<strong>E2e Playwright suite design:</strong> Design and estimate e2e coverage for auth flow, workspace isolation, MCP server wiring + agent invocation, and billing. Estimated 3–4 days of Playwright work. Needs human scope/approval.",
    "<strong>CLI key printing:</strong> Review apps/cli/src/commands/api-key.create.ts:25 — <code>console.log(\\`  Key: ${secret}\\`)</code> is intentional one-time UX (like gh auth token) but is flagged as 'logs token'. Confirm this is acceptable or add masking hint.",
    "<strong>Append-only partitioning:</strong> Design time-based partitioning + retention policy for event_log, audit_log, credential_log. Recommend monthly partitioning with 1-year retention window. Needs architecture review + migration planning.",
    "<strong>Lint/typecheck failure root cause:</strong> Investigate why checks job fails on main. May be stale doc references (removed tables still mentioned), import errors from deleted files, or type issues. Check job log for specifics."
  ]
};

function band(v){
  if(v>=90) return {label:"Excellent", col:"var(--good)"};
  if(v>=75) return {label:"Good",      col:"var(--fair)"};
  if(v>=60) return {label:"Fair",      col:"var(--mid)"};
  if(v>=40) return {label:"Poor",      col:"var(--poor)"};
  return        {label:"Critical",  col:"var(--crit)"};
}
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};

document.getElementById("meta").textContent = `${DATA.repo} · ${DATA.branch} · ${DATA.sha}`;
document.getElementById("reqAt").textContent = `Requested ${DATA.requestedAt}`;

(function(){
  const b = band(DATA.composite);
  const vcol = DATA.verdict==="GO" ? "var(--pass)" : "var(--fail)";
  document.getElementById("hero").innerHTML = `
    <div class="hero">
      <div>
        <div class="label">Release readiness</div>
        <div class="score" style="color:${b.col}">${DATA.composite}<small>/100</small></div>
      </div>
      <div class="verdict">
        <span class="pill" style="color:${vcol};background:color-mix(in srgb,${vcol} 16%,transparent)">${DATA.verdict}</span>
        <span class="badge ${DATA.status}">${DATA.status}</span>
        <span class="label">${b.label}</span>
      </div>
    </div>`;
})();

document.getElementById("scores").append(...DATA.scores.map(s=>{
  const b = band(s.value);
  const box = el("div","stat");
  box.style.setProperty("--bar", b.col);
  box.append(
    el("div","name", s.name),
    el("div","val", `${s.value}<small>/100</small>`),
    (()=>{const t=el("div","track"),f=el("div","fill"); f.style.width=s.value+"%"; f.style.background=b.col; t.append(f); return t;})(),
    el("div","conf", `${b.label} · confidence ${s.conf}`)
  );
  return box;
}));

function fillMaturity(tblId, rows){
  const tb = document.querySelector(`#${tblId} tbody`);
  rows.forEach(r=>{
    const b = band(r.value);
    tb.append(el("tr",null,
      `<td><span class="meta">${r.name}</span></td>`+
      `<td class="num" style="color:${b.col}">${r.value}</td>`+
      `<td>${b.label}</td><td>${r.finding||""}</td>`));
  });
}
fillMaturity("appsTbl", DATA.apps);
fillMaturity("pkgsTbl", DATA.packages);

(function(){
  const tb = document.querySelector("#checksTbl tbody");
  DATA.checks.forEach(c=> tb.append(el("tr",null,
    `<td>${c.n}</td><td>${c.name}</td>`+
    `<td><span class="badge ${c.status}">${c.status}</span></td><td>${c.finding||""}</td>`)));
})();

const li = (id,items,fallback)=>{
  const ul=document.getElementById(id);
  if(!items.length){ ul.append(el("li",null,`<span style="color:var(--muted)">${fallback}</span>`)); return; }
  items.forEach(t=> ul.append(el("li",null,t)));
};
li("blockers", DATA.blockers, "No blockers.");
li("actions",  DATA.actions,  "No actions needed.");
li("human",    DATA.human,    "Nothing pending human review.");

document.getElementById("method").textContent =
  "Scoring: each score starts at 100 and deducts per finding (FAIL −15 to −25 by blast radius, WARN −5 to −10). Composite is severity-weighted roll-up. Any unresolved FAIL forces NO-GO. Bands: ≥90 Excellent · 75–89 Good · 60–74 Fair · 40–59 Poor · <40 Critical. Current: 6 FAILs + 8 WARNs = 24/100 CRITICAL, NO-GO verdict.";
</script>
</body>
</html>
