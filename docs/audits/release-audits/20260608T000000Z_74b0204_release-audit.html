<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>20260608T000000Z · 74b0204 · Release Audit</title>
<style>
  :root {
    --bg:#0B1020; --panel:rgba(255,255,255,.04); --border:rgba(255,255,255,.08);
    --fg:#E8EAF2; --muted:#9aa3b2;
    --pass:#3CFF52; --warn:#FFC53C; --fail:#FF5C7A;
    --good:#3CFF52; --fair:#9BE15D; --mid:#FFC53C; --poor:#FF9F45; --crit:#FF5C7A;
    --grad:linear-gradient(135deg,#7182FF,#3CFF52);
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#F7F8FC;--panel:rgba(10,16,32,.03);--border:rgba(10,16,32,.10);--fg:#0B1020;--muted:#5a6478;}
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;padding:40px}
  .wrap{max-width:1120px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
  .grad{height:3px;background:var(--grad);border-radius:3px;margin:18px 0 28px}
  h2{font-size:16px;margin:38px 0 14px}
  .meta{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}

  .hero{display:flex;align-items:center;gap:30px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 32px}
  .hero .score{font-size:88px;font-weight:800;line-height:.95;letter-spacing:-.03em}
  .hero .score small{font-size:28px;font-weight:600;color:var(--muted);margin-left:4px}
  .hero .verdict{display:flex;flex-direction:column;gap:10px}
  .hero .pill{font-size:22px;font-weight:800;padding:8px 22px;border-radius:999px;
    letter-spacing:.02em;text-transform:uppercase}
  .hero .label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .hero .badge{align-self:flex-start;font-size:14px;padding:5px 14px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar,var(--muted))}
  .stat .name{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
  .stat .val{font-size:38px;font-weight:800;line-height:1}
  .stat .val small{font-size:15px;font-weight:600;color:var(--muted)}
  .stat .track{height:6px;border-radius:999px;background:rgba(127,127,127,.18);margin-top:12px;overflow:hidden}
  .stat .fill{height:100%;border-radius:999px}
  .stat .conf{font-size:11px;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.04em}

  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  tr:last-child td{border-bottom:none}
  td.num{font-weight:800;font-size:18px;white-space:nowrap}
  .badge{font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .PASS{color:var(--pass);background:color-mix(in srgb,var(--pass) 14%,transparent)}
  .WARN{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
  .FAIL{color:var(--fail);background:color-mix(in srgb,var(--fail) 14%,transparent)}
  ul{margin:0;padding-left:20px} li{margin:4px 0}
  .foot{color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Oxagen Release Audit</h1>
  <div class="sub"><span class="meta" id="meta"></span><br><span id="reqAt"></span></div>
  <div class="grad"></div>

  <section id="hero"></section>

  <h2>Readiness scores</h2>
  <div class="grid" id="scores"></div>

  <h2>App maturity</h2>
  <table id="appsTbl"><thead><tr><th>App</th><th>Score</th><th>Band</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Package maturity</h2>
  <table id="pkgsTbl"><thead><tr><th>Package</th><th>Score</th><th>Band</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Checks</h2>
  <table id="checksTbl"><thead><tr><th>#</th><th>Check</th><th>Status</th><th>Finding</th></tr></thead><tbody></tbody></table>

  <h2>Blockers</h2><ul id="blockers"></ul>
  <h2>Actions taken</h2><ul id="actions"></ul>
  <h2>Needs human</h2><ul id="human"></ul>

  <p class="foot" id="method"></p>
</div>

<script>
const DATA = {
  repo: "oxagen-monorepo", branch: "main", sha: "74b0204a5a08eb2dd29cc1adf5d9506bd8a39767", requestedAt: "2026-06-08 00:00:00 UTC",
  composite: 68,
  verdict: "NO-GO",
  status: "FAIL",
  scores: [
    { name: "Maintainability",     value: 32, conf: "high" },
    { name: "Security",            value: 70, conf: "high" },
    { name: "SOC 2 compliance",    value: 95, conf: "high" },
    { name: "GDPR compliance",     value: 75, conf: "high" },
    { name: "PCI compliance",      value: 100, conf: "high" },
    { name: "Ops / CI maturity",   value: 70, conf: "high" },
    { name: "Observability",       value: 95, conf: "med" },
    { name: "Docs — end-user",     value: 65, conf: "med" },
    { name: "Docs — internal",     value: 85, conf: "high" },
    { name: "Platform stability",  value: 25, conf: "high" }
  ],
  apps: [
    { name: "app", value: 72, finding: "E2E broken (pre-existing), IAM instrumentation edge-case gap" },
    { name: "api", value: 82, finding: "Routes clean, parity mostly good, minor doc stale" },
    { name: "mcp", value: 62, finding: "Tool registry regression + cache gap, coverage threshold missing" },
    { name: "cli", value: 75, finding: "Commands wired, coverage threshold missing" },
    { name: "docs", value: 85, finding: "Staticly generated, content stale (CLI)" }
  ],
  packages: [
    { name: "agent", value: 78, finding: "Duplicate Inngest client, otherwise sound" },
    { name: "ai", value: 90, finding: "Gateway integration clean" },
    { name: "auth", value: 75, finding: "Better Auth integrated, rateLimits plural fixed" },
    { name: "billing", value: 60, finding: "Credit/usage tables lack partitioning, missing audit events on upgrades" },
    { name: "compliance", value: 95, finding: "Well-structured, GDPR/PCI safeguards" },
    { name: "config", value: 100, finding: "Perfect coverage" },
    { name: "crypto", value: 85, finding: "KMS seam justified, keys encrypted" },
    { name: "database", value: 40, finding: "2 dead schemas (documents, forms), grants/policies read-only, low test coverage" },
    { name: "handlers", value: 72, finding: "Workspace invite PII leak, user prefs stub logging, billing events WARN" },
    { name: "iam", value: 80, finding: "Enforcement wired, RLS correct, grants/policies half-wired" },
    { name: "inngest-functions", value: 85, finding: "Solid, no major gaps" },
    { name: "notifications", value: 90, finding: "Clean implementation" },
    { name: "ontology", value: 80, finding: "Neo4j properly isolated, app-agnostic" },
    { name: "oxagen", value: 65, finding: "3 workflow contracts missing unit tests/docs, 2 user.preferences MCP tools missing" },
    { name: "plugins", value: 85, finding: "Registry wired, marketplace features solid" },
    { name: "sandbox", value: 75, finding: "Modal runner clean, low coverage" },
    { name: "skills", value: 92, finding: "Well-documented, high coverage" },
    { name: "storage", value: 88, finding: "Blob adapter clean, access controls wired" },
    { name: "telemetry", value: 82, finding: "ClickHouse partitioning correct, low coverage" },
    { name: "tenancy", value: 78, finding: "RLS enforced, coverage threshold missing" }
  ],
  checks: [
    { n: 1, name: "Overengineering", status: "PASS", finding: "Vendor seams justified, single Inngest client duplication (WARN)" },
    { n: 2, name: "NotImplemented markers", status: "PASS", finding: "Zero unreachable panic/todo across apps" },
    { n: 3, name: "Vendor lock", status: "PASS", finding: "Stripe, Neo4j, Blob, ClickHouse, AI all isolated" },
    { n: 4, name: "Dead schema", status: "FAIL", finding: "content.documents (dropped), content.forms/form_submissions (never created), org.grants/policies (read-only)" },
    { n: 5, name: "Append-only hygiene", status: "WARN", finding: "credit_ledger, usage_records lack RANGE partitioning; security_events correct" },
    { n: 6, name: "SOC 2 risks", status: "PASS", finding: "No secrets committed, audit trail on IAM, RLS enforced, rate limiting wired" },
    { n: 7, name: "RLS / tenant scoping", status: "PASS", finding: "All 40+ tenant-scoped tables have FORCE ROW LEVEL SECURITY + policies" },
    { n: 8, name: "Premature spend", status: "WARN", finding: "Neo4j AuraDB not provisioned (advisory); other infra clean" },
    { n: 9, name: "Portability assessment", status: "PASS", finding: "AWS-leaning, no hard lock-in" },
    { n: 10, name: "Environment & Secrets", status: "FAIL", finding: "turbo.json cache poisoning: test:coverage missing KNOWLEDGE_GRAPH_ENABLED" },
    { n: 11, name: "Skill adherence", status: "PASS", finding: "No `any` types, strict typing enforced" },
    { n: 12, name: "Regressions", status: "FAIL", finding: "tool-registry: duplicate user.preferences entries in allToolMetadata" },
    { n: 13, name: "Test coverage", status: "FAIL", finding: "3 packages missing test:coverage script; coverage floors below rubric targets" },
    { n: 14, name: "Headless parity", status: "FAIL", finding: "2 user.preferences MCP tools missing, 3 workflow contracts missing unit tests/docs" },
    { n: 15, name: "Turborepo hygiene", status: "FAIL", finding: "test:coverage missing 12 env vars, cache poisoning on KNOWLEDGE_GRAPH_ENABLED" },
    { n: 16, name: "Remote cache", status: "PASS", finding: "Single cache backs CI + Vercel, all apps use turbo-filtered build" },
    { n: 17, name: "E2E coverage", status: "PASS", finding: "Auth, tenant isolation, MCP parity, billing covered; E2E job itself broken (schema gaps)" },
    { n: 18, name: "CI on main", status: "FAIL", finding: "E2E shards fail: relation 'org.organizations' does not exist (migrate skip), auth.rate_limit missing" },
    { n: 19, name: "Stale docs", status: "FAIL", finding: "CLAUDE.md/AGENTS.md claim CLI is single-command; it has 50+ commands wired" },
    { n: 20, name: "Missing agent guidance", status: "WARN", finding: "CLI undocumented as headless surface, dual user.preferences not explained" }
  ],
  blockers: [
    "<strong>tool-registry regression:</strong> duplicate user.preferences.read/write entries in allToolMetadata (lines 159-160 and 181-182); fix: remove one duplicate",
    "<strong>Cache poisoning (critical):</strong> test:coverage missing KNOWLEDGE_GRAPH_ENABLED env var (behavior-changing flag); test behavior differs from test:unit when flag changes",
    "<strong>E2E broken (pre-existing):</strong> relation 'org.organizations' does not exist (migrate job skipped), relation 'auth.rate_limit' does not exist; affects all 5 latest CI runs",
    "<strong>Dead schemas (critical):</strong> content.documents (dropped in 0021, Drizzle export remains); content.forms/form_submissions (Drizzle exports, no migration, never created)",
    "<strong>PII leak:</strong> workspace.invite.send logs raw email address without masking (SOC2 CC6 violation); fix: apply maskEmail()"
  ],
  actions: [],
  human: [
    "Tool-registry regression: fix duplicate metadata entries at apps/mcp/src/tools/tool-registry.test.ts lines 181-182 (remove second copy of user.preferences.read/write)",
    "Cache poisoning: add KNOWLEDGE_GRAPH_ENABLED to test:coverage.env array in turbo.json (currently only in test:unit.env)",
    "Dead schemas: decide on content.documents (remove if dropped intentionally), content.forms/form_submissions (add migration or remove Drizzle export), org.grants/policies (wire write path or document)",
    "E2E failures: migrate skip logic must unconditionally run on E2E containers; verify auth schema bootstrap (rate_limit pluralization); these are pre-existing (pre-74b0204)",
    "PII leak: fix workspace.invite.send stub to call maskEmail(input.email) instead of logging raw email",
    "Coverage scripts: add test:coverage npm script to packages/tenancy, apps/mcp, apps/cli (have vitest.config with thresholds but no script)",
    "Missing MCP tools: create apps/mcp/src/tools/user.preferences.get.ts and user.preferences.update.ts (contracts exist, routes exist, tools missing)",
    "Missing unit tests & docs: add packages/oxagen/src/contracts/workflow.{run|status|cancel}.test.ts; run pnpm check:contracts --docs",
    "Stale docs: update CLAUDE.md and AGENTS.md CLI sections to reflect 50+ command CLI (not just oxagen dev)",
    "Billing partitioning: add RANGE partitions to credit_ledger and usage_records; add Inngest cron for partition rollover"
  ]
};

function band(v){
  if(v>=90) return {label:"Excellent", col:"var(--good)"};
  if(v>=75) return {label:"Good",      col:"var(--fair)"};
  if(v>=60) return {label:"Fair",      col:"var(--mid)"};
  if(v>=40) return {label:"Poor",      col:"var(--poor)"};
  return        {label:"Critical",  col:"var(--crit)"};
}
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};

document.getElementById("meta").textContent = `${DATA.repo} · ${DATA.branch} · ${DATA.sha.substring(0,8)}`;
document.getElementById("reqAt").textContent = `Requested ${DATA.requestedAt}`;

(function(){
  const b = band(DATA.composite);
  const vcol = DATA.verdict==="GO" ? "var(--pass)" : "var(--fail)";
  document.getElementById("hero").innerHTML = `
    <div class="hero">
      <div>
        <div class="label">Release readiness</div>
        <div class="score" style="color:${b.col}">${DATA.composite}<small>/100</small></div>
      </div>
      <div class="verdict">
        <span class="pill" style="color:${vcol};background:color-mix(in srgb,${vcol} 16%,transparent)">${DATA.verdict}</span>
        <span class="badge ${DATA.status}">${DATA.status}</span>
        <span class="label">${b.label}</span>
      </div>
    </div>`;
})();

document.getElementById("scores").append(...DATA.scores.map(s=>{
  const b = band(s.value);
  const box = el("div","stat");
  box.style.setProperty("--bar", b.col);
  box.append(
    el("div","name", s.name),
    el("div","val", `${s.value}<small>/100</small>`),
    (()=>{const t=el("div","track"),f=el("div","fill"); f.style.width=s.value+"%"; f.style.background=b.col; t.append(f); return t;})(),
    el("div","conf", `${b.label} · confidence ${s.conf}`)
  );
  return box;
}));

function fillMaturity(tblId, rows){
  const tb = document.querySelector(`#${tblId} tbody`);
  if(!rows.length){ tb.append(el("tr",null,`<td colspan="4" style="color:var(--muted)">No projects found.</td>`)); return; }
  rows.forEach(r=>{
    const b = band(r.value);
    tb.append(el("tr",null,
      `<td><span class="meta">${r.name}</span></td>`+
      `<td class="num" style="color:${b.col}">${r.value}</td>`+
      `<td>${b.label}</td><td>${r.finding||""}</td>`));
  });
}
fillMaturity("appsTbl", DATA.apps);
fillMaturity("pkgsTbl", DATA.packages);

(function(){
  const tb = document.querySelector("#checksTbl tbody");
  DATA.checks.forEach(c=> tb.append(el("tr",null,
    `<td>${c.n}</td><td>${c.name}</td>`+
    `<td><span class="badge ${c.status}">${c.status}</span></td><td>${c.finding||""}</td>`)));
})();

const li = (id,items,fallback)=>{
  const ul=document.getElementById(id);
  if(!items.length){ ul.append(el("li",null,`<span style="color:var(--muted)">${fallback}</span>`)); return; }
  items.forEach(t=> ul.append(el("li",null,t)));
};
li("blockers", DATA.blockers, "No blockers.");
li("actions",  DATA.actions,  "No actions taken.");
li("human",    DATA.human,    "Nothing pending.");

document.getElementById("method").textContent =
  "Scoring: each score starts at 100 and deducts per finding (FAIL −15…−25 by blast radius, WARN −5). Bands: ≥90 Excellent · 75–89 Good · 60–74 Fair · 40–59 Poor · <40 Critical. Composite is severity-weighted; blockers force NO-GO regardless of average.";
</script>
</body>
</html>
