/* ── Renderer — do not modify ─────────────────────────────────────────────── */
function band(v) {
  if (v >= 90) return { col: "var(--good)", label: "Excellent" };
  if (v >= 75) return { col: "var(--fair)", label: "Good" };
  if (v >= 60) return { col: "var(--mid)",  label: "Fair" };
  if (v >= 45) return { col: "var(--poor)", label: "Poor" };
  return { col: "var(--crit)", label: "Critical" };
}

document.getElementById("meta").textContent =
  `repo: ${DATA.repo}  branch: ${DATA.branch}  sha: ${DATA.sha}`;
document.getElementById("reqAt").textContent = `Requested: ${DATA.requestedAt}`;

const b = band(DATA.composite);
const vcol = DATA.verdict === "GO" ? "var(--pass)" : "var(--fail)";
document.getElementById("hero").innerHTML = `
  <div class="hero">
    <div class="score" style="color:${b.col}">${DATA.composite}<small>/100</small></div>
    <div class="verdict">
      <span class="pill" style="color:${vcol};background:color-mix(in srgb,${vcol} 16%,transparent)">${DATA.verdict}</span>
      <span class="badge ${DATA.status}">${DATA.status}</span>
      <span class="label">${b.label}</span>
    </div>
  </div>`;

const scoreGrid = document.getElementById("scores");
DATA.scores.forEach(s => {
  const sb = band(s.value);
  const div = document.createElement("div");
  div.className = "stat";
  div.style.setProperty("--bar", sb.col);
  div.innerHTML = `<div class="name">${s.name}</div>
    <div class="val" style="color:${sb.col}">${s.value}<small>/100</small></div>
    <div class="track"><div class="fill" style="width:${s.value}%;background:${sb.col}"></div></div>
    <div class="conf">confidence: ${s.conf}</div>`;
  div.title = s.evidence || "";
  scoreGrid.appendChild(div);
});

function maturityRows(tbId, rows) {
  const tb = document.getElementById(tbId).querySelector("tbody");
  rows.forEach(r => {
    const rb = band(r.value);
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${r.name}</td>
      <td class="num" style="color:${rb.col}">${r.value}</td>
      <td><span class="badge" style="color:${rb.col};background:color-mix(in srgb,${rb.col} 14%,transparent)">${rb.label}</span></td>
      <td style="color:var(--muted);font-size:13px">${r.finding}</td>`;
    tb.appendChild(tr);
  });
}
maturityRows("appsTbl", DATA.apps);
maturityRows("pkgsTbl", DATA.packages);

const ctb = document.getElementById("checksTbl").querySelector("tbody");
DATA.checks.forEach(c => {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="num">${c.n}</td>
    <td><strong>${c.name}</strong></td>
    <td><span class="badge ${c.status}">${c.status}</span></td>
    <td style="color:var(--muted);font-size:13px">${c.finding}</td>`;
  ctb.appendChild(tr);
});

function li(id, items, empty) {
  const ul = document.getElementById(id);
  if (!items || !items.length) { ul.innerHTML = `<li style="color:var(--muted)">${empty}</li>`; return; }
  items.forEach(t => { const li = document.createElement("li"); li.innerHTML = t; ul.appendChild(li); });
}
li("blockers", DATA.blockers, "No blockers.");
li("actions",  DATA.actions,  "No actions taken.");
li("human",    DATA.human,    "Nothing pending.");

document.getElementById("method").textContent = DATA.method;
</script>
