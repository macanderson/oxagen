# Stella fleet plan — Oxagen Cache Review
# Source: docs/specs/oxagen-cache-review/spec.md + plan.md (2026-07-03)
#
# Run from a FEATURE BRANCH of oxagen-platform — shared_tree workers commit to
# the CURRENT branch; never run this on main:
#
#   git fetch origin && git switch -c cache-review-fleet origin/main
#   stella fleet --plan docs/specs/oxagen-cache-review/fleet.toml
#
# Operational notes:
# - The fleet has NO resume: re-running re-dispatches every task. Every prompt
#   tells its worker to reconcile with already-landed work instead of duplicating.
# - `claims` are exact-string file locks. Any two tasks sharing a claim string are
#   dependency-ordered below; a claim conflict at dispatch is a PERMANENT failure
#   and skips dependents. If you add a task, reuse the exact claim strings.
# - `isolation` is omitted = "shared_tree" (the default). Per-child budget is
#   --budget / --max-concurrency (concurrency defaults to 4).
#
# Deliberately NOT in this fleet (manual / human-gated — do these by hand):
# - plan 0.3  bench baseline: run one fixed packages/bench task after p0-2 lands,
#             record billed input + cache read/write + per-step wall clock.
# - plan 1.5  the bench RE-run + diff vs baseline (the test-writing half is p1-5).
# - plan 2.3  the actual billing-meter flip: verify metered totals against an
#             Anthropic invoice window, then enable the flag p2-3 lands dark,
#             then `pnpm billing:stripe-sync`. Billing-manager review required.
# - plan 4.3  prod-equivalent verification of cookieCache (p4-3 lands config+tests).
# - Phase 4 security review sign-off (auth/billing surface — flag the PR).

