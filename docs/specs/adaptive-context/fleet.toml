Commit via repo_commit: "feat(context-exchange): ed25519 attestations with
key rotation". Reconcile with already-landed work.
'''
depends_on = ["x05-resolve-query"]
claims = [
  "packages/context-exchange/src/attestation.ts",
  "packages/context-exchange/src/keys.ts",
]

