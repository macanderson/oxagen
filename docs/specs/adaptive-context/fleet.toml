[[tasks]]
id = "x09-publication"
title = "Workspace publication: RBAC approval, promotion events, revocation"
prompt = '''
You are one task in a fleet building the Oxagen Context Exchange Provider.
Read first: lifecycle spec §13.4 (the flow is normative) and spec.md §8;
