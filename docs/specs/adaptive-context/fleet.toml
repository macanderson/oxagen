[[tasks]]
id = "x10-export-manifest"
title = "ContextExportManifest acceptance"
prompt = '''
You are one task in a fleet building the Oxagen Context Exchange Provider.
Read first: lifecycle spec §5.3 (export compiler + egress table) and the
implementation plan's §2.8/context_exports description in
adaptive-context-implementation-plan.md (the manifest fields), plus
