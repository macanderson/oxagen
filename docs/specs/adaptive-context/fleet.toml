# ============================================================================
# Fleet plan: adaptive-context — Oxagen Context Exchange Provider
#
# Source spec: docs/specs/adaptive-context/spec.md (platform-side; §1 gives
# the authority order over the canonical bundle in this directory — the CGP
# build prompt is normative for wire semantics, the lifecycle spec for record
# meaning; directive-schema.md and context-frame-spec.md are superseded
# drafts). This plan builds ONLY oxagen-platform; the Stella and
# context-graph-protocol repos have their own plans.
#
# How to run
#   git switch -c feat/adaptive-context-provider origin/main
#   stella --budget 250 fleet --plan docs/specs/adaptive-context/fleet.toml \
#     --max-concurrency 4
#   (stella >= 0.4.43: --budget is a top-level whole-run hard cap)
#
# Operational notes
#   - No resume: re-running re-dispatches every task; every prompt tells its
#     worker to reconcile with already-landed work instead of duplicating.
#   - `claims` are exact-string file locks; two tasks sharing a claim are
#     dependency-ordered here — a same-wave conflict fails dispatch
#     permanently. Claims also guard against other fleets in this workspace.
#   - ONE task (x02) owns ALL Atlas DDL: atlas.sum is a single checksum file
#     and concurrent migration authoring cannot merge.
#
# Binding repo rules restated for workers (AGENTS.md / CLAUDE.md /
# CONTRIBUTING.md / oxagen-engineering-policy):
#   - NEVER run all tests or any whole-repo/whole-package suite. Run ONLY the
#     single test file you touched: pnpm --filter @oxagen/<pkg> test:unit --
#     <file>.test.ts. Otherwise just write the tests; CI is the gate.
#   - Everything committed must be functionally complete — wired end-to-end,
#     tests written, no dead code, no placeholder stubs.
#   - Env vars ONLY via packages/config/src/registry.ts, then regenerate
#     .env.example. Never hand-edit .env.example.
#   - Tenant tables require the standard RLS block; raw db() is banned — use
#     packages/tenancy scope helpers.
#   - LLM calls only via @oxagen/ai (this plan should need none).
#   - ESLint zero warnings; Biome is the only formatter.
#   - Commit with repo_commit using a conventional-commit subject
#     (feat(context-exchange): ...) — the style PRs #1070/#1071 fleet workers
#     use. (CONTRIBUTING.md prefers bare imperative subjects; the fleet
#     precedent in this repo is conventional — keep consistency with it.)
#     Uncommitted work is lost.
# ============================================================================

[[tasks]]
id = "x00-scaffold-hashing"
title = "Scaffold packages/context-exchange + JCS hashing + golden vectors"
prompt = '''
You are one task in a fleet building the Oxagen Context Exchange Provider.
Read first: docs/specs/adaptive-context/spec.md (all of it — it is short and
this plan's authority map), then the "Canonical record envelope" and append
command_hash sections of docs/specs/adaptive-context/
context-graph-protocol-build-prompt.md. Also read the repo rules in this
plan's header — they are binding.

Deliver:

1. A new package `packages/context-exchange` (@oxagen/context-exchange)
   scaffolded by copying a small sibling's shape (e.g. packages/compliance):
   package.json, tsconfig, vitest config, src/index.ts barrel. No runtime
   deps beyond what you justify.
2. RFC 8785 (JCS) canonicalization + hashing in src/hash.ts: spec.md §11.1
   leaves the choice to you — the `canonicalize` npm package (reference
   implementation, zero transitive deps; justify the new dependency in your
   commit body per repo policy) or a hand-rolled subset (sorted keys,
   canonical escapes, documented integers-preferred number policy). Expose:
   recordHash(record) — sha256:<64 lowercase hex> over JCS bytes with the
   record_hash property omitted, after alias normalization
   (recorded_at->observed_at, valid_to->valid_until), absent-option
   omission, null-as-absence, and UTC timestamp normalization (trailing
   fractional zeros removed); commandHash(item) — JCS over the append item's
   semantic command body (computed record_hash + requested_retention + any
   behavior-changing option) with idempotency_key and command_hash omitted.
3. Golden vectors: docs/specs/adaptive-context/fixtures/hash-vectors.json —
   at least six vectors (observation, knowledge fact, directive, promotion
   event, an aliased-input record proving normalization, an append
   command_hash case) with REAL 64-hex digests (the spec bans sha256:...
   placeholders in fixtures). These vectors are the cross-repo contract —
   the Stella and protocol repos will copy them; note that in a fixtures
   README line.
4. Unit tests in src/hash.test.ts covering the vectors and the
   normalization rules. Run ONLY: pnpm --filter @oxagen/context-exchange
   test:unit -- hash.test.ts.

Commit via repo_commit: "feat(context-exchange): package scaffold, JCS
canonicalization, hash golden vectors". If a prior fleet run already landed
parts of this, reconcile and complete rather than duplicate.
'''
depends_on = []
claims = [
  "packages/context-exchange/package.json",
  "packages/context-exchange/src/hash.ts",
  "docs/specs/adaptive-context/fixtures",
]

[[tasks]]
id = "x01-record-validation"
title = "Record envelope validation: requiredness, provenance matrix, scope/sharing"
prompt = '''
You are one task in a fleet building the Oxagen Context Exchange Provider.
Read first: docs/specs/adaptive-context/spec.md §6-§7 and §10; the
"Canonical record envelope", "Scope and sharing", "Temporal semantics", and
provenance sections of context-graph-protocol-build-prompt.md; lifecycle
spec §7.6-§7.7. The header rules of this plan are binding.

Deliver, in packages/context-exchange/src/validate.ts (+ types.ts):

1. TypeScript types (zod schemas, matching how packages/oxagen contracts
   validate IO) for the ContextRecord envelope and the twelve record kinds
   as a flat record_kind-discriminated union — type-specific fields at top
   level, unknown namespaced extensions preserved losslessly, unknown
   top-level properties rejected explicitly (never silently dropped).
2. Envelope validation: schema_version, record_id, record_kind, observed_at,
   nonempty scope, sharing_scope required on every record; lineage_id and
   record_status required on revision-bearing kinds; valid_from required on
   knowledge/directive/artifact_contract; confidence integer 0..=100;
   half-open interval rule valid_until > valid_from; sensitivity required
   before acceptance (spec.md §5 — missing legacy value is rejected at the
   provider boundary, not defaulted).
3. Provenance: all five scalar fields required on exchanged records;
   source_refs may be empty only for authored originals; enforce the
   origin×derivation matrix exactly (user→authored|transformed,
   system→authored|transformed, observed→observed|extracted|transformed,
   inferred→inferred|summarized|transformed, imported→imported|transformed).
4. Sharing/scope identity matching: user⇒scope.user_id, repository⇒
   repository binding, workspace⇒scope.workspace_id, organization⇒
   scope.organization_id — each sharing value requires its matching id;
   constraint effect allow is structurally impossible; directive kinds are
   exactly preference|rule|constraint|procedure (memory/fact are NOT
   directive kinds — directive-schema.md is superseded on this point).
5. Legacy input aliases (recorded_at, valid_to) accepted on ingestion and
   normalized; canonical output never emits them.
6. Tests in validate.test.ts: one accept + at least one reject per rule
   family; run ONLY that file via pnpm --filter @oxagen/context-exchange
   test:unit -- validate.test.ts.

Commit via repo_commit: "feat(context-exchange): canonical record
validation". Reconcile with already-landed work.
'''
depends_on = ["x00-scaffold-hashing"]
claims = [
  "packages/context-exchange/src/validate.ts",
  "packages/context-exchange/src/types.ts",
]

[[tasks]]
id = "x02-db-schema"
title = "context_exchange Postgres schema + single Atlas migration (all DDL)"
prompt = '''
You are one task in a fleet building the Oxagen Context Exchange Provider.
Read first: docs/specs/adaptive-context/spec.md §5 (the table list is
normative); the repo migration law: Drizzle schema in packages/database/src/
schema/, SQL migrations in packages/database/atlas/migrations/ ONLY, file
name YYYYMMDDHHMMSS_snake_name.sql with a timestamp prefix sorting AFTER
every existing file (check `ls packages/database/atlas/migrations | tail`),
then regenerate the checksum from packages/database with `atlas migrate hash
--dir "file://atlas/migrations"` — NEVER hand-edit atlas.sum. Local DB is
localhost:5433; `unset DATABASE_URL` before targeting local. Model the RLS
block on packages/database/atlas/migrations/20260731130700_routing_policy.sql
(workspace_nullable class; tools/scripts/gen-rls-migration.ts generates it).

Deliver:

1. A new `context_exchange` pgSchema registered in
   packages/database/src/schema/_schemas.ts, with Drizzle tables in a new
   packages/database/src/schema/context-exchange.ts, barrel-registered in
   index.ts: context_records (canonical_json authority + indexed scope
   projections + record_hash + lineage/supersession + kind/status/sharing/
   sensitivity/temporal columns), context_record_links,
   context_evidence_links, context_ingestions, context_idempotency_receipts
   (UNIQUE(authority_id, client_id, operation, idempotency_key)),
   context_retention_commitments, context_publication_approvals,
   context_provider_keys (public material + key_id windows only — no
   private key columns). uuid_generate_v7() PK defaults and timestamptz
   audit columns per the example migration.
2. ONE SQL migration containing ALL of the above with RLS
   ENABLE/FORCE + tenant_isolation policies on every tenant-scoped table
   (org_id/workspace_id columns; workspace nullable where the audience is
   org- or user-level). This is the only migration this whole fleet may
   create — later tasks must not add DDL.
3. Indexes per spec.md §5 usage: kind+status+sharing, lineage, observed_at,
   valid_from/valid_until, the scope projections, receipt lookup, and
   approval-queue status.
4. Run pnpm db:lint-migrations and pnpm db:atlas-validate; apply locally
   with pnpm db:migrate and verify with a psql SELECT against
   localhost:5433. Do not run any test suite beyond a schema smoke test
   file if the database package has that convention.

Commit via repo_commit: "feat(database): context_exchange schema with RLS
for the CGP provider". Reconcile with already-landed work.
'''
depends_on = []
claims = [
  "packages/database/src/schema/context-exchange.ts",
  "packages/database/src/schema/_schemas.ts",
  "packages/database/src/schema/index.ts",
  "packages/database/atlas/migrations",
  "packages/database/atlas.sum",
]

[[tasks]]
id = "x03-repositories"
title = "Tenancy-scoped repositories: immutable records, ledgers, revisions"
prompt = '''
You are one task in a fleet building the Oxagen Context Exchange Provider.
Read first: docs/specs/adaptive-context/spec.md §5 and §7; the tenancy law:
raw db() is banned — every query goes through packages/tenancy scope
helpers (runInTenantScope / withTenantDb; system paths via withSystemDb
with a stated reason). Validation and hashing landed in
packages/context-exchange (x00/x01); the schema landed in
packages/database (x02).

Deliver, in packages/context-exchange/src/repo.ts (split files if large):

1. Insert path: validate (x01) -> compute/verify record_hash (x00) ->
   insert canonical row + link projections + ingestion row in ONE
   transaction. Canonical rows are immutable — expose NO update of
   canonical_json; revisions insert a new record_id with
   supersedes_record_id in the same lineage. Enforce sharing/scope identity
   matching against the AUTHENTICATED principal at this layer too (defense
   in depth ahead of the capability IAM check).
2. Read paths: get by exact record_id (hash verified on read, scope/sharing
   authorized); list by kind/status/sharing/scope filters; temporal
   filters per the lifecycle spec — known_at uses provider ingestion
   received_at (reject known_at with a typed error if ingestion history is
   missing), valid_at / observed / valid_overlaps with half-open
   semantics; maximal-applicable-revision-per-lineage selection.
3. Idempotency ledger ops: getOrInsert receipt keyed by (authority_id,
   client_id, operation, idempotency_key); exact receipt_json replay;
   command_hash comparison outcomes (duplicate | idempotency_conflict |
   idempotency_expired past replay_until); record_identity_conflict when an
   existing record_id arrives with a different hash.
4. Retention commitment writes tied to accepted appends; publication
   approval queue CRUD (status transitions only — approval AUTHORITY comes
   later via IAM in x09).
5. Tests (single-file runs only): repo.test.ts with a test-containers or
   the repo's established db-test harness — copy the pattern the database
   or compliance package tests use; cover immutability, revision chains,
   ledger outcomes, temporal truth table boundaries, and an RLS negative
   (wrong-tenant read returns nothing).

Commit via repo_commit: "feat(context-exchange): tenancy-scoped record and
ledger repositories". Reconcile with already-landed work.
'''
depends_on = ["x01-record-validation", "x02-db-schema"]
claims = ["packages/context-exchange/src/repo.ts"]

[[tasks]]
id = "x04-append-get"
title = "Append pipeline with receipts, retention negotiation, typed errors"
prompt = '''
You are one task in a fleet building the Oxagen Context Exchange Provider.
Read first: the `context/records/append` and `context/records/get` sections
of docs/specs/adaptive-context/context-graph-protocol-build-prompt.md —
every semantic there is normative — plus spec.md §6. Repos landed in x03.

Deliver, in packages/context-exchange/src/append.ts, get.ts, errors.ts:

1. errors.ts: the full typed error vocabulary (all 24 codes from
   unsupported_capability through partial_failure) as a discriminated
   union with machine-readable code, safe diagnostic detail, and NO private
   record content in messages.
2. Batched append exactly per the protocol prompt: per-item idempotency_key
   (command metadata, never in record_hash); provider computes record_hash
   before identity/idempotency comparison and verifies caller-supplied
   hashes (record_hash_mismatch); command_hash computed over the semantic
   command body and verified when supplied; retention negotiation —
   requested_retention with retention_class/retention_until/on_expiry, the
   two core on_expiry values, unknown values rejected, and
   retention_rejected BEFORE persistence when the platform policy cannot
   honor the request (never silently shorten or lengthen); best-effort
   batching with per-item accepted|duplicate|rejected receipts carrying
   record identity, accepted_at, accepted_retention, and
   idempotency_replay_until; duplicate/conflict semantics exactly as x03's
   ledger implements; batch_too_large / payload_too_large limits from
   config; `accepted` means durable and immediately readable by exact get
   for the same principal.
3. get: exact record_id batch retrieval with limits mirroring append (spec
   §11.4), missing-record receipts, scope/sharing/consent enforcement,
   unknown-extension round-trip.
4. Receipt attestation hook: leave a typed seam (attestations attached in a
   later task) — do not stub fake signatures.
5. Tests: append.test.ts + get.test.ts (single-file runs) covering every
   receipt status, both idempotency conflicts, expiry
   (idempotency_expired), retention rejection, hash mismatch, identity
   conflict, and the immediate-get-after-accept guarantee.

Commit via repo_commit: "feat(context-exchange): append/get pipeline with
receipts and retention negotiation". Reconcile with already-landed work.
'''
depends_on = ["x03-repositories"]
claims = [
  "packages/context-exchange/src/append.ts",
  "packages/context-exchange/src/get.ts",
  "packages/context-exchange/src/errors.ts",
]

[[tasks]]
id = "x05-resolve-query"
title = "resolve (hash-verified) + v1 query + capability document"
prompt = '''
You are one task in a fleet building the Oxagen Context Exchange Provider.
Read first: the `context/resolve`, "ContextFrame representations", and
"Capability negotiation" sections of context-graph-protocol-build-prompt.md;
spec.md §6 and §9 (v1 query is filtered + temporal listing; deep semantic
retrieval through engram is a documented follow-up — do NOT wire engram
now).

Deliver, in packages/context-exchange/src/resolve.ts, query.ts,
capability-doc.ts:

1. resolve: given an opaque content_ref, desired representation, expected
   canonical content hash, and caller scope/consent context — verify the
   canonical hash BEFORE returning content; typed failures
   reference_not_found, reference_expired, scope_denied, sharing_denied,
   consent_required, content_hash_mismatch, unsupported_representation.
   v1 references resolve against canonical_json content of stored records.
2. query: filtered listing over canonical records (kind, status, sharing,
   scope dimensions) with the temporal selectors from x03 (known_at
   provider-relative via ingestion history — advertise the earliest
   reconstructable time; valid_at; observed; valid_overlaps), stable
   ordering, and bounded page sizes. This is NOT semantic search; say so in
   the module doc with the engram follow-up reference.
3. capability-doc.ts: build the provider capability document advertising
   exactly what is implemented: supported representations (full;
   reference-with-resolve), lifecycle record kinds, accepted operations,
   max payload and batch sizes, batch atomicity (none — best-effort),
   retention classes with min/max bounded duration and supported on_expiry
   behaviors, minimum idempotency receipt-retention, whether provider
   known_at reconstruction is supported and from when, required consent
   class, and unknown-field round-trip behavior. Namespace: use the
   protocol's current published namespace and document contextgraph/lifecycle/
   1.0-draft as the target identifier — never emit both as interchangeable
   aliases (spec.md §6).
4. Tests: resolve.test.ts + query.test.ts (single-file runs) incl. hash
   mismatch, every resolve failure, temporal truth-table spot checks, and
   a capability-doc snapshot.

Commit via repo_commit: "feat(context-exchange): resolve, v1 query,
capability document". Reconcile with already-landed work.
'''
depends_on = ["x04-append-get"]
claims = [
  "packages/context-exchange/src/resolve.ts",
  "packages/context-exchange/src/query.ts",
  "packages/context-exchange/src/capability-doc.ts",
]

[[tasks]]
