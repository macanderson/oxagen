   error when the manifest and items disagree (manifest is the audit
   contract — no silent partial acceptance of unmanifested items).
2. Capability context_exchange.exports.accept (contract + handler per the
   x06 pattern; audit against the manifest hash; check:contracts +
   check:manifest green). Expose through the x07 wire as a POST (guard: if
   the routes file is frozen by another task re-run, add the route in a
   separate file under apps/api/src/routes/contextgraph/ following its structure).
3. Tests: exports.test.ts (single-file run) — happy path; manifest/item
   hash mismatch rejected; missing actor+consent rejected; destination
   identity mismatch rejected; per-item receipts referenced.

Commit via repo_commit: "feat(context-exchange): export manifest
