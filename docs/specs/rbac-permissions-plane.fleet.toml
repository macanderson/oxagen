[[tasks]]
id = "p3-skill-grants"
title = "Phase 3 — skills as grantable resources"
depends_on = ["p1-resource-fetch"]
prompt = '''
Implement Phase 3 of docs/specs/rbac-permissions-plane.md (§3.2, §3.5): per-skill access
grants — the net-new enforcement surface. Today "who may load a skill" is a property of
the VERB (the shared skill.* / agent.skill.load contracts), not the SKILL.

Do:
1. Enforce per-skill access in the agent.skill.load, skill edit/update, and skill
   version-activate handlers: before acting, resolve (resource_type='skill',
   resource_id=<skl_ public id>, action ∈ load|edit|activate) through the resolver.
   When NO skill-specific grant rows exist, fall through to the capability contract's
   existing defaultRoles — today's behavior (Owner/Admin/Member load) must be exactly
   preserved so rollout is a no-op. Skill enable/disable stays a workspace toggle.
2. Add grant-management capability contract(s) in packages/oxagen/src/contracts/
   (e.g. set/list/delete of skill grants — follow ADR-025 naming conventions used by
   neighboring contracts) that read/write iam.resource_grants rows with
   resource_type='skill'. Capability parity is law: contract → API route
   (apps/api/src/routes/v1/) → MCP tool (apps/mcp/src/tools/). Write the
   per-capability doc file(s) under
   docs/capabilities/ but do NOT edit docs/capabilities/_index.md — a later task owns
   that file.
3. Unit tests: enforcement fires on a deny row targeting a specific skill (including for
   an agent principal), falls through cleanly with no rows, and the grant CRUD
   capabilities are tenant-scoped.

