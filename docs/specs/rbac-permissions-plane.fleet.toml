[[tasks]]
id = "p4-mcp-authz"
title = "Phase 4 — MCP per-key tool authz and tools/list filtering"
depends_on = ["p1-resource-fetch"]
claims = ["apps/mcp/src/context.ts", "packages/iam/src/fetch-authz.ts", "packages/database/src/schema/iam.ts"]
prompt = '''
Implement Phase 4 of docs/specs/rbac-permissions-plane.md (§2.3, §3.5): MCP tool-level
authorization. Today an API key carries org+workspace scope but no tool allowlist, and
unauthorized tools are fully LISTED by tools/list and only fail on call.

Do:
1. In buildContext (apps/mcp/src/context.ts), attach the resolved grant set for the
   key's principal to the request context (derive everything from the validated
   credential, never client headers; keep the fail-closed posture).
2. Filter the xmcp tools/list surface so tools the principal is not authorized to call
   are ABSENT from discovery, not merely erroring on invocation — this is the headline
   least-privilege win of the whole spec.
3. Per-key tool allowlists are iam.resource_grants rows (resource_type='mcp_tool',
   action='call') against the key's principal. Keys currently resolve to their
   creator's principal in packages/iam/src/fetch-authz.ts (spec open question 2): if a
   dedicated service-principal-per-key is needed to make per-key grants meaningful,
   implement the minimal version; if that balloons, ship allowlists keyed to the
   existing principal resolution and document the follow-up in code comments and your
   commit message.
4. Flag-gate everything: a key with NO mcp_tool grant rows defaults to "all enabled
   tools" so every existing key keeps working until an allowlist is authored.
5. Do NOT modify packages/oxagen/src/kernel.ts — another task owns it. External
   (mcp.<server>.<tool>) dispatch already flows through authorizeExternalCapability.
6. Unit tests: list-filtering hides unauthorized tools, default-open path with no rows,
   deny row blocks both list and call.

