[[tasks]]
id = "p1-resource-fetch"
title = "Phase 1 — widen fetchAuthz to feed resource grants into the resolver"
depends_on = ["p0-tier-bypass", "p0-resource-grants"]
claims = ["packages/iam/src/fetch-authz.ts", "packages/oxagen/src/iam/resolve.ts"]
prompt = '''
Implement Phase 1 of docs/specs/rbac-permissions-plane.md (§3.4): generalize the fetch,
not the resolver.

Context: fetchAuthz (packages/iam/src/fetch-authz.ts) returns empty grants/policies
arrays since migration 0027 dropped their tables, so only rules 7/7.5/8 can fire. An
earlier task on this branch relanded storage as iam.resource_grants
(packages/database/src/schema/iam.ts — read it for the exact shape).

Do:
1. Widen fetchAuthz to load matching iam.resource_grants rows for the principal (and
   their roles) and map them into the resolver's EXISTING Grant[] shape, generalizing
   the capability key to resourceKey = `${resource_type}:${resource_id}:${action}`.
   Back-compat: a capability grant is resource_type='capability',
   resource_id=<contract name>, action='invoke'. Support action='*' matching any action.
2. Fold role_grants into the same stream as principal_type='role' rows at the FETCH
   layer (leave the role_grants table and the seed/provision path untouched).
3. Widen types in packages/oxagen/src/iam/resolve.ts ONLY as needed for the key
   generalization — NO new decision rules; the rule 1-8 precedence is exactly the
   composition the spec wants (deny > require_approval > allow at equal specificity;
   resource-specific beats capability-default; principal-specific beats role-inherited
   beats defaultEffect; workspace allow beats org; org-enforced deny beats everything).
4. Honor `conditions` jsonb via the existing evaluator (packages/oxagen/src/iam/
   conditions.ts — fail-closed) and `expires_at` (expired rows must never match).
5. Perf (spec §5): batch the new query in parallel with the existing fetches and add a
   short-TTL cache keyed by (principal, workspace), mirroring the entitlement service's
   30s cache pattern.
6. Unit tests covering the full §3.4 composition matrix, including the tier-universal
   enforcement landed by the Phase 0 task.

Operating rules: read docs/specs/rbac-permissions-plane.md first — your task is one slice
of its rollout plan. Reconcile with already-landed work on this branch: this fleet has no
resume, so if part of this task already exists, extend it instead of duplicating. Write
