`turbo run test`, `pnpm gate`, or any whole-repo suite. When done, COMMIT all your work
via repo_commit with a descriptive message — uncommitted work does not land.
'''

[[tasks]]
id = "p2-app-parity"
title = "Phase 2 — apps/app IAM parity via assertCapability"
depends_on = ["p1-resource-fetch"]
claims = ["apps/app/src/lib/workbench/scope.ts", "apps/app/src/lib/automations/scope.ts", "apps/app/src/lib/agent-tools/authz.ts"]
prompt = '''
Implement Phase 2 of docs/specs/rbac-permissions-plane.md (§2.5): apps/app does not
bootstrap the IAM kernel runtime, so invoke() from server actions skips the resolver and
app surfaces hand-roll a coarse canManage boolean. NOTE the spec predates a refactor:
resolveStudioScope / apps/app/src/lib/studio/scope.ts no longer exist. The pattern now
lives in resolveWorkbenchScope (apps/app/src/lib/workbench/scope.ts) and
resolveAutomationsScope (apps/app/src/lib/automations/scope.ts) — both compute
canManage = ["owner","admin"].includes(role) — plus consumers such as
apps/app/src/lib/agent-tools/authz.ts. Search the app for every canManage site.

Do:
1. Bootstrap the IAM runtime in apps/app server startup (bootstrapIAMRuntime from
   packages/iam/src/bootstrap.ts) so invoke() from server actions is gated identically
   to API/MCP. Also ensure bootstrapEntitlementRuntime() from @oxagen/plugins is called,
   and remember invoke() needs `import "@oxagen/handlers/register"`.
2. Add a shared assertCapability(ctx, name, action) helper backed by the resolver, so
   the check is audited and resolver-consistent instead of hand-rolled.
3. Migrate every canManage call site (workbench, automations, agent-tools authz, and
   any other surface rg finds) onto assertCapability. canManage may remain as a thin
   resolver-backed wrapper to limit churn.
4. Behavior must be preserved by default grants: workspace owner/admin manage, others
   read-only — assert exactly this in unit tests so rollout is a no-op until an admin
   authors a narrowing grant.
5. Server Components only where appropriate — never call a "use client" function from a
   Server Component.

