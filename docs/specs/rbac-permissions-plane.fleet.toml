[[tasks]]
id = "p5-plugin-grants"
title = "Phase 5 — plugin per-principal grants in the entitlement gate"
depends_on = ["p1-resource-fetch"]
claims = ["packages/oxagen/src/kernel.ts", "packages/plugins/src/entitlements/entitlement-service.ts"]
prompt = '''
Implement Phase 5 of docs/specs/rbac-permissions-plane.md (§2.4, §3.5): give the plugin
entitlement plane a principal dimension. Today the kernel's capability entitlement gate
(packages/oxagen/src/kernel.ts + packages/plugins/src/entitlements/
entitlement-service.ts) is a binary workspace install/enable check — once a pack is
installed, every principal who passes the capability IAM check may use it.

Do:
1. Keep the existing install/enable check (workspace-scoped per ADR-013/014, 30s cache)
   exactly as is, then ADD a resource-grant check: resolve (resource_type='plugin',
   resource_id=<plugin id, e.g. oxagen/media-svg>, action='use') for the invoking
   principal through the resolver.
2. Absent any plugin grant rows, behavior is unchanged (installed ⇒ allowed) — assert
   this no-op default in tests.
3. Make installed-but-not-granted a DISTINCT, explainable error from the existing
   capability_not_installed (typed error class with a stable code, per the repo's
   error-handling conventions), so a denial is attributable to a grant rather than a
   missing install.
4. Preserve gate ordering: the entitlement gate stays after the billing admission gate
   in _invokeCore. Match the existing cache pattern for the new grant lookup.
5. Unit tests in packages/plugins for the gate logic and a kernel-level test for
   ordering + the distinct error codes.

