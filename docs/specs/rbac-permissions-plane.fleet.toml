# Fleet plan: RBAC Permissions Plane rollout
# Source spec: docs/specs/rbac-permissions-plane.md (Phases 0-5 of §4, one task per phase,
# Phase 0 split into its two independent items, plus a final docs/parity pass).
#
# How to run:
#   git switch -c feat/rbac-permissions-plane origin/main   # shared_tree workers commit to the CURRENT branch
#   stella fleet --plan docs/specs/rbac-permissions-plane.fleet.toml --max-concurrency 4 --budget <N>
#
# Operational notes:
# - The fleet has NO resume: re-running re-dispatches every task. Prompts tell workers to
#   reconcile with already-landed work instead of duplicating it.
# - Per-child budget = --budget / --max-concurrency (default concurrency 4).
# - Enable worker shell access if your build supports it: the schema task wants
#   `atlas migrate hash`, and workers are told to run narrow (single-file / single-package)
#   tests when they can. Without shell they still write tests, just don't execute them.
# - Claims are exact-string file locks. The claims shared between tasks below
#   (fetch-authz.ts, schema/iam.ts) are dependency-ordered on purpose; do not add a task
#   that shares a claim without also dependency-ordering it.

[[tasks]]
id = "p0-tier-bypass"
title = "Phase 0a — remove the non-enterprise IAM tier bypass"
claims = ["packages/iam/src/check-iam.ts"]
prompt = '''
Implement Phase 0 (tier-bypass item) of docs/specs/rbac-permissions-plane.md.

The P0 defect (spec §2.2): checkIAM in packages/iam/src/check-iam.ts (~line 74) reads the
org plan tier and returns an unconditional allow for any non-enterprise org BEFORE the
8-rule resolver runs — canAccessACL(tier) is `tier === "enterprise"`. For non-enterprise
orgs the entire grant matrix, explicit denies, require_approval, and conditions are inert.

Do:
1. Make the resolver (packages/oxagen/src/iam/resolve.ts — do not modify it) run for ALL
   tiers, per the spec's recommended policy: governance is universal, tier gating belongs
   on matrix-AUTHORING surfaces only. Keep canAccessACL exported for those surfaces if
   referenced, but it must no longer short-circuit enforcement.
2. Preserve current behavior for orgs with no grant rows: resolution must reduce to
   role-inherited grants + contract defaultEffect — which is what non-enterprise orgs
   effectively get today. Add unit tests asserting a non-enterprise org with default
   seeds resolves identically before/after this change, and that an explicit deny row
   now actually denies for a non-enterprise org.
3. Do NOT modify packages/iam/src/fetch-authz.ts — a separate task owns that file.

Operating rules: read docs/specs/rbac-permissions-plane.md first — your task is one slice
of its rollout plan. Reconcile with already-landed work on this branch: this fleet has no
resume, so if part of this task already exists, extend it instead of duplicating. Write
unit tests for all new/changed logic. If you can run tests, run ONLY the narrowest
relevant command — a single test file or one package's test:unit (e.g.
`pnpm --filter @oxagen/iam test:unit -- check-iam.test.ts`); NEVER run `pnpm test`,
`turbo run test`, `pnpm gate`, or any whole-repo suite. When done, COMMIT all your work
via repo_commit with a descriptive message — uncommitted work does not land.
'''

[[tasks]]
id = "p0-resource-grants"
title = "Phase 0b — reland grant storage as iam.resource_grants"
claims = ["packages/database/src/schema/iam.ts", "packages/database/atlas/migrations"]
prompt = '''
Implement Phase 0 (grant-storage item) of docs/specs/rbac-permissions-plane.md — the
iam.resource_grants table from spec §3.3, reviving the direct-grant storage dropped in
migration 0027.

Do:
1. Drizzle schema in packages/database/src/schema/iam.ts, following the conventions of
   the sibling tables in that file exactly (UUID id + public id with `rsg_` prefix,
   auditMixin + softDeleteMixin). Columns per §3.3:
   org_id (not null), principal_type ('user'|'api_key'|'agent'|'role'),
   principal_id (uuid — principal id, OR role id when principal_type='role'),
   resource_type ('capability'|'skill'|'mcp_tool'|'plugin'), resource_id (text),
   action (text — 'invoke'|'load'|'edit'|'activate'|'call'|'use'|'*'),
   scope_kind ('org'|'workspace'), scope_id (uuid),
   effect ('allow'|'deny'|'require_approval' — the existing GrantEffect vocabulary),
   conditions (jsonb, nullable), expires_at (timestamptz, nullable).
   Add indexes for the hot lookups: (org_id, principal_type, principal_id) and
   (org_id, resource_type, resource_id).
2. SQL migration in packages/database/atlas/migrations/ — NEVER in apps/. The timestamp
   prefix must sort LATER than every existing migration file.
3. If you have shell access: from packages/database run
   `atlas migrate hash --dir "file://atlas/migrations"` (never hand-edit atlas.sum),
   apply locally (`unset DATABASE_URL` first so .env.local targeting wins; local DB is
   localhost:5433) and verify with a post-migrate SELECT. If you have no shell access,
