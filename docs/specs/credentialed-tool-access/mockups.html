<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credentialed Access and the Fleet Channel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Tokens are the house set, copied from the consolidated mockup (mc.html) so
   these surfaces drop straight in. Dark is bare :root; light arrives by
   preference and by explicit toggle, so both directions work. */
:root{
  --ink:#10100F; --void:#0A0A09; --panel:#181715; --hl:#201F1C; --border:#292722; --rule:#34322D;
  --fg:#F2EEE5; --body:#DDD8CD; --muted:#9B958A; --dim:#6E6A62;
  --gold:#D6962C; --gold-bright:#F1C364; --gold-deep:#8B5E1A; --accent-text:#D6962C;
  --on-gold:#10100F;
  --st-allowed:#57A97C; --st-approval:#5B93D6; --st-denied:#C66A4A;
  --st-proven:#3FA2A2; --st-failed:#C0453C; --st-critical:#D6455E; --st-observe:#9B958A;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 18px 44px rgba(0,0,0,.5);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --font:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --dock:56px;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --ink:#F2EEE5; --void:#E9E3D8; --panel:#F8F5EE; --hl:#EFEAE0; --border:#D8CDBD; --rule:#C9BFAE;
  --fg:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C;
  --accent-text:#8B5E1A; --on-gold:#10100F;
  --st-allowed:#2F7D52; --st-approval:#2E6BA8; --st-denied:#9B4526;
  --st-proven:#1F7676; --st-failed:#992F28; --st-critical:#AE2540; --st-observe:#6B665C;
  --shadow:0 1px 0 rgba(255,255,255,.7),0 18px 44px rgba(16,16,15,.08);
  --shadow-sm:0 1px 2px rgba(16,16,15,.06);
}}
:root[data-theme="light"]{
  --ink:#F2EEE5; --void:#E9E3D8; --panel:#F8F5EE; --hl:#EFEAE0; --border:#D8CDBD; --rule:#C9BFAE;
  --fg:#10100F; --body:#2A2823; --muted:#6B665C; --dim:#8C877C;
  --accent-text:#8B5E1A; --on-gold:#10100F;
  --st-allowed:#2F7D52; --st-approval:#2E6BA8; --st-denied:#9B4526;
  --st-proven:#1F7676; --st-failed:#992F28; --st-critical:#AE2540; --st-observe:#6B665C;
  --shadow:0 1px 0 rgba(255,255,255,.7),0 18px 44px rgba(16,16,15,.08);
  --shadow-sm:0 1px 2px rgba(16,16,15,.06);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
svg{display:block;flex:none}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:13px;height:13px}
.ic.lg{width:20px;height:20px}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)} .dim{color:var(--dim)}

/* ============================ harness chrome ============================ */
#harness{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;gap:8px;align-items:center;
  padding:8px 12px;background:var(--void);border-bottom:1px solid var(--border);flex-wrap:wrap}
#harness .hb{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-right:auto}
.hbtn{border:1px solid var(--border);border-radius:7px;padding:4px 9px;font-size:12px;color:var(--body);
  background:var(--panel);display:inline-flex;gap:6px;align-items:center}
.hbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--accent-text)}
#stage{padding-top:44px}
#viewport{max-width:1220px;margin:0 auto}
#viewport.phone{max-width:400px;border-left:1px solid var(--border);border-right:1px solid var(--border);min-height:100vh}

/* ============================== app shell ============================== */
.app{display:grid;grid-template-columns:216px 1fr;min-height:calc(100vh - 44px)}
.side{border-right:1px solid var(--border);background:var(--void);padding:14px 10px 24px;position:sticky;top:44px;
  align-self:start;height:calc(100vh - 44px);overflow:auto}
.brand{display:flex;gap:9px;align-items:center;padding:4px 8px 14px}
.brand .mk{width:22px;height:22px;border-radius:6px;background:var(--gold);display:grid;place-items:center;color:var(--on-gold);
  font-weight:700;font-size:12px;flex:none}
.brand b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.wsx{margin:0 4px 14px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--panel);font-size:12.5px;
  display:flex;gap:7px;align-items:center}
.wsx .g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navlab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:12px 10px 5px}
.navitem{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--body);font-size:13px;width:100%}
.navitem:hover{background:var(--hl)}
.navitem.on{background:var(--hl);color:var(--fg);box-shadow:inset 2px 0 0 var(--gold)}
.navitem .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;border:1px solid var(--border);border-radius:20px;padding:0 6px;color:var(--muted)}
.navitem .ct.hot{color:var(--st-approval);border-color:color-mix(in srgb,var(--st-approval) 40%,transparent)}
.main{min-width:0;padding:0 0 calc(var(--dock) + 26px)}
.topbar{display:flex;gap:10px;align-items:center;padding:11px 20px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--ink) 88%,transparent);position:sticky;top:44px;z-index:20;backdrop-filter:blur(8px)}
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:center;min-width:0;flex:1}
.crumb b{color:var(--fg);font-weight:600}
.iconbtn{width:30px;height:30px;border:1px solid var(--border);border-radius:8px;display:grid;place-items:center;
  background:var(--panel);color:var(--body);position:relative;flex:none}
.iconbtn .dot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--st-approval)}
.menub{display:none}
.wrap{padding:18px 20px 0}
.h1{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0 0 3px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 16px;max-width:66ch}

/* mobile: nav becomes a sheet, the bottom stays the agent's */
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:44px;left:0;bottom:0;width:270px;z-index:45;transform:translateX(-100%);
    transition:transform .18s ease;height:auto}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .menub{display:grid}
  .wrap{padding:14px 14px 0}
  .topbar{padding:10px 14px}
  .scrim{position:fixed;inset:44px 0 0;background:rgba(0,0,0,.45);z-index:40}
}
#viewport.phone .app{grid-template-columns:1fr}
#viewport.phone .side{position:absolute;transform:translateX(-100%)}
#viewport.phone .side.open{transform:none}
#viewport.phone .menub{display:grid}
#viewport.phone .wrap{padding:14px 14px 0}
#viewport.phone .topbar{padding:10px 14px}
#viewport.phone{position:relative}

/* =============================== atoms =============================== */
.panel{border:1px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden;min-width:0}
.panel-h{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel-h b{font-size:13px;font-weight:600}
.panel-h .g{flex:1}
.panel-b{padding:13px 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
/* The rail stacks under the content until there is room for a full table
   beside it. A laptop gets the table's width; a wide screen gets both. */
.split{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
@media(max-width:1320px){.split{grid-template-columns:1fr}}
@media(max-width:860px){.cols2,.cols3{grid-template-columns:1fr}}
#viewport.phone .cols2,#viewport.phone .cols3,#viewport.phone .split{grid-template-columns:1fr}

.b{display:inline-flex;gap:5px;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;
  border:1px solid var(--border);border-radius:20px;padding:1px 7px;color:var(--muted);white-space:nowrap}
.b-allowed{color:var(--st-allowed);border-color:color-mix(in srgb,var(--st-allowed) 42%,transparent);background:color-mix(in srgb,var(--st-allowed) 11%,transparent)}
.b-approval{color:var(--st-approval);border-color:color-mix(in srgb,var(--st-approval) 42%,transparent);background:color-mix(in srgb,var(--st-approval) 11%,transparent)}
.b-denied{color:var(--st-denied);border-color:color-mix(in srgb,var(--st-denied) 42%,transparent);background:color-mix(in srgb,var(--st-denied) 11%,transparent)}
.b-critical{color:var(--st-critical);border-color:color-mix(in srgb,var(--st-critical) 45%,transparent);background:color-mix(in srgb,var(--st-critical) 12%,transparent)}
.b-proven{color:var(--st-proven);border-color:color-mix(in srgb,var(--st-proven) 42%,transparent);background:color-mix(in srgb,var(--st-proven) 11%,transparent)}
.b-observe{color:var(--st-observe);border-style:dashed}
.b-gold{color:var(--accent-text);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}

.btn{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:6px 11px;
  font-size:12.5px;font-weight:500;background:var(--panel);color:var(--body);min-height:32px}
.btn:hover{background:var(--hl);color:var(--fg)}
.btn.p{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.btn.p:hover{background:var(--gold-bright)}
.btn.dz{border-color:color-mix(in srgb,var(--st-denied) 48%,transparent);color:var(--st-denied)}
.btn.sm{padding:3px 8px;font-size:11.5px;min-height:26px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.inp{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--ink);padding:7px 10px;font-size:13px;min-height:34px}
.sel{border:1px solid var(--border);border-radius:8px;background:var(--panel);padding:5px 8px;font-size:12px}

table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:left;
  padding:8px 12px;border-bottom:1px solid var(--border);font-weight:400;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hl)}
.tw{overflow-x:auto}
/* A table is wide by nature. Let it scroll inside its own box rather than
   wrapping every cell into two lines, and never let it widen the page. */
td.nw,th.nw{white-space:nowrap}

/* card list: the mobile form of every table */
.cl{display:grid;gap:9px;padding:12px}
.cd{border:1px solid var(--border);border-radius:10px;background:var(--ink);padding:11px 12px;display:grid;gap:7px}
.cd .t{display:flex;gap:8px;align-items:center}
.cd .t b{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd .m{display:flex;gap:6px;flex-wrap:wrap}
.cd .kv{display:flex;gap:6px;font-size:11.5px;color:var(--muted)}
.cd .kv span{color:var(--body)}

/* skeletons + empties + errors */
.sk{background:linear-gradient(90deg,var(--hl) 25%,var(--border) 37%,var(--hl) 63%);background-size:300% 100%;
  animation:shim 1.3s linear infinite;border-radius:6px;height:11px}
@keyframes shim{0%{background-position:150% 0}100%{background-position:-150% 0}}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:9px;justify-items:center}
.empty .g{width:38px;height:38px;border-radius:11px;border:1px dashed var(--rule);display:grid;place-items:center;color:var(--dim)}
.empty b{color:var(--fg);font-size:13.5px;font-weight:600}
.empty p{margin:0;font-size:12.5px;max-width:44ch}
.errbox{margin:12px;border:1px solid color-mix(in srgb,var(--st-failed) 45%,var(--border));border-radius:10px;
  background:color-mix(in srgb,var(--st-failed) 8%,transparent);padding:12px 13px;display:flex;gap:10px;align-items:flex-start}
.errbox b{font-size:13px;display:block;margin-bottom:2px}

/* ==================== the small approval card ====================
   Same anatomy as the full-size card (clock, terms, two actions), at a size
   that never owns a page. It is a row in a list, not a hero. */
.apc{border:1px solid color-mix(in srgb,var(--st-approval) 34%,var(--border));border-radius:10px;background:var(--ink);
  padding:10px 11px;display:grid;gap:8px;min-width:0}
.apc.crit{border-color:color-mix(in srgb,var(--st-critical) 40%,var(--border))}
.apc.done{border-color:var(--border);opacity:.72}
.apc-h{display:flex;gap:9px;align-items:center;min-width:0}
.apc-h .g{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;
  color:var(--st-approval);background:color-mix(in srgb,var(--st-approval) 13%,transparent)}
.apc.crit .apc-h .g{color:var(--st-critical);background:color-mix(in srgb,var(--st-critical) 13%,transparent)}
.apc-h .tt{min-width:0;flex:1}
.apc-h .tt b{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apc-h .tt span{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apc-clk{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--st-approval);font-variant-numeric:tabular-nums;flex:none}
.apc.crit .apc-clk{color:var(--st-critical)}
.apc-t{display:grid;gap:3px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.apc-t i{font-style:normal;color:var(--body)}
/* Actions keep their own width so a card that happens to sit in a wide
   column does not grow a pair of billboard-sized buttons. They only fill
   when the card itself is narrow, which is where a thumb needs the target. */
.apc-a{display:flex;gap:6px;flex-wrap:wrap}
.apc-a .btn{flex:0 1 auto;justify-content:center;min-width:92px}
.apstrip{display:grid;gap:9px}
.apstrip>.apc{max-width:520px}
@media(min-width:861px){.apstrip.wide{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.apc-a .btn{flex:1 1 auto}}
#viewport.phone .apc-a .btn{flex:1 1 auto}

/* containment tiers: a glyph and a word, never a hue that implies safety */
.tier{display:inline-flex;gap:5px;align-items:center;font-family:var(--mono);font-size:10.5px;border:1px solid var(--border);
  border-radius:6px;padding:1px 6px;color:var(--body);white-space:nowrap}
.tier.brokered{border-color:color-mix(in srgb,var(--st-proven) 50%,transparent);color:var(--st-proven)}
.tier.leased{border-color:color-mix(in srgb,var(--st-allowed) 45%,transparent);color:var(--st-allowed)}
.tier.injected{border-color:color-mix(in srgb,var(--st-denied) 48%,transparent);color:var(--st-denied);border-style:dashed}
.tier.delegated{border-style:dotted}

/* ============================ the thread ============================ */
.thr{display:grid;gap:10px;padding:13px 14px}
.msg{display:grid;grid-template-columns:28px 1fr;gap:10px;min-width:0}
.msg .av{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--border);
  background:var(--ink);color:var(--muted)}
.msg.op .av{color:var(--accent-text);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.msg.ag .av{color:var(--body)}
.msg.sys .av{border-style:dashed;color:var(--dim)}
.bub{border:1px solid var(--border);border-radius:10px;background:var(--ink);padding:9px 11px;min-width:0}
.msg.op .bub{background:color-mix(in srgb,var(--gold) 5%,var(--ink))}
.msg.sys .bub{background:transparent;border-style:dashed}
.bub .mh{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.bub .mh b{font-size:12.5px;font-weight:600}
.bub .mh .tm{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:auto}
.bub p{margin:0;font-size:13px;color:var(--body)}
.bub .q{border-left:2px solid var(--rule);padding-left:9px;font-size:12px;color:var(--muted);margin:0 0 6px}

/* delivery lifecycle */
.life{display:flex;gap:0;align-items:center;flex-wrap:wrap;margin-top:7px;font-family:var(--mono);font-size:10px}
.life i{font-style:normal;border:1px solid var(--border);padding:1px 7px;color:var(--dim);border-right:0}
.life i:first-child{border-radius:6px 0 0 6px}
.life i:last-child{border-radius:0 6px 6px 0;border-right:1px solid var(--border)}
.life i.on{color:var(--fg);background:var(--hl);border-color:var(--rule)}
.life i.bad{color:var(--st-denied);border-color:color-mix(in srgb,var(--st-denied) 45%,transparent);
  background:color-mix(in srgb,var(--st-denied) 10%,transparent)}
.life i.good{color:var(--st-allowed);border-color:color-mix(in srgb,var(--st-allowed) 45%,transparent);
  background:color-mix(in srgb,var(--st-allowed) 10%,transparent)}

/* ============================ the bottom dock ============================
   The in-app agent lives here. Bottom edge is the thumb's edge on a phone,
   and a persistent bar on a desktop, so the agent is one reach away on every
   page without ever owning one. */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--void);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom)}
#viewport.phone .dock{position:absolute;left:0;right:0}
.dock-bar{display:flex;gap:9px;align-items:center;padding:9px 14px;max-width:1220px;margin:0 auto;min-height:var(--dock)}
.dock-g{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;color:var(--on-gold);
  background:var(--gold)}
.dock-in{flex:1;min-width:0;border:1px solid var(--border);border-radius:9px;background:var(--panel);padding:7px 11px;
  font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dock-in span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock-k{font-family:var(--mono);font-size:10px;border:1px solid var(--border);border-radius:5px;padding:0 5px;color:var(--dim)}
.dock-sheet{max-width:1220px;margin:0 auto;border-top:1px solid var(--border);max-height:56vh;overflow:auto}
.dock-sheet .thr{padding:12px 14px}
.dock-note{padding:8px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--dim);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:860px){.dock-bar{padding:9px 12px}.dock-sheet{max-height:64vh}}

/* dialogs */
.layer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:18px}
.dlg{width:min(560px,100%);max-height:86vh;overflow:auto;border:1px solid var(--rule);border-radius:14px;background:var(--panel);
  box-shadow:var(--shadow)}
.dlg-h{display:flex;gap:10px;align-items:center;padding:13px 15px;border-bottom:1px solid var(--border)}
.dlg-h b{font-size:14px;font-weight:600;flex:1}
.dlg-b{padding:14px 15px;display:grid;gap:12px}
.dlg-f{display:flex;gap:8px;padding:12px 15px;border-top:1px solid var(--border);flex-wrap:wrap}
.dlg-f .g{flex:1}
@media(max-width:860px){.layer{padding:0;place-items:end}.dlg{width:100%;max-height:92vh;border-radius:14px 14px 0 0}}
#viewport.phone .layer{position:absolute;padding:0;place-items:end}
#viewport.phone .dlg{width:100%;border-radius:14px 14px 0 0}

/* key/value blocks, diffs, meters */
.kvs{display:grid;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.kvs div{display:grid;grid-template-columns:132px 1fr;gap:10px;padding:8px 11px;border-bottom:1px solid var(--border);font-size:12.5px}
.kvs div:last-child{border-bottom:0}
.kvs div>i{font-style:normal;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
@media(max-width:520px){.kvs div{grid-template-columns:1fr;gap:2px}}
#viewport.phone .kvs div{grid-template-columns:1fr;gap:2px}

     return '<div>'+tierBadge(t)+'<p class="muted" style="margin:4px 0 0;font-size:12px">'+TIERNOTE[t]+'</p></div>';}).join("")+
   '</div></div>'+
   '<div class="panel"><div class="panel-h"><b>Session statuses</b></div><div class="panel-b row">'+
    ["asking","running","paused","offline","done","denied"].map(sBadge).join(" ")+
   '</div></div>'+
  '</div>'+

  '<div class="cols2">'+
   '<div class="panel"><div class="panel-h"><b>Loading</b></div><div class="cl">'+
    '<div class="cd"><div class="sk" style="width:52%"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:34%"></div></div>'+
    '<div class="cd"><div class="sk" style="width:44%"></div><div class="sk" style="width:70%"></div></div></div></div>'+
   '<div class="panel"><div class="panel-h"><b>Empty and error</b></div>'+
    '<div class="empty"><span class="g">'+ico("fleet")+'</span><b>No sessions yet</b><p>Enroll a host and its sessions appear within ten seconds.</p></div>'+
    '<div class="errbox">'+ico("alert")+'<div><b>Could not reach the control plane</b>'+
    '<span class="muted" style="font-size:12.5px">Queued commands still apply. Nothing new can be dispatched.</span></div></div></div>'+
  '</div></div></div>';
}

/* ============================== dialogs ============================== */
function openDlg(k,arg){S.dlg=k;S.dlgArg=arg||null;render();}
function closeDlg(){S.dlg=null;S.dlgArg=null;render();}
function layer(){
 if(!S.dlg) return "";
 var b="";
 if(S.dlg==="toast"){
  b='<div class="dlg" style="width:min(420px,100%)"><div class="dlg-b"><p style="margin:0">'+esc(S.dlgArg||"")+'</p></div>'+
   '<div class="dlg-f"><span class="g"></span><button class="btn p" onclick="closeDlg()">OK</button></div></div>';
 } else if(S.dlg==="approve"){
  var a=AP[0]; for(var i=0;i<AP.length;i++) if(AP[i].id===S.dlgArg) a=AP[i];
  b='<div class="dlg"><div class="dlg-h">'+ico(a.crit?"alert":"shield","lg")+'<b>Authorize a lease</b>'+
   '<span class="apc-clk">'+a.clock+'</span>'+
   '<button class="iconbtn" onclick="closeDlg()" aria-label="Close">'+ico("x","sm")+'</button></div>'+
   '<div class="dlg-b">'+
   '<p style="margin:0;font-size:13px;color:var(--body)"><b>'+esc(a.agent)+'</b> wants to call <span class="mono">'+esc(a.tool)+'</span>. '+
    'Approving issues a lease, not a key.</p>'+
   '<div class="kvs">'+
    '<div><i>credential</i><span>'+esc(a.cred)+' '+tierBadge(a.tier)+'</span></div>'+
    '<div><i>lease</i><span>'+esc(a.terms[0][1])+'</span></div>'+
    '<div><i>target</i><span class="mono">'+esc(a.terms[1][1])+'</span></div>'+
    '<div><i>declaration</i><span>'+(a.declared?'<span class="b b-proven">pinned a41c9e2</span>':'<span class="b b-denied">not declared</span>')+'</span></div>'+
    '<div><i>blast radius</i><span>4 runs, 1 customer artifact</span></div>'+
   '</div>'+
   (a.declared?'':'<div class="warnbox">'+ico("alert")+'<div><b>Outside the committed declaration.</b> No reviewer has seen this request. Granting it here would be the only human check. Open PR #418 first.</div></div>')+
   '<div class="note">'+TIERNOTE[a.tier]+'</div>'+
   '<label class="sr" for="rz">Reason</label>'+
   '<input class="inp" id="rz" placeholder="Reason, read by the agent and kept in the receipt">'+
   '</div>'+
   '<div class="dlg-f"><button class="btn dz" onclick="act(\'Denied. The reason reaches the agent and the receipt.\')">Deny</button>'+
    '<span class="g"></span>'+
    '<button class="btn" onclick="act(\'Granted for this run. 5 minutes, 1 use.\')">This run</button>'+
    '<button class="btn p" onclick="act(\'Approved once. Lease lse_01K5RTM9 issued for 5 minutes.\')">Approve once</button></div></div>';
 } else if(S.dlg==="approvals"){
  b='<div class="dlg"><div class="dlg-h">'+ico("shield","lg")+'<b>Waiting on you</b>'+
   '<button class="iconbtn" onclick="closeDlg()" aria-label="Close">'+ico("x","sm")+'</button></div>'+
   '<div class="dlg-b"><div class="apstrip">'+AP.map(function(a){return apc(a);}).join("")+'</div></div>'+
   '<div class="dlg-f"><span class="g"></span><button class="btn" onclick="closeDlg()">Close</button></div></div>';
 } else if(S.dlg==="steer"){
  b='<div class="dlg"><div class="dlg-h">'+ico("msg","lg")+'<b>Steer 2 sessions</b>'+
   '<button class="iconbtn" onclick="closeDlg()" aria-label="Close">'+ico("x","sm")+'</button></div>'+
   '<div class="dlg-b">'+
   '<textarea class="inp" rows="3" placeholder="One instruction. It reaches the model as data, never as policy."></textarea>'+
   '<div class="kvs"><div><i>applies</i><span>at the next prompt or tool boundary</span></div>'+
    '<div><i>expires</i><span>in 1 hour if never applied</span></div>'+
    '<div><i>chained to</i><span>Marcus Bell, usr_01K2B7XN</span></div></div>'+
   '<div class="note">Steering is a different permission from authority. This cannot issue a credential lease.</div></div>'+
   '<div class="dlg-f"><span class="g"></span><button class="btn" onclick="closeDlg()">Cancel</button>'+
   '<button class="btn p" onclick="act(\'Queued for 2 sessions. You will see per target delivery.\')">Queue</button></div></div>';
 } else if(S.dlg==="broadcast"){
  b='<div class="dlg"><div class="dlg-h">'+ico("stop","lg")+'<b>Stop the fleet</b>'+
   '<button class="iconbtn" onclick="closeDlg()" aria-label="Close">'+ico("x","sm")+'</button></div>'+
   '<div class="dlg-b">'+
   '<div class="warnbox">'+ico("alert")+'<div>This refuses every tool that is not read only, on every enrolled host in this workspace, within one ingest interval. It fails closed if the control plane is unreachable.</div></div>'+
   '<div class="kvs"><div><i>targets</i><span>6 sessions on 4 hosts</span></div>'+
    '<div><i>leases</i><span>3 outstanding, all invalidated</span></div>'+
    '<div><i>reversible</i><span>yes, by lifting the deny generation</span></div></div>'+
   '<label class="sr" for="cf">Type STOP</label><input class="inp" id="cf" placeholder="Type STOP to confirm">'+
   '</div>'+
   '<div class="dlg-f"><span class="g"></span><button class="btn" onclick="closeDlg()">Cancel</button>'+
   '<button class="btn dz" onclick="act(\'Stopped. Every non read only tool is refused fleet wide.\')">Stop everything</button></div></div>';
 } else if(S.dlg==="reveal"){
  b='<div class="dlg"><div class="dlg-h">'+ico("eye","lg")+'<b>Reveal to me</b>'+
   '<button class="iconbtn" onclick="closeDlg()" aria-label="Close">'+ico("x","sm")+'</button></div>'+
   '<div class="dlg-b">'+
   '<div class="warnbox">'+ico("alert")+'<div>Reading a secret in the clear is the privileged act the trail exists to catch. This writes a <span class="mono">secret.revealed</span> row to the audit log, in the same transaction as the read. There is no reveal without a receipt.</div></div>'+
   '<div class="kvs"><div><i>credential</i><span>stripe-live</span></div>'+
    '<div><i>recorded as</i><span>Marcus Bell, usr_01K2B7XN</span></div>'+
    '<div><i>visible to</i><span>every org Owner, Admin, and Compliance role</span></div></div>'+
   '<label class="sr" for="rr">Reason</label><input class="inp" id="rr" placeholder="Why you need it in the clear">'+
   '</div>'+
   '<div class="dlg-f"><span class="g"></span><button class="btn" onclick="closeDlg()">Cancel</button>'+
   '<button class="btn p" onclick="act(\'Revealed once. A receipt is now in the audit log.\')">Reveal and record</button></div></div>';
 }
 return '<div class="layer" onclick="if(event.target===this)closeDlg()">'+b+'</div>';
}

/* ============================== render ============================== */
function body(){
 switch(S.page){
  case "thread": return pThread();
  case "vault": return pVault();
  case "credential": return pCredential();
  case "declaration": return pDeclaration();
  case "blast": return pBlast();
  case "states": return pStates();
  default: return pFleet();
 }
}
function render(){
 var vp=document.getElementById("viewport");
 vp.className=S.phone?"phone":"";
 document.getElementById("pt").setAttribute("aria-pressed",S.phone?"true":"false");
 vp.innerHTML='<div class="app">'+nav()+
  '<div class="main">'+topbar(PAGES[S.page]||"Fleet")+body()+'</div></div>'+
  (S.side?'<div class="scrim" onclick="S.side=false;render()"></div>':"")+
  dock()+layer();
}
window.addEventListener("hashchange",function(){
 var p=location.hash.replace(/^#\/?/,"");
 if(p&&PAGES[p]){S.page=p;render();}
});
(function(){
 var p=location.hash.replace(/^#\/?/,"");
 if(p&&PAGES[p]) S.page=p;
 paintThemeBtn();render();
})();
</script>
