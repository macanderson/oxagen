packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"
  - "tools/*"

# pnpm 10 reads these settings from pnpm-workspace.yaml only — the
# package.json#pnpm field is ignored (pnpm warns on every install).
overrides:
  drizzle-orm: 0.45.2
  typescript: 6.0.3
  d3-path: 3.1.0
  d3-shape: 3.2.0

onlyBuiltDependencies:
  - "@swc/core"
  - cpu-features
  - esbuild
  - lefthook
  - protobufjs
  - sharp
  - ssh2
  - tree-sitter-javascript
  - tree-sitter-python
  - tree-sitter-typescript
  - unrs-resolver

ignoredBuiltDependencies:
  - "@swc/core"

allowBuilds:
  '@swc/core': true
  cpu-features: true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  ssh2: true
  tree-sitter-javascript: true
  tree-sitter-python: true
  tree-sitter-typescript: true
  unrs-resolver: true
