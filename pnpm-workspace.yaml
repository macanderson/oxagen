packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"
  - "tools/*"

# pnpm 11 reads these settings from pnpm-workspace.yaml only — the
# package.json#pnpm field is ignored (pnpm warns on every install).

# Never prompt before recreating node_modules: non-TTY contexts (background
# agents, CI, pnpm dev's deps check) abort with
# ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY instead of installing.
confirmModulesPurge: false

overrides:
  drizzle-orm: 0.45.2
  typescript: 6.0.3
  d3-path: 3.1.0
  d3-shape: 3.2.0

onlyBuiltDependencies:
  - "@swc/core"
  - blake3
  - cpu-features
  - duckdb
  - esbuild
  - inngest-cli
  - lefthook
  - protobufjs
  - sharp
  - ssh2
  - unrs-resolver

ignoredBuiltDependencies:
  - "@swc/core"
  # Optional on-device runtime (apps/cli). We deliberately skip its install-time
  # native build: node-llama-cpp fetches its prebuilt llama.cpp binary lazily on
  # first use (when the developer opts into an on-device coordinator), so the
  # shared install stays light and the CLI runs fine without it.
  - node-llama-cpp
  # Optional local code-graph embedding backend (apps/cli, via fastembed). Its
  # install script ONLY downloads CUDA binaries for Linux/x64 GPU acceleration
  # (script/install.js: shouldInstall is false on every other platform+arch,
  # a pure no-op) — the CPU binary this feature actually uses is already
  # bundled per-platform in the npm package and required directly by path
  # (dist/binding.js), no install-time step needed. Same shape as
  # node-llama-cpp: skipping the script keeps the shared install light and
  # never blocks users who don't opt into local embeddings.
  - onnxruntime-node

allowBuilds:
  "@swc/core": true
  blake3: true
  cpu-features: true
  duckdb: true
  esbuild: true
  inngest-cli: true
  lefthook: true
  node-llama-cpp: false
  onnxruntime-node: false
  protobufjs: true
  sharp: true
  ssh2: true
  tree-sitter-javascript: set this to true or false
  tree-sitter-python: set this to true or false
  tree-sitter-typescript: set this to true or false
  unrs-resolver: true

minimumReleaseAgeExclude:
  # First-party: our own CGP SDK, consumed the day it is published.
  - '@contextgraphprotocol/typescript-sdk@0.1.0'
  - inngest-cli@1.30.0
  - '@ai-sdk/anthropic@4.0.7'
  - '@ai-sdk/devtools@1.0.2'
  - '@ai-sdk/gateway@4.0.11'
  - '@ai-sdk/openai-compatible@3.0.5'
  - '@ai-sdk/provider-utils@5.0.5'
  - '@ai-sdk/provider@4.0.2'
  - ai@7.0.14
