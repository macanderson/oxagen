packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"
  - "tools/*"
  # Benchmark apps/tools. Only dirs with a package.json are picked up (the
  # Python eval suites under bench/* are ignored); today this is bench/web,
  # the @oxagen/bench-web dashboard launched via `pnpm eval:app`.
  - "bench/*"

# pnpm 10 reads these settings from pnpm-workspace.yaml only — the
# package.json#pnpm field is ignored (pnpm warns on every install).
overrides:
  drizzle-orm: 0.45.2
  typescript: 6.0.3
  d3-path: 3.1.0
  d3-shape: 3.2.0

onlyBuiltDependencies:
  - "@swc/core"
  - blake3
  - cpu-features
  - duckdb
  - esbuild
  - inngest-cli
  - lefthook
  - protobufjs
  - sharp
  - ssh2
  - tree-sitter-javascript
  - tree-sitter-python
  - tree-sitter-typescript
  - unrs-resolver

ignoredBuiltDependencies:
  - "@swc/core"
  # Optional on-device runtime (apps/cli). We deliberately skip its install-time
  # native build: node-llama-cpp fetches its prebuilt llama.cpp binary lazily on
  # first use (when the developer opts into an on-device coordinator), so the
  # shared install stays light and the CLI runs fine without it.
  - node-llama-cpp

allowBuilds:
  "@swc/core": true
  blake3: true
  cpu-features: true
  duckdb: true
  esbuild: true
  inngest-cli: true
  lefthook: true
  node-llama-cpp: false
  protobufjs: true
  sharp: true
  ssh2: true
  tree-sitter-javascript: true
  tree-sitter-python: true
  tree-sitter-typescript: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - inngest-cli@1.30.0
  - '@ai-sdk/anthropic@4.0.7'
  - '@ai-sdk/devtools@1.0.2'
  - '@ai-sdk/gateway@4.0.11'
  - '@ai-sdk/openai-compatible@3.0.5'
  - '@ai-sdk/provider-utils@5.0.5'
  - '@ai-sdk/provider@4.0.2'
  - ai@7.0.14
