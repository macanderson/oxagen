packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# pnpm 11 and later read these settings from pnpm-workspace.yaml only — the
# package.json#pnpm field is ignored (pnpm warns on every install).

overrides:
  drizzle-orm: 0.45.3
  # drizzle-orm takes @types/pg as a peer, so every @types/pg version in the
  # tree gives drizzle-orm a separate instance with its own SQL type. With
  # @oxagen/database on one version and transitive consumers on another,
  # apps/api read SQL<unknown> as not assignable to SQL<unknown> (TS2322).
  # One version for the whole tree keeps one drizzle-orm.
  "@types/pg": 8.23.1
  # Narrowed to <7 so apps/app's `@typescript/native` (npm:typescript@7.0.2,
  # the `tsc` CLI) and its `typescript` alias (npm:@typescript/typescript6, the
  # JS API typescript-eslint needs, plus `tsc6`) are not rewritten to 6.0.3.
  "typescript@<7": 6.0.3
  d3-path: 3.1.0
  d3-shape: 3.2.0
  # Security advisories in transitive dependencies (#5062). Each entry pins one
  # major line to the first version that clears every high or critical
  # advisory `pnpm audit` reported against it on 2026-10-03. A major-only
  # selector never moves a package to another major. Where a newer version of
  # the same major is also in the tree, the selector names only the old range,
  # so the newer copy is not pinned back. Drop an entry once every parent
  # requires the patched version itself.
  #
  # next 16.3.5 (GHSA-vcvr-r3jv-pc5j, critical): the apps pin 16.3.6, but pnpm
  # resolved 16.3.5 as the optional peer of inngest and better-auth in the
  # packages that do not depend on next.
  "inngest>next": 16.3.6
  "better-auth>next": 16.3.6
  # tar (GHSA-23hp-3jrh-7fpw, critical) and adm-zip (five highs): the binary
  # download in inngest-cli's postinstall, a root dev dependency.
  tar@7: 7.5.21
  adm-zip@0: 0.6.1
  # minimatch, through eslint and @vitest/coverage-v8.
  brace-expansion@1: 1.1.20
  brace-expansion@2: 2.1.6
  brace-expansion@5: 5.0.11
  # ajv and @modelcontextprotocol/sdk.
  fast-uri@3: 3.1.7
  # express-rate-limit, through @modelcontextprotocol/sdk.
  ip-address@10: 10.3.1
  # cosmiconfig, through xmcp in apps/mcp.
  js-yaml@4: 4.3.2
  # @vercel/blob in packages/storage.
  undici@6: 6.28.1
  # inngest and @opentelemetry/sdk-node.
  "@grpc/grpc-js@1": 1.14.5
  # @opentelemetry/sdk-node 0.218, which pins 2.7.1. 0.222 already takes 2.11.
  "@opentelemetry/propagator-jaeger@<2.9.0": 2.9.0

# lucide-react imports "react" types without declaring @types/react as a
# peer, so pnpm resolves them through the hidden hoist, which holds the highest
# @types/react in the tree. When the @oxagen/ui kit sat on lucide 0.469 and
# apps/app moved to @types/react 19.3, every 19.2 consumer of lucide saw two
# unrelated React type trees (TS2322 "Two different types with this name
# exist"). Every package now shares lucide 1.x and @types/react 19.3, but the
# optional peer stays so a future split cannot bring the error back: each
# lucide instance uses its consumer's @types/react.
packageExtensions:
  lucide-react@1:
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true

onlyBuiltDependencies:
  - "@swc/core"
  - blake3
  - cpu-features
  - duckdb
  - esbuild
  - inngest-cli
  - lefthook
  - protobufjs
  - sharp
  - ssh2
  - unrs-resolver

ignoredBuiltDependencies:
  - "@swc/core"

allowBuilds:
  # @parcel/watcher (pulled in by next-intl in apps/app) ships prebuilt
  # binaries as optional deps; its node-gyp fallback script is not needed.
  "@parcel/watcher": false
  "@swc/core": true
  blake3: true
  cpu-features: true
  duckdb: true
  esbuild: true
  inngest-cli: true
  lefthook: true
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  # First-party: our own CGP SDK, consumed the day it is published.
  - '@contextgraphprotocol/typescript-sdk@0.1.0'
