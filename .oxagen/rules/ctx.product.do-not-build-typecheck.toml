kind = "constraint"
statement = "Do not build, typecheck, or run all unit tests in the monorepo when working on a \nfeature or fixing a bug. Only run them when explicitly permissioned to do so. \nAlways be aware of memory availability, you will be more than likely operating in a \ncompute environment shared with at least 10 other agents. Running the full suite or \nbuilding the full package will force other agents to timeout. Let CI handle the \nautomation around checking types, running unit tests, and compiling all packages. \nOnly execute the tests you have changed in your run prior to pushing and creating a PR."
