record_hash = "sha256:6be9c8fe7a10746cd870741e8862e5d77b40a44de0586ef99feba6456cfbca4b"
kind = "rule"
statement = "A defect noticed while doing a task is fixed in that task's pull request. Two unrelated fixes in one pull request is fine. Name each extra fix in the description. File a GitHub issue only when the fix cannot ride the pull request because it needs a maintainer decision, a rig, a credential, or real spend, or because it is larger than the session, and only when fixing it would move stability, reliability, maintainability, innovation, efficiency, or performance. Apply only the triage label. One issue carries one full change as a definition of done. Do not file an open design question, a record of a choice already in effect, a measurement that cannot change a decision, a test for a path nothing reaches, tracker bookkeeping, or a follow-up the change has made moot. This rule is written for the period with zero customers. Once customers exist, a pull request goes back to carrying one change. A task with nothing deferred says so."
origin = "imported"
sharing_scope = "workspace"
status = "active"

