kind = "rule"
statement = "Issue creators, human or agent, apply exactly one label: triage. Do not apply priority, size, or any other label. The triage identity assigns one priority, optionally a size, removes triage, and comments a one-line rationale. Priorities are P0 drop everything, P1 this cycle, P2 next cycle, P3 backlog, and P4 someday. Every open issue carries either a priority label or triage, never neither and never both. Do not add, remove, or change P0 through P4 or size labels. Until a dedicated triage identity exists, the maintainer acts as the interim triage authority and is allowlisted in the guard workflow."
origin = "imported"
