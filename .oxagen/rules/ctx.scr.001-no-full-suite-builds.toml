[[record]]
lineage_id = "ctx.scr.001-no-full-suite-builds"
label = "Run only the tests a change touches"
record_id = "rec_scr_001_no_full_suite_builds_69899d168341"
record_hash = "sha256:c095851cdba239d0aa26cbc8da90611216c0a1a7f3275d74ba23df6693e4cde0"
kind = "constraint"
statement = "Compile and run only the tests relevant to the change: the touched crate, package, or module, plus direct dependents when an interface changed. The full suite is CI's job. Rust: cargo test -p <crate> or cargo nextest run -p <crate>. pnpm: pnpm --filter <package> test:unit <file>.test.ts, and do not put -- before the filename. A workspace package has no test script, so pnpm --filter <package> test runs nothing. Python: uv run pytest tests/test_x.py -q. Do not run a bare cargo test, cargo test --workspace, cargo test --all, a bare pnpm test, turbo run test:unit, a bare pytest, or make test. Reproduce a full suite locally only when debugging a CI-only failure, and say so in the session. Exceptions: release verification, an explicit maintainer request, or a stated reproduction of a CI-only failure."
origin = "imported"
sharing_scope = "workspace"
status = "active"

