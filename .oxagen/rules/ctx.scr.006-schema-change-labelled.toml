[[record]]
lineage_id = "ctx.scr.006-schema-change-labelled"
label = "Label every schema change"
record_id = "rec_scr_006_schema_change_labelled_4a1bc2e09ec7"
record_hash = "sha256:88a9e6cba17f3b1cae177d98483b77d6f880f46524b26a764df3ec678e754e10"
kind = "procedure"
statement = "A pull request that changes a schema carries the label migration-required, and the change is not deployed until the migration has been applied to production. A schema change is any edit that makes production's stored shape differ from the shape the branch assumes: a migration file, a schema definition a migration is generated from, or a store's declared constraints and indexes. Where a repository can read the label from the diff, the repository applies it. If it has not, add it. Do not remove the label to clean up the pull request. Where automation applies it, removing it puts it back. Where the repository's pipeline applies pending migrations before it deploys the code that assumes them, the label is the only thing the pull request adds: write no apply steps and apply nothing by hand. Where no pipeline applies them, sequence the apply against the merge: the migration reaches production before, or together with, the code that assumes it. If the migration cannot be applied yet, say so in the pull request and why. A change that touches a schema file without altering the stored shape may have the label removed with a note saying why the diff is inert. A repository with no persistent store has nothing to label."
origin = "imported"
sharing_scope = "workspace"
status = "active"

