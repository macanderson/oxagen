<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oxagen env-manager</title>
    <style>
      :root { color-scheme: dark; --bg:#0b0d10; --panel:#14171c; --line:#262b33; --muted:#8b949e; --ok:#2ea043; --warn:#d29922; --err:#f85149; --acc:#3b82f6; }
      * { box-sizing: border-box; }
      body { margin:0; font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:#e6edf3; }
      header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:5; }
      h1 { font-size:16px; margin:0; font-weight:650; }
      .sub { color:var(--muted); font-size:12px; }
      .spacer { flex:1; }
      button { font:inherit; background:var(--panel); color:#e6edf3; border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; }
      button:hover { border-color:#3a4150; }
      button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
      button.warn { background:#a16207; border-color:#a16207; color:#fff; }
      button:disabled { opacity:.5; cursor:not-allowed; }
      main { padding:16px 20px 80px; }
      table { width:100%; border-collapse:collapse; }
      th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
      th { color:var(--muted); font-weight:550; font-size:12px; position:sticky; top:57px; background:var(--bg); }
      .grp td { background:#10131a; color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
      .key { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:600; }
      .desc { color:var(--muted); font-size:12px; max-width:380px; }
      .chip { display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); margin:1px 3px 1px 0; color:var(--muted); }
      .src { font-size:11px; color:var(--muted); font-family:ui-monospace,monospace; }
      .cell .svc { display:inline-flex; gap:3px; align-items:center; font-size:11px; margin-right:6px; }
      .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
      .dot.on { background:var(--ok); } .dot.off { background:#3a4150; }
      .badge-secret { color:var(--warn); border-color:var(--warn); }
      .paste-row { display:flex; gap:6px; align-items:center; margin-top:5px; }
      .paste-row input { font:12px ui-monospace,monospace; background:#0d1117; border:1px solid var(--line); border-radius:6px; color:#e6edf3; padding:4px 8px; flex:1; min-width:0; }
      .paste-row input:focus { outline:none; border-color:var(--acc); }
      .paste-row button { font-size:11px; padding:4px 10px; white-space:nowrap; }
      #log { position:fixed; right:0; bottom:0; left:0; max-height:38vh; overflow:auto; background:#0d1117; border-top:1px solid var(--line); padding:10px 20px; font-family:ui-monospace,monospace; font-size:12px; display:none; }
      #log .ok{color:var(--ok)} #log .error{color:var(--err)} #log .manual{color:var(--warn)} #log .skipped{color:var(--muted)} #log .missing{color:var(--err)} #log .extra{color:var(--warn)}
      .note { background:#1c2128; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:14px; color:var(--muted); font-size:12px; }
    </style>
  </head>
  <body>
    <header>
      <div><h1>Oxagen env-manager</h1><div class="sub" id="tokstatus">loading…</div></div>
      <div class="spacer"></div>
      <button onclick="location.href='/secrets'">🔑 Secrets DB</button>
      <button onclick="refresh()">↻ Refresh state</button>
      <button class="warn" onclick="checkGaps('development')">Gaps dev</button>
      <button class="warn" onclick="checkGaps('preview')">Gaps preview</button>
      <button class="warn" onclick="checkGaps('production')">Gaps production</button>
      <button class="primary" onclick="deploy('development')">Deploy development</button>
      <button class="primary" onclick="deploy('preview')">Deploy preview</button>
      <button class="primary" onclick="deploy('production')">Deploy production</button>
    </header>
    <main>
      <div class="note" id="note"></div>
      <table id="grid"><thead><tr>
        <th>Variable</th><th>Source per env<br/>(dev · prev · prod)</th>
        <th>development</th><th>preview</th><th>production</th>
      </tr></thead><tbody id="rows"></tbody></table>
    </main>
    <div id="log"></div>

    <script>
      let DATA = null, STATE = {};
      const srcLabel = (s) => !s ? "—" : s.type === "static" ? "static" : s.type;

      // Everything rendered below is built with innerHTML, and some of it is
      // not ours: `detail` on a deploy result is verbatim Vercel API error text,
      // and registry descriptions are free-form prose. Escape at every boundary.
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
      // For a value that lands inside a JS string literal *within* an HTML
      // attribute: the HTML parser decodes entities before JS sees them, so
      // esc's `&#39;` would turn back into a quote and close the string early.
      const jsq = (s) => esc(String(s ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'"));
      const resultLine = (x) =>
        `<div class="${esc(x.status)}">[${esc(x.status)}] ${esc(x.key)} → ${esc(x.service)}/${esc(x.env)}` +
        `${x.detail ? "  — " + esc(x.detail) : ""}</div>`;

      async function load() {
        DATA = await (await fetch("/api/catalog")).json();
        document.getElementById("tokstatus").textContent =
          (DATA.hasToken ? "VERCEL_TOKEN set · " : "⚠ VERCEL_TOKEN missing · ") +
          Object.keys(DATA.projects).length + " projects";
        document.getElementById("note").innerHTML =
          "Each row deploys to the projects in its <b>services</b>. " +
          "<b>Deploy &lt;env&gt;</b> pushes <b>static</b> and <b>generate</b> vars automatically. " +
          "<b>manual</b> vars (secrets, API keys) use the paste input — type or paste the value, " +
          "then click <b>Push →</b> to fan it out to every dependent project in one shot. " +
          "<b>Gaps &lt;env&gt;</b> diffs required vars against live Vercel state. " +
          "Env changes take effect on the next deployment.";
        await refresh();
      }

      async function refresh() {
        try {
          const r = await fetch("/api/state");
          const j = await r.json();
          STATE = j.state || {};
        } catch (e) { STATE = {}; }
        render();
      }

      function svcDots(entry, env) {
        return entry.services.map((svc) => {
          const set = (STATE[svc]?.[entry.key] || []).includes(env);
          return `<span class="svc" title="${esc(svc)}"><span class="dot ${set ? "on" : "off"}"></span>${esc(svc)}</span>`;
        }).join("");
      }

      function pasteInput(entry, env) {
        const src = entry.sources[env];
        if (!src || src.type !== "manual") return "";
        const isSecret = entry.secret;
        const svcList = entry.services.join(", ");
        const inputId = `inp_${entry.key}_${env}`;
        return `<div class="paste-row">
          <input id="${esc(inputId)}" type="${isSecret ? "password" : "text"}" placeholder="paste value…" autocomplete="off" />
          <button onclick="pushValue('${jsq(entry.key)}','${jsq(env)}','${jsq(inputId)}')" title="Push to: ${esc(svcList)}">Push → ${entry.services.length}</button>
        </div>`;
      }

      function render() {
        const rows = document.getElementById("rows");
        rows.innerHTML = "";
        let group = null;
        for (const e of DATA.catalog) {
          if (e.group !== group) {
            group = e.group;
            rows.insertAdjacentHTML("beforeend", `<tr class="grp"><td colspan="5">${esc(group)}</td></tr>`);
          }
          const secret = e.secret ? `<span class="chip badge-secret">secret</span>` : "";
          rows.insertAdjacentHTML("beforeend", `<tr>
            <td><div class="key">${esc(e.key)}</div>${secret}<div class="desc">${esc(e.description)}</div>
                <div>${e.services.map(s=>`<span class="chip">${esc(s)}</span>`).join("")}</div></td>
            <td class="src">${srcLabel(e.sources.development)}<br/>${srcLabel(e.sources.preview)}<br/>${srcLabel(e.sources.production)}</td>
            <td class="cell">${e.sources.development ? svcDots(e,"development") + pasteInput(e,"development") : '<span class="src">—</span>'}</td>
            <td class="cell">${e.sources.preview ? svcDots(e,"preview") + pasteInput(e,"preview") : '<span class="src">—</span>'}</td>
            <td class="cell">${e.sources.production ? svcDots(e,"production") + pasteInput(e,"production") : '<span class="src">—</span>'}</td>
          </tr>`);
        }
      }

      async function pushValue(key, env, inputId) {
        const input = document.getElementById(inputId);
        const value = input?.value?.trim();
        if (!value) { alert("Enter a value first."); return; }
        const log = document.getElementById("log");
        log.style.display = "block";
        log.innerHTML = `<div>pushing ${esc(key)} → ${esc(env)}…</div>`;
        try {
          const r = await fetch("/api/set", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ key, env, value })
          });
          const j = await r.json();
          if (j.error) { log.innerHTML = `<div class="error">${esc(j.error)}</div>`; return; }
          const lines = j.results.map(resultLine);
          const ok = j.results.filter((x) => x.status === "ok").length;
          log.innerHTML = `<div><b>${esc(key)}/${esc(env)}: ${ok}/${j.results.length} ok</b> — re-deploy the affected projects to apply.</div>` + lines.join("");
          // Clear input after push — never display the value back
          if (input) input.value = "";
          await refresh();
        } catch (e) { log.innerHTML = `<div class="error">${esc(e)}</div>`; }
      }

      async function checkGaps(env) {
        const log = document.getElementById("log");
        log.style.display = "block";
        log.innerHTML = `<div>checking gaps for ${esc(env)}…</div>`;
        try {
          const r = await fetch(`/api/gaps?env=${encodeURIComponent(env)}`);
          const j = await r.json();
          if (j.error) { log.innerHTML = `<div class="error">${esc(j.error)}</div>`; return; }
          const missing = j.missing || [];
          const extra = j.extra || [];
          if (missing.length === 0 && extra.length === 0) {
            log.innerHTML = `<div class="ok">✓ No gaps found for ${esc(env)}.</div>`;
            return;
          }
          const lines = [
            `<div><b>Gaps for ${esc(env)}: ${missing.length} missing, ${extra.length} unregistered</b></div>`,
            ...missing.map(({service, key}) => `<div class="missing">✗ MISSING ${esc(key)} on ${esc(service)}</div>`),
            ...extra.map(({service, key}) => `<div class="extra">? UNREGISTERED ${esc(key)} on ${esc(service)} (not in registry)</div>`),
          ];
          log.innerHTML = lines.join("");
        } catch (e) { log.innerHTML = `<div class="error">${esc(e)}</div>`; }
      }

      async function deploy(env) {
        // `generate` vars are MINTED FRESH on every run and overwrite whatever is
        // live — for BETTER_AUTH_SECRET that signs every session out. Say so.
        if (!confirm(
          `Deploy ${env.toUpperCase()} env vars to Vercel (static + generated only)?\n\n` +
          `WARNING: every "generate" var (e.g. BETTER_AUTH_SECRET) is minted fresh and ` +
          `REPLACES the value currently live on ${env.toUpperCase()}. Existing sessions ` +
          `signed with the old secret stop validating.`,
        )) return;
        const log = document.getElementById("log");
        log.style.display = "block";
        log.innerHTML = `<div>deploying ${esc(env)}…</div>`;
        try {
          const r = await fetch("/api/deploy", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ env }) });
          const j = await r.json();
          if (j.error) { log.innerHTML = `<div class="error">${esc(j.error)}</div>`; return; }
          const lines = j.results.map(resultLine);
          const ok = j.results.filter((x) => x.status === "ok").length;
          log.innerHTML = `<div><b>${esc(env)}: ${ok}/${j.results.length} ok</b> — re-deploy the affected Vercel projects to apply.</div>` + lines.join("");
          await refresh();
        } catch (e) { log.innerHTML = `<div class="error">${esc(e)}</div>`; }
      }
      load();
    </script>
  </body>
</html>
