# The install and uninstall rig for the desktop app and Tacho.
#
# Two halves, both against a scratch HOME, never the runner's own home
# directory:
#   - packages/tacho/src/cli/install-rig.test.ts: enroll, enroll again,
#     unenroll, unenroll again, the tree compared byte for byte, plus the
#     failure variants (malformed settings, a read-only file, a symlinked
#     settings file, an offline revoke, the process dying at each step). It
#     drives a fake launchctl, systemctl and schtasks, and builds POSIX paths
#     for every platform branch, so it runs on the Linux and macOS legs only.
#   - apps/desktop/src-tauri (cargo test): Link into PATH and Uninstall over
#     injected roots, the same comparison. On the Windows leg it also runs
#     the user PATH scripts against the runner's real HKCU\Environment and
#     the `.cmd` shim ownership test (#4318).
# It also runs cargo fmt --check and clippy on every OS, which no other
# workflow does: desktop.yml only builds on a tag or a dispatch.
name: Desktop install rig

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/tacho/**"
      - ".github/workflows/desktop-rig.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/tacho/**"

concurrency:
  group: desktop-rig-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rig:
    name: Install, reinstall, uninstall, compare (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/pnpm-install

      - name: Tacho rig (enroll and unenroll against a snapshot)
        if: runner.os != 'Windows'
        run: pnpm --filter @oxagen/tacho exec vitest run src/cli/install-rig.test.ts src/host/install-hardening.test.ts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: WebKit, for the Tauri crate to compile
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      # tauri-build refuses to compile without the two externalBin files and
      # a frontendDist. The tests never run them, so stubs are enough.
      - name: Stub sidecars and frontend
        run: node apps/desktop/scripts/rig-stubs.mjs

      - name: cargo fmt
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Desktop rig (link and uninstall against a snapshot)
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib
