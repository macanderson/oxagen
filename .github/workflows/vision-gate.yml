# Vision Gate — LLM drift check against docs/VISION.md.
#
# Judges every PR diff against the Stripe-for-agents north star and posts an
# advisory verdict (advances / neutral / drifts) as a sticky PR comment + step
# summary. Never blocks merge (the script exits 0 unless VISION_GATE_STRICT=1);
# fork PRs no-op safely because secrets are unavailable there.
name: Vision Gate

on:
  # No `synchronize` (#4918). The gate called a model on every push: 2,403
  # runs on 474 pull requests in the week of 2026-09-23. A pull request's
  # direction is set when it opens and when it is marked ready, and the
  # verdict is advisory, so it is judged then.
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vision-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vision-gate:
    # ubuntu-slim (one vCPU, $0.002 a minute): a checkout and one model call.
    runs-on: ${{ vars.CI_RUNNERS == 'aws' && format('oxagen-small-{0}', vars.CI_RUNNER_ARCH || 'x64') || 'ubuntu-slim' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          # The gate is dependency-free (bare `node` run, no pnpm install);
          # setup-node otherwise auto-detects pnpm from `packageManager` and
          # fails because the pnpm binary is never installed in this job.
          package-manager-cache: false

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --no-tags

      - name: Judge diff against docs/VISION.md
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VISION_GATE_BASE: origin/${{ github.base_ref }}
        run: node tools/scripts/vision-gate.mjs
