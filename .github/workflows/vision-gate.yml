# Vision Gate — LLM drift check against docs/VISION.md.
#
# Judges every PR diff against the Stripe-for-agents north star and posts an
# advisory verdict (advances / neutral / drifts) as a sticky PR comment + step
# summary. Never blocks merge (the script exits 0 unless VISION_GATE_STRICT=1);
# fork PRs no-op safely because secrets are unavailable there.
#
# It also asks a doc-drift question of the same diff (#3202): does a doc or
# runbook in the diff, operator guidance under infra/** included, claim a
# control is on while the code leaves it off? Each finding is a warning
# annotation and a section of the comment. It never blocks, even in strict
# mode.
name: Vision Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vision-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vision-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          # The gate is dependency-free (bare `node` run, no pnpm install);
          # setup-node otherwise auto-detects pnpm from `packageManager` and
          # fails because the pnpm binary is never installed in this job.
          package-manager-cache: false

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --no-tags

      - name: Judge diff against docs/VISION.md, and ask the doc-drift question
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VISION_GATE_BASE: origin/${{ github.base_ref }}
        run: node tools/scripts/vision-gate.mjs
