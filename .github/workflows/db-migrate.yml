# db-migrate.yml — manual, reusable Postgres migration runner.
#
# Why this exists: pipeline.yml used to carry a `migrate` job that applied the
# committed Atlas migrations to prod on every push to main. That job was retired
# in #1341, having been unable to act on any event since #1280, and prod drifts
# behind the migration directory until someone runs a migration by hand
# ("column ... does not exist" 500s — most recently #1275, 2026-09-09).
#
# This workflow is NOT that working path for `target: production` today, and
# the "Guard — the database is reachable from this runner" step below exists
# because it is not: on account 916294258235, Aurora's security group admits
# 5432 only from the app node, so a hosted runner always fails that guard
# (oxagen#2652). The path that actually reaches production Postgres is
# `infra/tools/run-db-migrations.sh`, run from the app node itself — see that
# script's header, and #1275's most recent comment for it being used that way
# against production on 2026-09-09. Whether `target: preview` reaches its
# database from a hosted runner is not established here either way; the guard
# above checks TCP reachability for both targets rather than assuming.
#
# pipeline.yml still runs `atlas migrate apply --env ci` in three jobs, but each
# targets an ephemeral Postgres service container in CI, never production.
# `PRODUCTION_DATABASE_URL` is read here and in no other workflow.
#
# Safe by default: a run with apply=false only prints `atlas migrate status`
# (the pending list) and changes nothing. Re-run with apply=true to apply.
# Always read the status output first — if it shows migrations you did not
# expect (e.g. the entire history pending, which means Atlas's revision table
# is empty and it would try to re-create existing objects), STOP and do not
# apply.
name: DB Migrate (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Database to migrate
        type: choice
        options:
          - production
          - preview
        default: production
      apply:
        description: "Apply migrations? Leave false for a dry-run status-only check."
        type: boolean
        default: false

# Never let two migration runs against the same target overlap.
concurrency:
  group: db-migrate-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Uses the GitHub Environment of the same name if it exists, so its secrets
    # resolve here; repo-level secrets still resolve when no environment secret
    # shadows them.
    #
    # It gates nothing. This comment used to say required reviewers stood in
    # front of a production apply. They do not: the `production` environment
    # carries one protection rule and it is a branch policy
    # (`gh api repos/macanderson/oxagen/environments`), so a dispatch applies
    # with no second person involved. Naming a reviewer that does not exist is
    # worse than naming none, because it is the reason someone stops looking.
    environment: ${{ github.event.inputs.target }}
    env:
      # Mirror pipeline.yml: pick the prod or preview connection string. Atlas's
      # `ci` env reads getenv("DATABASE_URL").
      DATABASE_URL: ${{ github.event.inputs.target == 'production' && secrets.PRODUCTION_DATABASE_URL || secrets.PREVIEW_DATABASE_URL }}
    defaults:
      run:
        working-directory: packages/database
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Atlas
        uses: ariga/setup-atlas@v0
        with:
          version: v1.2.2

      - name: Guard — DATABASE_URL is set
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret for target '${{ github.event.inputs.target }}' is empty. Check the PRODUCTION_DATABASE_URL / PREVIEW_DATABASE_URL secret."
            exit 1
          fi
          echo "Target: ${{ github.event.inputs.target }} — DATABASE_URL is set (value masked)."

      # A hosted runner is outside the VPC. On the current account
      # (916294258235) Aurora sits in private subnets and its only security
      # group admits 5432 from the APP NODE's security group and nothing else
      # (infra/stacks-new/oxagen/data-services.tf's aws_security_group.aurora).
      # So a production dispatch from here cannot connect.
      #
      # Without this, that arrives as Atlas hanging until its own TCP timeout
      # and then a generic dial error — a confusing failure that looks like a
      # broken migration rather than a workflow that cannot reach its database.
      # Ten seconds and a named message instead (oxagen#2652).
      - name: Guard — the database is reachable from this runner
        run: |
          set -uo pipefail
          host=$(printf '%s' "$DATABASE_URL" | sed -E 's|^[^:]+://([^@]*@)?([^:/?]+).*|\2|')
          port=$(printf '%s' "$DATABASE_URL" | sed -nE 's|^[^:]+://([^@]*@)?[^:/?]+:([0-9]+).*|\2|p')
          port=${port:-5432}
          echo "Checking TCP reachability of the target host on port $port (host name not printed)."
          if timeout 10 bash -c "exec 3<>/dev/tcp/$host/$port" 2>/dev/null; then
            echo "Reachable."
            exit 0
          fi
          echo "::error::This runner cannot open a TCP connection to the target database on port $port."
          echo "::error::On account 916294258235, Aurora admits 5432 only from the app node's security group, so a hosted runner is refused by design — see infra/stacks-new/oxagen/data-services.tf and oxagen#2652."
          echo "::error::Applying migrations to that cluster needs a path from inside the VPC. This workflow is not one."
          exit 1

      - name: Validate migration directory (checksums)
        run: atlas migrate validate --dir "file://atlas/migrations"

      - name: Status — pending migrations (dry run, changes nothing)
        run: atlas migrate status --env ci

      - name: Apply migrations
        if: ${{ github.event.inputs.apply == 'true' }}
        run: atlas migrate apply --env ci

      - name: Status — after apply (should show no pending)
        if: ${{ github.event.inputs.apply == 'true' }}
        run: atlas migrate status --env ci
