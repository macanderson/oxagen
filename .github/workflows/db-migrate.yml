# db-migrate.yml — manual Postgres migration runner.
#
# Why this exists: pipeline.yml used to carry a `migrate` job that applied the
# committed Atlas migrations to prod on every push to main. That job was retired
# in #1341, having been unable to act on any event since #1280, and prod drifts
# behind the migration directory until someone runs a migration by hand
# ("column ... does not exist" 500s — most recently #1275, 2026-09-09).
#
# Two targets, two jobs, because they reach their databases differently.
#
# `target: production` runs `infra/tools/run-db-migrations.sh`, the one path
# that reaches production Postgres. On account 916294258235, Aurora's security
# group admits 5432 only from the app node, so nothing on a hosted runner can
# connect to it (oxagen#2652). The script does not try: it uploads the
# migration directory to the deploy bucket and sends `atlas migrate status`
# (and, with apply, the apply and the platform seed) to the app node over SSM.
# The job assumes the deploy role over OIDC to do that, the same role and the
# same script `migration-gate` in pipeline.yml already uses read-only on every
# push to main. The same script run from a laptop with AWS credentials, on a
# checkout of origin/main, is the other way to apply, and README.md's
# Deployment section describes both.
#
# `target: preview` keeps the direct path: Atlas on the runner, connecting to
# `PREVIEW_DATABASE_URL`. Whether a hosted runner reaches that database is not
# established here either way, so the job checks TCP reachability before it
# runs Atlas rather than assuming.
#
# pipeline.yml still runs `atlas migrate apply --env ci` in three jobs, but each
# targets an ephemeral Postgres service container in CI, never production.
#
# There is deliberately no Atlas Cloud workflow. The atlasgo.cloud onboarding
# wizard generates one (`.github/workflows/ci-atlas.yaml`, added in #3646 and
# removed in #3648) that cannot work here and should not be re-added as-is:
# it selects `--env local`, whose `dev` URL is a Postgres on the developer's
# own machine at localhost:5433 and whose `src` shells out to `drizzle-kit
# export`, so both steps fail on a hosted runner. Its `migrate/apply` step
# also writes to a real database on every push to main, against a `DB_URL`
# secret this repo does not define. Applying to production stays manual, as
# described above. Use `--env ci` in any workflow that talks to Atlas.
#
# Safe by default: a run with apply=false only prints `atlas migrate status`
# (the pending list) and changes nothing. Re-run with apply=true to apply.
# Always read the status output first — if it shows migrations you did not
# expect (e.g. the entire history pending, which means Atlas's revision table
# is empty and it would try to re-create existing objects), STOP and do not
# apply.
name: DB Migrate (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Database to migrate
        type: choice
        options:
          - production
          - preview
        default: production
      apply:
        description: "Apply migrations? Leave false for a dry-run status-only check."
        type: boolean
        default: false

# Never let two migration runs against the same target overlap.
concurrency:
  group: db-migrate-${{ github.event.inputs.target }}
  cancel-in-progress: false

# `id-token: write` is what lets the production job assume the deploy role
# over OIDC. The preview job reads PREVIEW_DATABASE_URL and needs nothing but
# the code. Stated rather than inherited from the repository default.
permissions:
  contents: read
  id-token: write

jobs:
  production:
    if: github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required: the deploy role's trust policy accepts only an OIDC `sub`
    # carrying `environment:production` (infra/stacks-new/ci-deploy/main.tf's
    # deploy_subjects). It gates nothing else. The `production` environment
    # carries one protection rule and it is a branch policy
    # (`gh api repos/macanderson/oxagen/environments`), so a dispatch applies
    # with no second person involved. Naming a reviewer that does not exist is
    # worse than naming none, because it is the reason someone stops looking.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The apply bundles the platform seed from the workspace with esbuild
      # (tools/scripts/build-platform-seed.mjs) before uploading it, so it
      # needs the workspace installed. The status-only run needs neither.
      - uses: actions/setup-node@v4
        if: ${{ github.event.inputs.apply == 'true' }}
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4
        if: ${{ github.event.inputs.apply == 'true' }}

      - name: Install the workspace
        if: ${{ github.event.inputs.apply == 'true' }}
        run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::916294258235:role/gha-deploy-oxagen-platform
          aws-region: us-east-1

      # The script prints the pending list and changes nothing without
      # `--apply`. It exits 0 on success, 1 on a failed migration, and 2 when
      # the SSM command is still running or its status could not be read; a 2
      # is not a failure to re-run, and the output says so.
      - name: Status — pending migrations (dry run, changes nothing)
        if: ${{ github.event.inputs.apply != 'true' }}
        run: bash infra/tools/run-db-migrations.sh packages/database

      - name: Apply migrations and the platform seed
        if: ${{ github.event.inputs.apply == 'true' }}
        run: bash infra/tools/run-db-migrations.sh packages/database --apply

  preview:
    if: github.event.inputs.target == 'preview'
    runs-on: ubuntu-latest
    # Uses the GitHub Environment of the same name if it exists, so its secrets
    # resolve here; repo-level secrets still resolve when no environment secret
    # shadows them. It gates nothing.
    environment: preview
    # DATABASE_URL is deliberately NOT set at job level. The step below is its
    # one writer, via $GITHUB_ENV, because that step has to rewrite the value
    # and a job-level `env:` of the same name would leave which one wins to
    # runner precedence — an implementation detail carrying the whole point of
    # the step. One writer, no precedence question. Atlas's `ci` env reads
    # getenv("DATABASE_URL").
    defaults:
      run:
        working-directory: packages/database
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Atlas
        uses: ariga/setup-atlas@v0
        with:
          version: v1.2.2

      - name: Guard — DATABASE_URL is set
        env:
          # Scoped to this step; the composed value below is what every later
          # step sees.
          SECRET_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: |
          if [ -z "${SECRET_URL:-}" ]; then
            echo "::error::PREVIEW_DATABASE_URL is empty. Set the secret before dispatching a preview run."
            exit 1
          fi
          echo "DATABASE_URL=$SECRET_URL" >> "$GITHUB_ENV"
          echo "Target: preview — DATABASE_URL is set (value masked)."

      # Without this the directory cannot be applied by anything that is not a
      # Postgres superuser, which every managed cluster is not (#1368). The
      # seed in 20260614000000 inserts mcp.registries' global row with
      # org_id = NULL, and the tenant_isolation policy in force at that point
      # in history has an `org_id IS NULL` arm in USING and none in WITH CHECK,
      # so the insert is refused 42501. A forward migration cannot reach back
      # ninety files to fix the policy the seed runs under, and the historical
      # file's hash is in atlas.sum, so the connection is the only place the
      # fix can live. `app.rls_bypass` is a GUC the policies read rather than a
      # privilege — the role keeps NOSUPERUSER NOBYPASSRLS. See
      # infra/tools/run-db-migrations.sh for the long version.
      #
      # The secret may or may not already carry a query string, so the
      # separator is chosen rather than assumed. The composed value is masked
      # before it is exported: GitHub redacts the secret substring inside a
      # longer string, but the mask is stated here rather than relied upon.
      - name: Carry the RLS bypass on the migration connection
        run: |
          set -euo pipefail

          # Already carrying it turned ON is fine and is not worth a second
          # copy. Carrying it turned OFF is not the same thing at all, and the
          # loose match used to print the reassuring "left alone" before the
          # apply failed at file 14 anyway.
          case "$DATABASE_URL" in
            *app.rls_bypass%3Don*|*app.rls_bypass=on*)
              echo "The secret already turns app.rls_bypass on. Left alone."
              exit 0 ;;
            *app.rls_bypass*)
              echo "::error::The connection string sets app.rls_bypass to something other than 'on'."
              echo "::error::The seed in 20260614000000 is refused unless it is on — see ADR-054."
              exit 1 ;;
          esac

          # A secret carrying some OTHER `options=` is the one case this must
          # not paper over. libpq takes a single `options` parameter, so a
          # second one does not merge — one of the two silently wins, and which
          # is not something to find out against a database. Stop and say so.
          case "$DATABASE_URL" in
            *options=*)
              echo "::error::The connection string already sets an 'options' parameter."
              echo "::error::libpq takes only one, so appending a second would silently drop either it or the RLS bypass."
              echo "::error::Add -c app.rls_bypass=on to the existing options in the secret instead."
              exit 1 ;;
          esac

          case "$DATABASE_URL" in
            *\?*) sep='&' ;;
            *)    sep='?' ;;
          esac
          composed="${DATABASE_URL}${sep}options=-c%20app.rls_bypass%3Don"
          echo "::add-mask::$composed"
          echo "DATABASE_URL=$composed" >> "$GITHUB_ENV"
          echo "Appended options=-c app.rls_bypass=on to the connection (separator '$sep')."

      # A hosted runner is outside every VPC. Whether the preview database
      # admits one is not established here, and a database that does not
      # arrives as Atlas hanging until its own TCP timeout and then a generic
      # dial error — a failure that looks like a broken migration rather than a
      # workflow that cannot reach its database. Ten seconds and a named
      # message instead (oxagen#2652). Production never runs this path: its
      # job above sends Atlas to the app node over SSM.
      - name: Guard — the database is reachable from this runner
        run: |
          set -uo pipefail
          host=$(printf '%s' "$DATABASE_URL" | sed -E 's|^[^:]+://([^@]*@)?([^:/?]+).*|\2|')
          port=$(printf '%s' "$DATABASE_URL" | sed -nE 's|^[^:]+://([^@]*@)?[^:/?]+:([0-9]+).*|\2|p')
          port=${port:-5432}
          echo "Checking TCP reachability of the target host on port $port (host name not printed)."
          if timeout 10 bash -c "exec 3<>/dev/tcp/$host/$port" 2>/dev/null; then
            echo "Reachable."
            exit 0
          fi
          echo "::error::This runner cannot open a TCP connection to the preview database on port $port."
          echo "::error::Applying migrations to it needs a path from inside its network, and a hosted runner is not one (oxagen#2652)."
          exit 1

      - name: Validate migration directory (checksums)
        run: atlas migrate validate --dir "file://atlas/migrations"

      - name: Status — pending migrations (dry run, changes nothing)
        run: atlas migrate status --env ci

      - name: Apply migrations
        if: ${{ github.event.inputs.apply == 'true' }}
        run: atlas migrate apply --env ci

      - name: Status — after apply (should show no pending)
        if: ${{ github.event.inputs.apply == 'true' }}
        run: atlas migrate status --env ci
