# Triage separation of duties (SCR-005): issue creators get exactly one
# label — `triage`. Priority labels (`P0`–`P4`) come only from the triage identity.
# Invariant: every open issue carries a P-label or `triage`, never neither,
# never both.
name: triage-guard
on:
  issues:
    types: [opened, labeled]
permissions:
  issues: write
jobs:
  guard:
    # Only an open or a P-label can break the invariant. The script ignores
    # every other label, and a job this `if` skips takes no runner.
    if: >-
      github.event.action == 'opened' ||
      contains(fromJSON('["P0","P1","P2","P3","P4"]'), github.event.label.name)
    # ubuntu-slim (one vCPU, $0.002 a minute): a few API calls, done in
    # seconds (#4918).
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          # Logins allowed to set P-labels. `macanderson` is the interim
          # triage authority until the dedicated triage-agent identity
          # stands up (SCR-005 §Exceptions) — remove it then.
          TRIAGE_LOGINS: triage-bot macanderson
        with:
          script: |
            const issue = context.payload.issue;
            const P = /^P[0-4]$/;
            const allowed = process.env.TRIAGE_LOGINS.split(/\s+/);
            const names = issue.labels.map(l => (typeof l === 'string' ? l : l.name));
            // deployment-failure.yml files P0 issues when main goes red or a
            // deploy fails (Mac, 2026-09-23). That P0 is a standing decision
            // for this one class of issue, so CI may set it there and nowhere else.
            const ciIncident = context.payload.sender.login === 'github-actions[bot]'
              && names.includes('deployment-failure');
            const trusted = allowed.includes(context.payload.sender.login) || ciIncident;
            const rm = (name) => github.rest.issues.removeLabel({
              ...context.repo, issue_number: issue.number, name }).catch(() => {});
            const add = (labels) => github.rest.issues.addLabels({
              ...context.repo, issue_number: issue.number, labels });
            const requeue = () => github.rest.issues.createComment({
              ...context.repo, issue_number: issue.number,
              body: 'Priority labels are assigned only by the triage agent (SCR-005). Re-queued as `triage`.' });
            if (context.payload.action === 'opened') {
              // A creation-time P-label is not a queued state unless the
              // opener is the triage identity: strip it, then queue.
              const pAtOpen = names.filter(n => P.test(n));
              if (!trusted && pAtOpen.length) {
                for (const n of pAtOpen) await rm(n);
                if (!names.includes('triage')) await add(['triage']);
                await requeue();
              } else if (!names.includes('triage') && !pAtOpen.length) {
                await add(['triage']);
              }
            }
            if (context.payload.action === 'labeled' && P.test(context.payload.label.name)) {
              if (!trusted) {
                await rm(context.payload.label.name);
                if (!names.includes('triage')) await add(['triage']);
                await requeue();
              } else if (names.includes('triage')) {
                // The triage identity replaced the queue label with a
                // priority: never both (SCR-005 invariant).
                await rm('triage');
              }
            }
