# Can the engine binary load in the image the worker ships it to?
#
# `pipeline.yml` asserts the same thing for free, right after it builds the
# binary — but that job only runs on a push to `main`, so the answer arrives
# after the merge that could have broken it. This workflow asks the question on
# the pull request instead, which costs a build.
#
# It is worth a build because of what the three inputs are: the runner that
# compiles the binary, the image that runs it, and the stella version pinned
# between them all live in different files, and until #2685 nothing tied them
# together. Any of the three can move on its own.
#
# Deliberately the same runner label as `pipeline.yml`'s `deploy-node` job. The
# point is to reproduce that build environment's glibc, so if that label ever
# changes, this one has to change with it or the check is measuring the wrong
# machine.
name: stella-serve glibc

on:
  pull_request:
    paths:
      - ".github/workflows/pipeline.yml"
      - ".github/workflows/stella-serve-glibc.yml"
      - "tools/scripts/package-for-node.sh"
      - "tools/scripts/check-glibc-parity.sh"
      - "packages/stella-engine-client/sidecar.config.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stella-serve-glibc-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  glibc-parity:
    name: stella-serve loads in the worker image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Byte-for-byte the resolution `pipeline.yml` uses, so the binary under
      # test is the binary that ships.
      - name: Build stella-serve at the pinned version
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.stellaVersion' packages/stella-engine-client/sidecar.config.json)"
          echo "stella pin: v${VERSION}"
          git clone --depth 1 --branch "v${VERSION}" \
            https://github.com/macanderson/stella.git "$RUNNER_TEMP/stella-src"
          cargo build --release -p stella-serve --bin stella-serve \
            --manifest-path "$RUNNER_TEMP/stella-src/Cargo.toml"

      - name: Record what the builder and the image each carry
        run: |
          set -euo pipefail
          echo "builder glibc: $(ldd --version | head -1)"
          echo "runner:        $(uname -m)"

      - name: The binary's glibc floor is no higher than the image's ceiling
        run: |
          tools/scripts/check-glibc-parity.sh \
            "$RUNNER_TEMP/stella-src/target/release/stella-serve"

      # The assertion above is arithmetic on version strings. This runs the
      # binary in the real image, which is the thing the arithmetic is a proxy
      # for — and is the check issue #2586 asks for, on the artifact rather
      # than on the node.
      - name: And it actually runs there
        run: |
          set -euo pipefail
          IMAGE="$(sed -n 's/^[[:space:]]*WRITE_MANIFEST_IMAGE="\([^"]*\)".*/\1/p' \
            tools/scripts/package-for-node.sh | head -1)"
          echo "running stella-serve --version inside ${IMAGE}"
          docker run --rm \
            -v "$RUNNER_TEMP/stella-src/target/release/stella-serve:/stella-serve:ro" \
            --entrypoint /stella-serve "$IMAGE" --version
