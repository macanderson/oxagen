name: ci-image

# Builds and publishes the CI toolchain images (see .github/docker/ci/Dockerfile)
# to ECR Public, for amd64 and arm64, and copies the service images CI starts.
# CI jobs run inside these images instead of re-installing Node, pnpm, Atlas,
# postgresql-client, and Playwright Chromium on every job (ADR-246).
#
# ECR Public serves anonymous pulls to GitHub-hosted runners with no
# registry credentials, and none of it bills through GitHub. The
# images were public GHCR packages under the `macanderson` user, which this
# repository cannot push to, so their `:latest` stopped moving when the
# repository changed owners.
#
# Each architecture builds natively on its own runner, pushes a staging tag,
# and the `publish` job joins the two into one multi-architecture `:latest`
# and `:sha-<commit>`.
#
# Rebuild triggers:
#   - Dockerfile / this workflow / the service image list changes (push to main)
#   - .node-version (Node pin), root package.json (packageManager pnpm pin),
#     apps/app/package.json (@playwright/test pin), or pnpm-lock.yaml changes
#   - daily at 05:00 UTC, so OS patches reach the images the same day
#   - manual dispatch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches: [main]
    paths:
      - ".github/docker/ci/**"
      - ".github/workflows/ci-image.yml"
      - "infra/stacks-new/ci-runners/service-images.json"
      - ".node-version"
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/app/package.json"

permissions:
  contents: read
  id-token: write # to assume gha-ci-image

concurrency:
  group: ci-image
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ROLE: arn:aws:iam::916294258235:role/gha-ci-image

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Resolve toolchain versions from repo pins
        id: versions
        run: |
          NODE="$(tr -d "[:space:]" < .node-version)"
          PNPM="$(jq -r '.packageManager | split("@")[1]' package.json)"
          PLAYWRIGHT="$(jq -r '.devDependencies["@playwright/test"] // .dependencies["@playwright/test"]' apps/app/package.json | sed 's/^[\^~]//')"
          ATLAS="$(grep -m1 'ATLAS_VERSION:' .github/workflows/pipeline.yml | sed -E 's/.*"(v[0-9.]+)".*/\1/')"
          echo "node=$NODE" >> "$GITHUB_OUTPUT"
          echo "pnpm=$PNPM" >> "$GITHUB_OUTPUT"
          echo "playwright=$PLAYWRIGHT" >> "$GITHUB_OUTPUT"
          echo "atlas=$ATLAS" >> "$GITHUB_OUTPUT"
          echo "Resolved node=$NODE pnpm=$PNPM playwright=$PLAYWRIGHT atlas=$ATLAS"

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to ECR Public
        id: registry
        run: |
          set -euo pipefail
          alias=$(aws ecr-public describe-registries --region us-east-1 --query 'registries[0].aliases[0].name' --output text)
          echo "registry=public.ecr.aws/$alias" >> "$GITHUB_OUTPUT"
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push base image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .github/docker/ci
          target: base
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ steps.registry.outputs.registry }}/oxagen-ci-base:build-${{ matrix.arch }}
          build-args: |
            NODE_VERSION=${{ steps.versions.outputs.node }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
            ATLAS_VERSION=${{ steps.versions.outputs.atlas }}

      - name: Build and push e2e image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .github/docker/ci
          target: e2e
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ steps.registry.outputs.registry }}/oxagen-ci-e2e:build-${{ matrix.arch }}
          build-args: |
            NODE_VERSION=${{ steps.versions.outputs.node }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
            ATLAS_VERSION=${{ steps.versions.outputs.atlas }}
            PLAYWRIGHT_VERSION=${{ steps.versions.outputs.playwright }}

      - name: Smoke-test the images
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run --rm "$REGISTRY/oxagen-ci-base:build-$ARCH" \
            sh -c 'node --version && pnpm --version && atlas version && psql --version && git --version'
          docker run --rm "$REGISTRY/oxagen-ci-e2e:build-$ARCH" \
            sh -c 'ls "$PLAYWRIGHT_BROWSERS_PATH" | grep -q chromium'

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to ECR Public
        id: registry
        run: |
          set -euo pipefail
          alias=$(aws ecr-public describe-registries --region us-east-1 --query 'registries[0].aliases[0].name' --output text)
          echo "registry=public.ecr.aws/$alias" >> "$GITHUB_OUTPUT"
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Join both architectures under one tag
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for image in oxagen-ci-base oxagen-ci-e2e; do
            docker buildx imagetools create \
              --tag "$REGISTRY/$image:latest" \
              --tag "$REGISTRY/$image:sha-$SHA" \
              "$REGISTRY/$image:build-amd64" \
              "$REGISTRY/$image:build-arm64"
            docker buildx imagetools inspect "$REGISTRY/$image:latest"
          done

      # Service containers come from our registry rather than Docker Hub, whose
      # anonymous pull limit applies per address and AWS addresses are shared.
      # imagetools copies every architecture of the source tag.
      - name: Copy the service images
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key) \(.value)"' infra/stacks-new/ci-runners/service-images.json |
            while read -r repo source; do
              tag="${source##*:}"
              docker buildx imagetools create --tag "$REGISTRY/$repo:$tag" "$source"
            done
