name: ci-image

# Builds and publishes the CI toolchain images (see .github/docker/ci/Dockerfile).
# CI jobs run inside these images instead of re-installing Node, pnpm, Atlas,
# postgresql-client, and Playwright Chromium on every job.
#
# Rebuild triggers:
#   - Dockerfile / this workflow changes (push to main)
#   - .node-version (Node pin), root package.json (packageManager pnpm pin)
#     or apps/app/package.json (@playwright/test pin) changes
#   - weekly cron, so OS and security patches land
#   - manual dispatch (also used to bootstrap the image from a branch before
#     the first main merge)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/docker/ci/**"
      - ".github/workflows/ci-image.yml"
      - ".node-version"
      - "package.json"
      - "apps/app/package.json"

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The image must be built with the exact toolchain versions the repo
      # pins, so read them from the repo instead of hard-coding them here.
      # ATLAS_VERSION intentionally mirrors the env pin in pipeline.yml.
      - name: Resolve toolchain versions from repo pins
        id: versions
        run: |
          NODE="$(tr -d "[:space:]" < .node-version)"
          PNPM="$(jq -r '.packageManager | split("@")[1]' package.json)"
          PLAYWRIGHT="$(jq -r '.devDependencies["@playwright/test"] // .dependencies["@playwright/test"]' apps/app/package.json | sed 's/^[\^~]//')"
          ATLAS="$(grep -m1 'ATLAS_VERSION:' .github/workflows/pipeline.yml | sed -E 's/.*"(v[0-9.]+)".*/\1/')"
          echo "node=$NODE" >> "$GITHUB_OUTPUT"
          echo "pnpm=$PNPM" >> "$GITHUB_OUTPUT"
          echo "playwright=$PLAYWRIGHT" >> "$GITHUB_OUTPUT"
          echo "atlas=$ATLAS" >> "$GITHUB_OUTPUT"
          echo "Resolved node=$NODE pnpm=$PNPM playwright=$PLAYWRIGHT atlas=$ATLAS"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .github/docker/ci
          target: base
          push: true
          tags: |
            ghcr.io/macanderson/oxagen-ci-base:latest
            ghcr.io/macanderson/oxagen-ci-base:sha-${{ github.sha }}
          build-args: |
            NODE_VERSION=${{ steps.versions.outputs.node }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
            ATLAS_VERSION=${{ steps.versions.outputs.atlas }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max

      - name: Build and push e2e image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .github/docker/ci
          target: e2e
          push: true
          tags: |
            ghcr.io/macanderson/oxagen-ci-e2e:latest
            ghcr.io/macanderson/oxagen-ci-e2e:sha-${{ github.sha }}
          build-args: |
            NODE_VERSION=${{ steps.versions.outputs.node }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
            ATLAS_VERSION=${{ steps.versions.outputs.atlas }}
            PLAYWRIGHT_VERSION=${{ steps.versions.outputs.playwright }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max

      - name: Smoke-test published images
        run: |
          docker run --rm ghcr.io/macanderson/oxagen-ci-base:sha-${{ github.sha }} \
            sh -c 'node --version && pnpm --version && atlas version && psql --version && git --version'
          docker run --rm ghcr.io/macanderson/oxagen-ci-e2e:sha-${{ github.sha }} \
            sh -c 'ls "$PLAYWRIGHT_BROWSERS_PATH" | grep -q chromium'
