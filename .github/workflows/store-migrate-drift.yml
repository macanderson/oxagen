# store-migrate-drift.yml — does production carry the store schema we committed?
#
# The gap this closes (#1370). A ClickHouse or Neo4j schema change merges green
# and reaches no database. The `test` and `e2e` jobs both run `db-migrate.ts`
# against their own ephemeral service containers, so the migrations are proven
# to APPLY on every PR — what nothing proved is that anybody applied them to the
# store the platform uses. Postgres has `atlas migrate status` and a revision
# table to answer that; these two had neither a caller nor an equivalent.
#
# It has already been paid for once. Production ClickHouse carried no schema at
# all from the 2026-08-27 cutover onward, and the API's error sink failed on
# every capture with `Table oxagen.error_events does not exist`. Nothing
# reported it, because a failing error reporter is the one component whose
# failure it cannot report. `store-migrate.yml` beside this file is how the
# schema gets applied; this is the thing that notices it has not been.
#
# Read-only, by construction. It opens the same tunnels `store-migrate.yml`
# opens, runs two SELECT-shaped queries, and compares them with lists from the
# repository. `infra/tools/tests/check-store-drift.test.sh` asserts that the
# script invokes no runner and sends no write statement — a scheduled job that
# could apply would quietly become the thing that migrates production at 3am,
# which is the decision #1341 already made the other way.
#
# Why scheduled rather than per-PR: a PR cannot reach production, and a check
# that ran on every PR would be red for every PR between adding a migration and
# applying it — which is a normal state, not a defect. Daily is the resolution
# that matters for "a schema change merged a while ago and never landed".
name: Store Drift (scheduled)

on:
  schedule:
    # 06:20 UTC. Off the hour on purpose: the hour is when every scheduled job
    # on GitHub starts at once and the queue is longest.
    - cron: "20 6 * * *"
  workflow_dispatch:

concurrency:
  group: store-drift
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  # A red scheduled run is easy to not look at. The last step turns a failure
  # into an issue, which is what makes this visible rather than merely recorded.
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::916294258235:role/gha-deploy-oxagen-platform
          aws-region: us-east-1

      # The tunnel, the Session Manager plugin, cypher-shell on Java 21 and the
      # Parameter Store read all moved to a composite action when
      # pipeline.yml's `migration-gate` came to need the same setup. Every
      # comment explaining why each step is shaped the way it is moved with it;
      # read `.github/actions/open-store-tunnels/action.yml` before changing any
      # of it. Two copies would drift, and the half that drifts is the half that
      # reports a store unreadable for a reason already fixed next door.
      - name: Open the store tunnels
        uses: ./.github/actions/open-store-tunnels

      # The exit code is captured rather than allowed to fail the step, because
      # the three outcomes these scripts distinguish have to survive into the
      # reporting below. The run is failed at the end instead, so a red run
      # still means what it means.
      - name: Compare production against this repository
        id: stores
        run: |
          set +e
          bash infra/tools/check-store-drift.sh | tee /tmp/drift.txt
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # Postgres was missing from this job until a fourth occurrence of #1275.
      # This file's own header said why: "Postgres has `atlas migrate status`
      # and a revision table to answer that; these two had neither a caller nor
      # an equivalent." Postgres had the ANSWER and no CALLER — nothing in the
      # repository ever asked it — so the store with the best instrumentation
      # was the only one whose drift was invisible on every trigger, and it is
      # the one that has taken production down.
      #
      # It needs no tunnel: Aurora is asked by sending `atlas migrate status`
      # to the node over SSM, which is what run-db-migrations.sh does without
      # --apply. It runs after the stores only so the tunnels above are not
      # left idling through it.
      - name: Compare production Postgres against this repository
        id: pg
        run: |
          set +e
          bash infra/tools/check-postgres-drift.sh | tee /tmp/pg-drift.txt
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # One verdict from three stores, with the precedence bump_status uses
      # inside the scripts: unknown outranks behind, because the response to
      # each is different. An empty code is a step that did not run, which is
      # unknown and never current.
      - name: Combine the verdicts
        id: drift
        env:
          PG: ${{ steps.pg.outputs.code }}
          STORES: ${{ steps.stores.outputs.code }}
        run: |
          set -uo pipefail
          pg=${PG:-2}
          stores=${STORES:-2}
          if [ "$pg" = "2" ] || [ "$stores" = "2" ]; then code=2
          elif [ "$pg" = "1" ] || [ "$stores" = "1" ]; then code=1
          else code=0
          fi
          echo "postgres: $pg    clickhouse/neo4j: $stores    verdict: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Both outputs feed the issue body. Postgres first: it is the store
          # whose drift had no other caller, so it is the one a reader is least
          # likely to have heard about another way.
          cat /tmp/pg-drift.txt /tmp/drift.txt > /tmp/combined.txt 2>/dev/null || true

      # Matches infra-drift.yml next door: found by a dedicated label rather
      # than by matching a title, closed only on a real clean answer, and
      # written with github-script for the same reason that file uses it.
      #
      # The distinction that matters here is the one the script exists to draw.
      # Exit 2 means the stores could not be read, which is NOT the same as a
      # store being behind and is NOT a recovery. So it neither closes the
      # issue nor claims drift — it says the check did not happen. A recovery
      # is claimed off an answer, never off the absence of one.
      - name: File, update, or close the drift issue
        if: always()
        uses: actions/github-script@v7
        env:
          CODE: ${{ steps.drift.outputs.code }}
        with:
          script: |
            const fs = require('fs')
            const code = process.env.CODE || '2'
            const LABEL = 'store-drift'
            const { owner, repo } = context.repo
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`

            const existing = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            })).data[0]

            if (code === '0') {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Both stores carry the schema this repository declares, as of ${new Date().toISOString()}. Closing.`,
                })
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed',
                })
              }
              core.info('both stores current')
              return
            }

            let detail = ''
            try { detail = fs.readFileSync('/tmp/combined.txt', 'utf8').slice(-6000) }
            catch { detail = '(output unavailable)' }

            const behind = code === '1'
            const title = behind
              ? 'Production database schema is behind this repository'
              : 'The store drift check could not read the stores'

            let body = behind
              ? 'A committed migration has not reached production.\n\n'
                + 'Apply ClickHouse and Neo4j with the **Store Migrate (manual)** workflow. '
                + 'Apply Postgres with `infra/tools/run-db-migrations.sh`, which runs on the app node over SSM. '
                + 'The DB Migrate (manual) workflow cannot reach Aurora from a hosted runner. '
                + 'Read the pending list before applying: a store whose ledger was lost reports '
                + 'its whole history as pending, and applying from there is not what you want.\n\n'
                + 'Until it is applied, `migration-gate` in pipeline.yml blocks every deploy of api and app.\n'
              : 'The check did not complete, so nothing here says the stores are current — this is not a drift report.\n\n'
                + 'Usual causes are the SSM tunnel not coming up and a credential that no longer reads `/oxagen/production/*`.\n'

            body += `\nRun: ${runUrl}\n\n<details><summary>output</summary>\n\n\`\`\`\n${detail}\n\`\`\`\n\n</details>\n`

            if (existing) {
              // Comment, and retitle only UPWARD. A slow tunnel one morning
              // must not turn an open "the schema is behind" report into "the
              // check could not read the stores", because the body that
              // follows would then send the responder to the SSM runbook for a
              // migration that genuinely has not been applied. infra-drift.yml
              // never retitles at all; this goes one step further only in the
              // direction that adds information.
              if (behind && existing.title !== title) {
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, title,
                })
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body,
              })
              core.info(`commented on #${existing.number}`)
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body, labels: [LABEL, 'triage'],
              })
              core.info(`opened #${created.data.number}`)
            }

      # The run is red when a store is behind or could not be read. Done after
      # the issue is filed so a reporting failure cannot swallow the verdict.
      - name: Fail the run on anything but a clean answer
        if: always() && steps.drift.outputs.code != '0'
        run: |
          if [ "${{ steps.drift.outputs.code }}" = "1" ]; then
            echo "::error::A store is behind this repository. See the issue this run filed."
          else
            echo "::error::The stores could not be read, so nothing here says they are current."
          fi
          exit 1

      - name: Close the tunnels
        if: always()
        run: |
          for f in /tmp/tunnel-*.pid; do
            [ -f "$f" ] || continue
            kill "$(cat "$f")" 2>/dev/null || true
          done
