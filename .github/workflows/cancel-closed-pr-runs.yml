# Cancel a pull request's CI runs when it merges or closes.
#
# A PR's run keeps going after the PR merges. It tests a merge ref nobody
# will ship, and it holds runners for up to ~75 minutes. On 2026-09-23 six
# such runs held the pool while the main run that would deploy their
# changes waited over ten minutes to start its preflight. Main runs are the
# only ones that deploy, so every runner a dead PR run holds delays
# production.
#
# pipeline.yml's concurrency group cancels a PR run when the PR is pushed
# again, but not when it closes: a closed PR raises no new run to supersede
# the old one. This workflow is that missing trigger.
#
# It cancels only `pull_request` runs whose head branch is this PR's, so a
# push run on main, and the migration-gate inside it, is never touched.
name: cancel-closed-pr-runs

on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            let cancelled = 0;
            for (const status of ["queued", "in_progress", "waiting", "pending", "requested"]) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...context.repo, branch, event: "pull_request", status, per_page: 100,
              });
              for (const run of runs) {
                // This workflow's own run is on the same branch and event.
                if (run.id === context.runId) continue;
                if (run.head_repository?.full_name !== pr.head.repo?.full_name) continue;
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id })
                  .then(() => { cancelled++; core.info(`cancelled ${run.name} #${run.run_number} (${run.id})`); })
                  .catch((e) => core.warning(`could not cancel ${run.id}: ${e.message}`));
              }
            }
            core.notice(`#${pr.number} ${pr.merged ? "merged" : "closed"}: cancelled ${cancelled} run(s) on ${branch}`);
