# SCR corpus drift check (oxagen #1320).
#
# ADR-038 replicated docs/scr/ byte-identically across the five org repos and
# accepted cross-repo drift as a known cost. docs/scr/README.md declares that
# drift is a bug — this workflow is the thing that notices.
#
# ## Why this lives only in oxagen
#
# The obvious reading of "check the five repos" is five copies of this
# workflow. That would replicate the very artifact whose replication we are
# trying to police: a bug fixed here would have to be re-fixed four times, and
# the fixes could themselves drift. One central job reading the other four
# through the API has a single implementation and cannot disagree with itself.
# See ADR-039.
#
# ## Token
#
# All five repos are public today, and GITHUB_TOKEN can read public content in
# other repositories, so no PAT is required. SCR_CORPUS_TOKEN is honoured when
# set, for the day one of them turns private.
#
# If a repo does go private without that secret, the tree request 404s and the
# script exits 2 — "the check could not run" — which fails this job loudly.
# That is the deliberate design: the failure mode of a missing token must never
# be a green run that silently compared four repos instead of five.
name: scr-corpus-check

on:
  # Daily. Drift is introduced by humans landing a corpus edit in one repo and
  # forgetting the others, so the useful detection latency is "within a day",
  # not "within a minute" — this does not need to run per-push.
  schedule: [{ cron: "0 8 * * *" }]
  workflow_dispatch: {}
  # Re-check immediately when the corpus itself changes here, so a same-day
  # partial rollout is caught while the author still has the context loaded.
  push:
    branches: [main]
    paths: ["docs/scr/**"]

permissions:
  contents: read
  issues: write

jobs:
  corpus-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # No pnpm install: the check is dependency-free by design (node: builtins
      # plus fetch). Installing the workspace to run one script would make a
      # five-minute job out of a five-second one, and would couple the health
      # of the process check to the health of the product's dependency tree.
      - name: Compare docs/scr/ across the five org repos
        id: check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.SCR_CORPUS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node tools/scripts/scr-corpus-check.mjs

      # Exit 2 means the check could not run — bad token, network, truncated
      # tree. That must fail the job rather than file a drift issue: reporting
      # "the corpora disagree" when we never managed to read them would send
      # someone chasing a divergence that may not exist.
      - name: Fail loudly if the check could not run
        if: steps.check.outcome == 'failure' && steps.check.outputs.drifted == ''
        run: |
          echo "::error::SCR corpus check could not run — see the step log above."
          exit 1

      - name: File or update the drift issue
        if: steps.check.outputs.drifted == 'true'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.check.outputs.report }}
        with:
          script: |
            // A hidden marker, not a title match: titles get edited by humans
            // and by the triage agent, and a daily job that re-files because
            // someone reworded a title turns a real signal into noise.
            const MARKER = '<!-- scr-corpus-drift -->'
            const body = [
              MARKER,
              '### Context',
              '',
              'The SCR corpus has drifted between the five org repos. ADR-038 replicates',
              '`docs/scr/` identically across them and `docs/scr/README.md` declares drift a bug.',
              '',
              process.env.REPORT,
              '',
              `Detected by [scr-corpus-check run ${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              '',
              '### Definition of done',
              '',
              '- [ ] Every divergence above is resolved by a deliberate re-sync of all five copies',
              '- [ ] `scr-corpus-check` is green',
              '- [ ] Residue filed as new issues (triage label only)',
            ].join('\n')

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open "${MARKER}" in:body`,
            })

            if (existing.data.total_count > 0) {
              // Update in place rather than commenting daily: the issue should
              // always show the *current* divergence, and an unresolved drift
              // must not grow a 30-comment tail before someone reads it.
              const number = existing.data.items[0].number
              await github.rest.issues.update({ ...context.repo, issue_number: number, body })
              core.notice(`Updated existing drift issue #${number}`)
            } else {
              // `triage` only — SCR-005: the filer never sets priority.
              const created = await github.rest.issues.create({
                ...context.repo,
                title: 'SCR corpus has drifted between the org repos',
                body,
                labels: ['triage'],
              })
              core.notice(`Filed drift issue #${created.data.number}`)
            }

      - name: Fail the run when drift is present
        if: steps.check.outputs.drifted == 'true'
        run: |
          echo "::error::SCR corpus drift detected — see the filed issue."
          exit 1
