# docs/scr absence check (oxagen #1320, revised by ADR-137), plus the DoD
# caller stubs (oxagen #2661).
#
# ADR-038 replicated docs/scr/ across five org repos. ADR-137 retired that
# corpus. Standing decisions live in oxagen's AGENTS.md (ADR-181),
# and a connected repository is steered from the workspace. This workflow
# fails when any of the five repos still has a file under docs/scr/. The DoD
# caller stubs are a separate replication and stay on the second step.
#
# ## Why this lives only in oxagen
#
# The obvious reading of "check the five repos" is five copies of this
# workflow. That would replicate the very artifact whose replication we are
# trying to police: a bug fixed here would have to be re-fixed four times, and
# the fixes could themselves drift. One central job reading the other four
# through the API has a single implementation and cannot disagree with itself.
# See ADR-039.
#
# ## Token
#
# All five repos are public today, and GITHUB_TOKEN can read public content in
# other repositories, so no PAT is required. SCR_CORPUS_TOKEN is honoured when
# set, for the day one of them turns private.
#
# If a repo does go private without that secret, the tree request 404s and the
# script exits 2 — "the check could not run" — which fails this job loudly.
# That is the deliberate design: the failure mode of a missing token must never
# be a green run that silently compared four repos instead of five.
name: scr-corpus-check

on:
  # Daily. A reintroduced docs/scr tree should be noticed within a day.
  schedule: [{ cron: "0 8 * * *" }]
  workflow_dispatch: {}
  # Re-check when someone adds docs/scr back, or when the check itself changes.
  push:
    branches: [main]
    paths:
      - "docs/scr/**"
      - "tools/scripts/scr-corpus-check.mjs"
      - ".github/workflows/scr-corpus-check.yml"
      # The DoD caller stubs are the other thing replicated across those four
      # repos, and they drift the same way (oxagen#2661). A change to either
      # workflow here is usually the change the callers have to follow.
      - ".github/workflows/dod-check.yml"
      - ".github/workflows/dod-recheck.yml"
      # The close guard is the third replicated stub and the one carrying
      # issues: write (oxagen#1336). Changing it here is exactly the moment
      # four callers have to re-pin, so it belongs on this list for the same
      # reason as the other two.
      - ".github/workflows/dod-close-guard.yml"

permissions:
  contents: read
  issues: write

jobs:
  corpus-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # No pnpm install: the check is dependency-free by design (node: builtins
      # plus fetch). Installing the workspace to run one script would make a
      # five-minute job out of a five-second one, and would couple the health
      # of the process check to the health of the product's dependency tree.
      - name: Confirm none of the five org repos still carries docs/scr/
        id: check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.SCR_CORPUS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node tools/scripts/scr-corpus-check.mjs

      # The DoD caller stubs are replicated across the same four repos, for the
      # same reason and with the same failure mode: a fix lands here and
      # reaches three of four. It rides this job rather than a workflow of its
      # own because it asks the identical question of the identical repos and
      # needs no dependencies either. It fails open on a network or rate-limit
      # error, so a GitHub outage cannot be what blocks a merge here.
      - name: Compare the DoD caller stubs across the four repos
        env:
          GITHUB_TOKEN: ${{ secrets.SCR_CORPUS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node tools/scripts/check-dod-stub-parity.mjs

      # Exit 2 means the check could not run — bad token, network, truncated
      # tree. That must fail the job rather than file a drift issue: reporting
      # "the corpora disagree" when we never managed to read them would send
      # someone chasing a divergence that may not exist.
      - name: Fail loudly if the check could not run
        if: steps.check.outcome == 'failure' && steps.check.outputs.drifted == ''
        run: |
          echo "::error::SCR corpus check could not run — see the step log above."
          exit 1

      - name: File or update the drift issue
        if: steps.check.outputs.drifted == 'true'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.check.outputs.report }}
        with:
          script: |
            // A hidden marker, not a title match: titles get edited by humans
            // and by the triage agent, and a daily job that re-files because
            // someone reworded a title turns a real signal into noise.
            const MARKER = '<!-- scr-corpus-drift -->'
            // The DoD comes from the tested module, so the close step below
            // can tick exactly the items a green run verifies.
            const { driftDodSection } = await import(
              `${process.env.GITHUB_WORKSPACE}/tools/scripts/scr-drift-issue.mjs`
            )
            const body = [
              MARKER,
              '### Context',
              '',
              'A repository still carries `docs/scr/`. ADR-137 retired that corpus.',
              'Standing decisions live in oxagen `AGENTS.md` (ADR-181).',
              'A connected repository is steered from the workspace and does not keep a copy.',
              '',
              process.env.REPORT,
              '',
              `Detected by [scr-corpus-check run ${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              '',
              driftDodSection(),
            ].join('\n')

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open "${MARKER}" in:body`,
            })

            // The lookup lives in a tested module because it could not be
            // tested inline, and inline it destroyed an unrelated issue's body
            // (#2666). Search is a candidate list, never an answer.
            const { confirmMarkedIssues, decideDriftAction } = await import(
              `${process.env.GITHUB_WORKSPACE}/tools/scripts/scr-drift-issue.mjs`
            )

            const confirmed = await confirmMarkedIssues(
              existing.data.items,
              async (n) => {
                const { data } = await github.rest.issues.get({
                  ...context.repo,
                  issue_number: n,
                })
                return data.body
              },
              MARKER,
            )

            const decision = decideDriftAction(confirmed)

            if (decision.action === 'abort') {
              core.setFailed(decision.reason)
              return
            }

            if (decision.action === 'update') {
              // Update in place rather than commenting daily: the issue should
              // always show the *current* divergence, and an unresolved drift
              // must not grow a 30-comment tail before someone reads it.
              const number = decision.number
              await github.rest.issues.update({ ...context.repo, issue_number: number, body })
              core.notice(`Updated existing drift issue #${number}`)
            } else {
              // `triage` only — SCR-005: the filer never sets priority.
              const created = await github.rest.issues.create({
                ...context.repo,
                title: 'SCR corpus has drifted between the org repos',
                body,
                labels: ['triage'],
              })
              core.notice(`Filed drift issue #${created.data.number}`)
            }

      # The drift issue's definition of done says this check is green, so a
      # green run ticks the items it verifies and closes the issue when no box
      # is left unticked (#2978, SCR-003). The step reads `drifted == 'false'`, which
      # the script writes only after it read all five repos. An empty output
      # means the check could not run, and that must never close the issue.
      - name: Close the drift issue once the corpus is clean
        if: steps.check.outcome == 'success' && steps.check.outputs.drifted == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- scr-corpus-drift -->'

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open "${MARKER}" in:body`,
            })

            // The same confirmation as the filing step: search returns
            // candidates, and only a body that carries the marker in its prose
            // is the drift issue. An issue quoting it in backticks stays open.
            const { confirmMarkedIssues, decideCloseAction, prepareDriftClose } = await import(
              `${process.env.GITHUB_WORKSPACE}/tools/scripts/scr-drift-issue.mjs`
            )

            const confirmed = await confirmMarkedIssues(
              existing.data.items,
              async (n) => {
                const { data } = await github.rest.issues.get({
                  ...context.repo,
                  issue_number: n,
                })
                return data.body
              },
              MARKER,
            )

            const decision = decideCloseAction(confirmed)

            if (decision.action === 'abort') {
              core.setFailed(decision.reason)
              return
            }

            if (decision.action === 'noop') {
              core.notice('No open drift issue to close.')
              return
            }

            // SCR-003: close as completed only when every DoD box is ticked.
            // This run verifies the items it ticks here; any other open item
            // is left to a person, and the issue stays open until it is done.
            const number = decision.number
            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: number,
            })
            const ready = prepareDriftClose(issue.body)
            if (ready.changed) {
              await github.rest.issues.update({ ...context.repo, issue_number: number, body: ready.body })
            }
            const run = `[scr-corpus-check run ${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            if (!ready.close) {
              const left = ready.unchecked.length > 0
                ? ready.unchecked.map((item) => `- [ ] ${item}`).join('\n')
                : 'The issue has no definition of done this run can check.'
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: number,
                body: `Corpus clean as of ${context.sha}, verified by ${run}. The items this run proves are ticked. The issue stays open until a person finishes the rest and closes it:\n\n${left}`,
              })
              core.notice(`Drift issue #${number} left open: ${ready.unchecked.length} DoD item(s) need a person.`)
              return
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: number,
              body: `Corpus clean as of ${context.sha}. Every DoD item is ticked. Closed by ${run}.`,
            })
            await github.rest.issues.update({
              ...context.repo,
              issue_number: number,
              state: 'closed',
              state_reason: 'completed',
            })
            core.notice(`Closed drift issue #${number}`)

      - name: Fail the run when drift is present
        if: steps.check.outputs.drifted == 'true'
        run: |
          echo "::error::SCR corpus drift detected — see the filed issue."
          exit 1
