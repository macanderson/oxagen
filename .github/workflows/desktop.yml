name: Desktop

# The Oxagen desktop app (apps/desktop): a Tauri shell over the compiled
# `tacho` and `oxagen` sidecars. One job per release OS, because the sidecars
# are Node single-executables and the host node is the runtime that ships
# (no cross-compile). Spec: docs/specs/oxagen-desktop/spec.html.
#
# Signing is applied when the secrets exist and skipped otherwise, so a fork
# or a dry run still produces installable (unsigned) bundles:
#   macOS    APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID   (Developer ID + notarization)
#   Windows  AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (Trusted Signing)
#            or WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD
#   Linux    unsigned
#   Updater  TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD when
#            the key has one): the minisign key whose public half sits in
#            tauri.conf.json plugins.updater.pubkey. Present → every bundle
#            gets a .sig and the release carries latest.json, which installed
#            apps poll. Absent → the build passes --config tauri.unsigned.conf.json
#            (createUpdaterArtifacts: false) so `tauri build` does not stop at
#            "public key found but no private key", and no latest.json is
#            published; installed apps then report "up to date".

on:
  push:
    tags:
      - "desktop-v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release (otherwise upload artifacts only)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-14
            triple: aarch64-apple-darwin
            bundles: dmg
          - name: macOS (Intel)
            os: macos-13
            triple: x86_64-apple-darwin
            bundles: dmg
          - name: Linux (x86_64)
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: Windows (x86_64)
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: msi,nsis

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/pnpm-install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # The two sidecars: node single-executables named with the Rust triple.
      - name: Build sidecars
        run: pnpm --filter @oxagen/desktop sidecars -- --triple ${{ matrix.triple }}

      - name: Import the Apple certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      # Updater signing is all-or-nothing: with the key, sign and publish
      # latest.json; without it, switch updater artifacts off for this build.
      - name: Updater signing
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "args=--config src-tauri/tauri.unsigned.conf.json" >> "$GITHUB_OUTPUT"
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set; building without updater artifacts."
          fi

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater: present → .sig per bundle + latest.json; absent → see above.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: present → sign + notarize; absent → ad-hoc.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: Azure Trusted Signing when configured.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }} ${{ steps.updater.outputs.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && format('Oxagen {0}', github.ref_name) || '' }}
          releaseBody: See docs/specs/oxagen-desktop/spec.html for what the app does and how to verify an install.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ steps.updater.outputs.signed == 'true' }}

      # The bare CLI binaries next to the bundles, each with a .sha256, so the
      # Homebrew formula and the Scoop manifest in tools/packaging can install
      # tacho + oxagen without the app. tauri-action created the draft release
      # above; gh finds a draft by its tag.
      - name: Checksum the CLI binaries
        run: node tools/packaging/checksums.mjs apps/desktop/src-tauri/binaries

      - name: Attach the CLI binaries to the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" apps/desktop/src-tauri/binaries/* --clobber

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: oxagen-desktop-${{ matrix.triple }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/binaries/*
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/**/*.sig
