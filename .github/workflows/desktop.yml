name: Desktop

# The Oxagen desktop app (apps/desktop): a Tauri shell over the compiled
# `tacho` and `oxagen` sidecars. One job per release OS, because the sidecars
# are Node single-executables and the host node is the runtime that ships
# (no cross-compile). Spec: docs/specs/oxagen-desktop/spec.html.
#
# Signing is applied when the secrets exist and skipped otherwise, so a fork
# or a dry run still produces installable (unsigned) bundles:
#   macOS    APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID   (Developer ID + notarization)
#            Exported to the build only inside the certificate-import step, which
#            runs only when APPLE_CERTIFICATE is set: an empty
#            APPLE_SIGNING_IDENTITY makes tauri run `codesign -s ""`, which fails
#            with "no identity found" instead of skipping. Without the
#            certificate the next step signs ad-hoc ("-") instead, which seals
#            the bundle so it verifies and can be opened through the
#            unidentified-developer prompt. Notarization still needs the secrets;
#            until they exist, macOS downloads carry that prompt.
#   Windows  not signed yet. tauri-bundler signs only through
#            bundle.windows.certificateThumbprint or signCommand, neither of
#            which is configured, and no signing tool is installed here;
#            SmartScreen warns on every build until that is wired.
#   Linux    unsigned
#   Updater  TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD when
#            the key has one): the minisign key whose public half sits in
#            tauri.conf.json plugins.updater.pubkey. Present → every bundle
#            gets a .sig and the release carries latest.json. Absent → the build
#            passes --config tauri.unsigned.conf.json (createUpdaterArtifacts:
#            false) so `tauri build` does not stop at "public key found but no
#            private key", and no latest.json is published; installed apps then
#            report "up to date".
#
# The updater feed: installed apps poll the `desktop-latest` release, not the
# repository's `/releases/latest`, which is whichever release across the whole
# repository was published from the newest commit — a platform `v*` release
# published after a desktop one would take it over and the feed would 404.
# When a `desktop-v*` release is published, the `feed` job below copies its
# latest.json onto `desktop-latest`.
#
# Two things publish, and both end on https://downloads.oxagen.sh/ (ADR-158):
#
#   A release. A `desktop-v*` tag builds all four targets, then the `publish`
#   job copies the installers and their checksums to the downloads host,
#   publishes the GitHub release, and points the updater feed at it.
#   `release.yml` pushes the tag when a release PR merges; a person pushing
#   one gets the same result.
#
#   A production deploy. `publish-installers` in pipeline.yml dispatches this
#   workflow with `publish: true` and the deployed commit once every
#   `deploy-node` leg has shipped. The `plan` job numbers it as a build of the
#   next patch, `X.Y.(Z+1)-N` for the Nth commit after release X.Y.Z
#   (tools/scripts/desktop-build-version.ts), the build legs stamp that
#   version into the checkout, and `publish` uploads the installers under
#   `desktop/<version>/`. A build has no tag, no GitHub release and no update
#   feed entry: installed apps still update on releases only. The release
#   commit itself is skipped here, because its tag publishes it.
#
# Either way, `publish-downloads.mjs` moves the version-free `latest/` links,
# `latest.json` and the page only when the version is the newest the host has
# seen, so a release and a deploy build finishing out of order cannot take the
# links backwards. The web app's enrollment screens and the docs link
# `latest/`.
#
# A manual run without `publish` builds and uploads the bundles as workflow
# artifacts only. `preview` does the same with the version a deploy would
# give the commit, so a branch can prove every bundler takes it.

on:
  push:
    tags:
      - "desktop-v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the build to downloads.oxagen.sh, as a production deploy does"
        type: boolean
        default: false
      sha:
        description: "Commit on main to build (default: the head of the ref this runs on)"
        type: string
        default: ""
      preview:
        description: "Number and stamp the commit as a deploy build, publish nothing (checks a branch's bundles)"
        type: boolean
        default: false

permissions:
  contents: write

# Deploy builds share one group without cancelling: one builds, the newest
# waits, and a newer deploy replaces a waiting one, so a burst of merges ends
# with the tip built rather than every commit or none (the #2730 lesson).
# Every other run, a release tag above all, gets a group of its own and can
# never be evicted by a deploy.
concurrency:
  group: >-
    desktop-${{
      github.event_name == 'workflow_dispatch' && inputs.publish
        && 'deploy' || github.run_id
    }}
  cancel-in-progress: false

jobs:
  # What this run builds and whether it publishes: a release from its tag, a
  # build of main from a deploy's dispatch, or artifacts only.
  plan:
    name: Plan the build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      # A deploy build publishes to the host every customer downloads from,
      # so it builds only what main carries.
      - name: The commit is on main
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse HEAD) is not on main; a deploy build publishes only what main carries"
            exit 1
          fi

      - uses: ./.github/actions/pnpm-install
        if: github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.preview)

      - name: Choose the version
        id: plan
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && inputs.preview }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            {
              echo "version=${GITHUB_REF_NAME#desktop-v}"
              echo "channel=release"
              echo "publish=true"
            } >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH" = "true" ] || [ "$PREVIEW" = "true" ]; then
            pnpm exec tsx tools/scripts/desktop-build-version.ts plan | tee plan.txt
            version="$(sed -n 's/^version=//p' plan.txt)"
            if [ -z "$version" ]; then
              echo "::notice::this is a release commit; its desktop-v tag publishes the installers"
              echo "channel=skip" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              {
                echo "version=$version"
                echo "channel=build"
                echo "publish=$PUBLISH"
              } >> "$GITHUB_OUTPUT"
            fi
          else
            {
              echo "version=$(node -p "require('./package.json').version")"
              echo "channel=artifacts"
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.channel != 'skip'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Whether a Developer ID certificate is configured, for the two signing
    # steps below. A step's `if` is evaluated before that step's own `env`
    # applies, so `env.APPLE_CERTIFICATE` read there was always empty: the
    # import never ran and every build was signed ad-hoc.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `app` alongside `dmg`: the v2 updater archive (Oxagen.app.tar.gz +
          # .sig) is only produced when the `app` target is requested; with
          # `dmg` alone the bundler logs "no updater-enabled targets were
          # built", signs nothing, and latest.json carries no darwin entry.
          - name: macOS (Apple silicon)
            os: macos-15
            triple: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS (Intel)
            os: macos-15-intel
            triple: x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux (x86_64)
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: Windows (x86_64)
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: msi,nsis

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: ./.github/actions/pnpm-install

      # A deploy build carries its own version in every manifest of this
      # checkout (never committed), so the installers, the app's About and
      # both sidecars all name the same build.
      - name: Stamp the build version
        if: needs.plan.outputs.channel == 'build'
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: pnpm exec tsx tools/scripts/desktop-build-version.ts stamp "$VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # A `desktop-v2.2.0` tag on a tree whose package.json says 2.1.1 shipped
      # 2.1.1 bundles under the 2.2.0 release, and the updater then offered
      # 2.1.1 to itself.
      - name: The tag names the version being built
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#desktop-v}"
          have="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME names $want but apps/desktop/package.json is $have"
            exit 1
          fi

      # The two sidecars: node single-executables named with the Rust triple.
      - name: Build sidecars
        run: pnpm --filter @oxagen/desktop sidecars -- --triple ${{ matrix.triple }}

      # The Apple variables reach the build step only from here, so a missing
      # certificate leaves them unset (not empty) and tauri skips signing.
      - name: Import the Apple certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12
          for name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done

      # Without a Developer ID, tauri leaves the bundle with only the linker's
      # ad-hoc signature and no Contents/_CodeSignature seal. That app is not
      # merely unsigned — `codesign --verify` rejects it with "code has no
      # resources but signature indicates they must be present", and macOS
      # refuses a quarantined copy outright as damaged, which the right-click
      # Open override cannot rescue. Signing with the explicit ad-hoc identity
      # "-" writes the seal, so the bundle verifies, the sidecars are sealed as
      # nested code, and Gatekeeper's refusal becomes the ordinary
      # unidentified-developer prompt a user can accept. It is not a substitute
      # for notarization; it is the difference between a build a determined user
      # can open and one nobody can.
      #
      # "-" is required rather than an empty value: an empty APPLE_SIGNING_IDENTITY
      # makes tauri run `codesign -s ""`, which fails with "no identity found".
      - name: Ad-hoc sign when no Developer ID is configured
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT != 'true'
        run: |
          echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          echo "::notice::No Apple Developer ID secrets; ad-hoc signing the bundle so it verifies and can be opened via the unidentified-developer prompt. Not notarized."

      # Updater signing is all-or-nothing: with the key, sign and publish
      # latest.json; without it, switch updater artifacts off for this build.
      - name: Updater signing
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "args=--config src-tauri/tauri.unsigned.conf.json" >> "$GITHUB_OUTPUT"
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set; building without updater artifacts."
          fi

      # hdiutil on GitHub's macOS runners sometimes fails inside tauri's
      # bundle_dmg.sh ("Resource busy" on the scratch image) with nothing wrong
      # in the commit: bf14d15 built on one dispatch and failed on the next
      # (run 36065191903). On macOS a failed first attempt is not final: the
      # next step detaches any image it left mounted, the one after builds once
      # more, and that attempt's failure fails the job. Other runners get no
      # retry.
      - name: Build the app
        id: build
        continue-on-error: ${{ runner.os == 'macOS' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater: present → .sig per bundle + latest.json; absent → see above.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }} ${{ steps.updater.outputs.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && format('Oxagen {0}', github.ref_name) || '' }}
          releaseBody: See docs/specs/oxagen-desktop/spec.html for what the app does and how to verify an install.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ steps.updater.outputs.signed == 'true' }}

      - name: Clear the failed macOS bundle
        if: runner.os == 'macOS' && steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::The first macOS build failed; detaching stale disk images and building once more."
          hdiutil info | awk '/^\/dev\/disk/ && /\/Volumes\// {print $1}' | while read -r dev; do
            hdiutil detach "$dev" -force || true
          done
          rm -rf "apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg"
          sleep 10

      - name: Build the app again on macOS
        if: runner.os == 'macOS' && steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater: present → .sig per bundle + latest.json; absent → see above.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }} ${{ steps.updater.outputs.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && format('Oxagen {0}', github.ref_name) || '' }}
          releaseBody: See docs/specs/oxagen-desktop/spec.html for what the app does and how to verify an install.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ steps.updater.outputs.signed == 'true' }}

      # The bare CLI binaries next to the bundles, each with a .sha256, so the
      # Homebrew formula and the Scoop manifest in tools/packaging can install
      # tacho + oxagen without the app; on macOS the .dmg gets one too, for the
      # cask's digests. tauri-action created the draft release above; gh finds
      # a draft by its tag.
      - name: Checksum the release assets
        shell: bash
        run: |
          targets=(apps/desktop/src-tauri/binaries)
          dmg="apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg"
          if [ -d "$dmg" ]; then targets+=("$dmg"); fi
          node tools/packaging/checksums.mjs "${targets[@]}"

      - name: Attach the CLI binaries and checksums to the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(apps/desktop/src-tauri/binaries/*)
          for sum in apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.sha256; do
            if [ -f "$sum" ]; then assets+=("$sum"); fi
          done
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: oxagen-desktop-${{ matrix.triple }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/binaries/*
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.sha256
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/**/*.sig

  # Everything that happens after a published build, in the order a reader of
  # downloads.oxagen.sh would want: the files land under their immutable
  # version prefix, `latest/` and the page move to the new version, then, for
  # a release only, the GitHub release opens with the notes and the feed
  # follows. The job assumes the platform deploy role through OIDC, which the
  # `production` environment scopes; `desktop-v*` tags and main are allowed
  # to deploy to it, and infra/stacks-new/ci-deploy/roles.tf grants the role
  # the downloads bucket.
  publish:
    name: Publish the installers
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}

      # publish-downloads.mjs imports src/downloads.ts through Node's type
      # stripping (>= 22.18), so the runner image's own node is not enough.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v4
        with:
          pattern: oxagen-desktop-*
          path: installers

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::916294258235:role/gha-deploy-oxagen-platform
          aws-region: us-east-1

      # `--dir` walks the download recursively, keeps only the installers whose
      # name carries this version, and refuses a version that is already
      # published (those URLs are immutable; a fix ships as a new version).
      # `--resume` is for a re-run of this job after a later step failed: the
      # same files already published means the upload is done, so the page is
      # redrawn and the steps below run again (each is idempotent). The script
      # needs no dependencies: it imports src/downloads.ts through Node's type
      # stripping.
      - name: Publish the installers and the page to downloads.oxagen.sh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node apps/desktop/scripts/publish-downloads.mjs --dir installers --version "$VERSION" --resume

      # The checksums are served, and `latest.json` names this version or a
      # newer one: a release and a deploy build can finish in either order,
      # and the older one leaves the links where they are.
      - name: Confirm the host serves this version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          curl -fsS -o /dev/null "https://downloads.oxagen.sh/desktop/$VERSION/SHA256SUMS.txt"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://downloads.oxagen.sh/latest.json" -o latest.json &&
              node apps/desktop/scripts/check-latest.mjs latest.json "$VERSION"; then
              exit 0
            fi
            sleep 20
          done
          echo "::error::downloads.oxagen.sh/latest.json does not name $VERSION or newer two minutes after the invalidation"
          exit 1

      # tauri-action left the release as a draft so nothing links to bundles
      # that are not all there yet. Every leg built (this job needs them all),
      # the installers are on the downloads host, so the release opens now,
      # with the notes page as its body. `--latest=false` keeps the platform
      # `v*` release as the repository's latest; the updater reads
      # `desktop-latest`, not `/releases/latest`.
      - name: Publish the GitHub release
        if: needs.plan.outputs.channel == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#desktop-v}"
          cat > notes.md <<EOF
          What changed: https://docs.oxagen.sh/docs/releases/v$v

          Installers for macOS, Windows, and Linux, each with its SHA-256: https://downloads.oxagen.sh/

          The bare \`tacho\` and \`oxagen\` executables for each platform are attached below, each with a \`.sha256\`. They are the same binaries the app links onto your PATH.
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Oxagen $v" --notes-file notes.md --draft=false --latest=false

      # A release published with the workflow's own token raises no `release`
      # event, so the feed job below does not run for it; move the feed here.
      - name: Point the update feed at this release
        if: needs.plan.outputs.channel == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/desktop-update-feed.sh

  # The update feed. tauri.conf.json's updater endpoint is
  # releases/download/desktop-latest/latest.json; this copies the just-
  # published desktop release's latest.json there (its platform URLs point at
  # the versioned release's assets, which stay put). A release built without
  # the updater key carries no latest.json and leaves the feed as it was.
  feed:
    name: Point the update feed at this release
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Copy latest.json onto the desktop-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: bash .github/scripts/desktop-update-feed.sh
