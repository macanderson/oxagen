name: Desktop

# The Oxagen desktop app (apps/desktop): a Tauri shell over the compiled
# `tacho` and `oxagen` sidecars. One job per release OS, because the sidecars
# are Node single-executables and the host node is the runtime that ships
# (no cross-compile). Spec: docs/specs/oxagen-desktop/spec.html.
#
# Signing is applied when the secrets exist and skipped otherwise, so a fork
# or a dry run still produces installable (unsigned) bundles:
#   macOS    APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID   (Developer ID + notarization)
#            Exported to the build only inside the certificate-import step, which
#            runs only when APPLE_CERTIFICATE is set: an empty
#            APPLE_SIGNING_IDENTITY makes tauri run `codesign -s ""`, which fails
#            with "no identity found" instead of skipping. Without the
#            certificate the next step signs ad-hoc ("-") instead, which seals
#            the bundle so it verifies and can be opened through the
#            unidentified-developer prompt. Notarization still needs the secrets;
#            until they exist, macOS downloads carry that prompt.
#   Windows  not signed yet. tauri-bundler signs only through
#            bundle.windows.certificateThumbprint or signCommand, neither of
#            which is configured, and no signing tool is installed here;
#            SmartScreen warns on every build until that is wired.
#   Linux    unsigned
#   Updater  TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD when
#            the key has one): the minisign key whose public half sits in
#            tauri.conf.json plugins.updater.pubkey. Present → every bundle
#            gets a .sig and the release carries latest.json. Absent → the build
#            passes --config tauri.unsigned.conf.json (createUpdaterArtifacts:
#            false) so `tauri build` does not stop at "public key found but no
#            private key", and no latest.json is published; installed apps then
#            report "up to date".
#
# The updater feed: installed apps poll the `desktop-latest` release, not the
# repository's `/releases/latest`, which is whichever release across the whole
# repository was published from the newest commit — a platform `v*` release
# published after a desktop one would take it over and the feed would 404.
# When a `desktop-v*` release is published, the `feed` job below copies its
# latest.json onto `desktop-latest`.
#
# Publishing is tag-gated. A `desktop-v*` tag builds all four targets, then
# the `publish` job below publishes the release, copies the installers and
# their checksums to https://downloads.oxagen.sh/ and rewrites its page, and
# points the updater feed at the release. Nothing after the tag is done by
# hand: `release.yml` pushes the tag when a release PR merges, and a person
# pushing one gets the same result. A manual run builds and uploads the
# bundles as workflow artifacts only.

on:
  push:
    tags:
      - "desktop-v*.*.*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # `app` alongside `dmg`: the v2 updater archive (Oxagen.app.tar.gz +
          # .sig) is only produced when the `app` target is requested; with
          # `dmg` alone the bundler logs "no updater-enabled targets were
          # built", signs nothing, and latest.json carries no darwin entry.
          - name: macOS (Apple silicon)
            os: macos-15
            triple: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS (Intel)
            os: macos-15-intel
            triple: x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux (x86_64)
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: Windows (x86_64)
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: msi,nsis

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/pnpm-install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # A `desktop-v2.2.0` tag on a tree whose package.json says 2.1.1 shipped
      # 2.1.1 bundles under the 2.2.0 release, and the updater then offered
      # 2.1.1 to itself.
      - name: The tag names the version being built
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#desktop-v}"
          have="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME names $want but apps/desktop/package.json is $have"
            exit 1
          fi

      # The two sidecars: node single-executables named with the Rust triple.
      - name: Build sidecars
        run: pnpm --filter @oxagen/desktop sidecars -- --triple ${{ matrix.triple }}

      # The Apple variables reach the build step only from here, so a missing
      # certificate leaves them unset (not empty) and tauri skips signing.
      - name: Import the Apple certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12
          for name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done

      # Without a Developer ID, tauri leaves the bundle with only the linker's
      # ad-hoc signature and no Contents/_CodeSignature seal. That app is not
      # merely unsigned — `codesign --verify` rejects it with "code has no
      # resources but signature indicates they must be present", and macOS
      # refuses a quarantined copy outright as damaged, which the right-click
      # Open override cannot rescue. Signing with the explicit ad-hoc identity
      # "-" writes the seal, so the bundle verifies, the sidecars are sealed as
      # nested code, and Gatekeeper's refusal becomes the ordinary
      # unidentified-developer prompt a user can accept. It is not a substitute
      # for notarization; it is the difference between a build a determined user
      # can open and one nobody can.
      #
      # "-" is required rather than an empty value: an empty APPLE_SIGNING_IDENTITY
      # makes tauri run `codesign -s ""`, which fails with "no identity found".
      - name: Ad-hoc sign when no Developer ID is configured
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE == ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          echo "::notice::No Apple Developer ID secrets; ad-hoc signing the bundle so it verifies and can be opened via the unidentified-developer prompt. Not notarized."

      # Updater signing is all-or-nothing: with the key, sign and publish
      # latest.json; without it, switch updater artifacts off for this build.
      - name: Updater signing
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "args=--config src-tauri/tauri.unsigned.conf.json" >> "$GITHUB_OUTPUT"
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set; building without updater artifacts."
          fi

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater: present → .sig per bundle + latest.json; absent → see above.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }} ${{ steps.updater.outputs.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && format('Oxagen {0}', github.ref_name) || '' }}
          releaseBody: See docs/specs/oxagen-desktop/spec.html for what the app does and how to verify an install.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ steps.updater.outputs.signed == 'true' }}

      # The bare CLI binaries next to the bundles, each with a .sha256, so the
      # Homebrew formula and the Scoop manifest in tools/packaging can install
      # tacho + oxagen without the app; on macOS the .dmg gets one too, for the
      # cask's digests. tauri-action created the draft release above; gh finds
      # a draft by its tag.
      - name: Checksum the release assets
        shell: bash
        run: |
          targets=(apps/desktop/src-tauri/binaries)
          dmg="apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg"
          if [ -d "$dmg" ]; then targets+=("$dmg"); fi
          node tools/packaging/checksums.mjs "${targets[@]}"

      - name: Attach the CLI binaries and checksums to the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(apps/desktop/src-tauri/binaries/*)
          for sum in apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.sha256; do
            if [ -f "$sum" ]; then assets+=("$sum"); fi
          done
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: oxagen-desktop-${{ matrix.triple }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/binaries/*
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.sha256
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/**/*.sig

  # Everything that happens after a tagged build, in the order a reader of
  # downloads.oxagen.sh would want: the files land under their immutable
  # version prefix, the page moves to the new version, then the GitHub release
  # opens with the notes and the feed follows. The job assumes the platform
  # deploy role through OIDC, which the `production` environment scopes;
  # `desktop-v*` tags are allowed to deploy to it, and
  # infra/stacks-new/ci-deploy/roles.tf grants the role the downloads bucket.
  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: oxagen-desktop-*
          path: installers

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::916294258235:role/gha-deploy-oxagen-platform
          aws-region: us-east-1

      # `--dir` walks the download recursively, keeps only the installers whose
      # name carries this version, and refuses a version that is already
      # published (those URLs are immutable; a fix ships as a new version).
      # `--resume` is for a re-run of this job after a later step failed: the
      # same files already published means the upload is done, so the page is
      # redrawn and the steps below run again (each is idempotent). The script
      # needs no dependencies: it imports src/downloads.ts through Node's type
      # stripping.
      - name: Publish the installers and the page to downloads.oxagen.sh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          node apps/desktop/scripts/publish-downloads.mjs --dir installers --version "${VERSION#desktop-v}" --resume

      - name: Confirm the page serves this version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          v="${VERSION#desktop-v}"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "https://downloads.oxagen.sh/?t=$i" | grep -q "Version <code>$v</code>"; then
              echo "downloads.oxagen.sh serves $v"
              exit 0
            fi
            sleep 20
          done
          echo "::error::downloads.oxagen.sh does not serve $v two minutes after the invalidation"
          exit 1

      # tauri-action left the release as a draft so nothing links to bundles
      # that are not all there yet. Every leg built (this job needs them all),
      # the installers are on the downloads host, so the release opens now,
      # with the notes page as its body. `--latest=false` keeps the platform
      # `v*` release as the repository's latest; the updater reads
      # `desktop-latest`, not `/releases/latest`.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#desktop-v}"
          cat > notes.md <<EOF
          What changed: https://docs.oxagen.sh/docs/releases/v$v

          Installers for macOS, Windows, and Linux, each with its SHA-256: https://downloads.oxagen.sh/

          The bare \`tacho\` and \`oxagen\` executables for each platform are attached below, each with a \`.sha256\`. They are the same binaries the app links onto your PATH.
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Oxagen $v" --notes-file notes.md --draft=false --latest=false

      # A release published with the workflow's own token raises no `release`
      # event, so the feed job below does not run for it; move the feed here.
      - name: Point the update feed at this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/desktop-update-feed.sh

  # The update feed. tauri.conf.json's updater endpoint is
  # releases/download/desktop-latest/latest.json; this copies the just-
  # published desktop release's latest.json there (its platform URLs point at
  # the versioned release's assets, which stay put). A release built without
  # the updater key carries no latest.json and leaves the feed as it was.
  feed:
    name: Point the update feed at this release
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Copy latest.json onto the desktop-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: bash .github/scripts/desktop-update-feed.sh
