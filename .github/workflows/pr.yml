name: ci-pr
on:
  pull_request:
    branches: [main]
concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_SCM_BASE: origin/main
jobs:
  affected:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test:unit, test:contract]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run affected ${{ matrix.task }}
        run: pnpm turbo run ${{ matrix.task }} --filter='...[origin/main]'

  e2e:
    runs-on: ubuntu-latest
    needs: affected
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Affected e2e shard ${{ matrix.shard }}/4
        run: >
          pnpm turbo run test:e2e --filter='...[origin/main]' --
          --shard=${{ matrix.shard }}/4

  coverage-gate:
    runs-on: ubuntu-latest
    needs: affected
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run coverage:merge --filter='...[origin/main]'
      - name: Enforce thresholds
        run: pnpm exec nyc check-coverage --lines 85 --branches 80
