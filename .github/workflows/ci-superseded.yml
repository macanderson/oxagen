# Report a pull request whose CI runs keep getting cancelled before any
# finishes (#3257, ADR-215).
#
# pipeline.yml cancels a pull request's run in progress when a new push
# arrives (ADR-046). The ruleset requires `checks` and `test`, and a
# `cancelled` conclusion is not a pass. A branch pushed faster than CI
# finishes therefore never gets its required checks, and every run reads
# `cancelled`, which looks like ordinary cleanup. On 2026-09-18 PR #3233's
# branch had nine runs in 100 minutes, eight cancelled and none finished.
#
# After each CI run on a pull request completes, this reads the branch's run
# history. When the last 3 concluded runs were all cancelled, it sets a
# failing `ci-superseded` commit status on the PR's head and posts one
# comment, edited in place. When a run finishes, it clears both. One cancel
# followed by a finished run reports nothing. The status is not a required
# check. tools/scripts/check-superseded-runs.mjs holds the rule and its test.
#
# ## Why it is its own workflow
#
# It answers in seconds and must not queue behind the runs it reports on,
# the same reason main-verified.yml is separate.
#
# ## Why every completion, not only cancelled ones
#
# A finished run is what clears the report, so the job must see those too.
# The cost is one job of about 20 seconds per pull request CI run.
#
# ## Safe with forks
#
# workflow_run runs this file from the default branch with a token that can
# write, even for a fork's pull request. So it checks out the default branch
# only, never the PR's code, and reads the branch name through `env:`, never
# through `${{ }}` inside `run:`, because a branch name is attacker-chosen.
name: ci-superseded

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check
        type: number
        required: true
      dry_run:
        description: Print what would be written and write nothing
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  pull-requests: write
  statuses: write

# One evaluation per branch at a time. A newer completion evicting a queued
# older one loses nothing: each run reads the whole history.
concurrency:
  group: ci-superseded-${{ github.event.workflow_run.head_repository.full_name || 'dispatch' }}-${{ github.event.workflow_run.head_branch || inputs.pr }}
  cancel-in-progress: false

jobs:
  superseded:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Report a branch whose CI runs keep getting cancelled
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr || github.event.workflow_run.pull_requests[0].number }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: node tools/scripts/check-superseded-runs.mjs
