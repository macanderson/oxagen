name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  # Container jobs: see the identical block in pipeline.yml — git in the
  # bind-mounted workspace trips "dubious ownership" without this.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/macanderson/oxagen-ci-base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/pnpm-install

      - name: Build
        run: pnpm build

      - name: Publish
        if: env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          pnpm changeset publish
