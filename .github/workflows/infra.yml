# Plan every proposal, apply only what merged.
#
# A pull request assumes the read-only `gha-infra-plan` role and posts its plan
# as a comment. It cannot change anything: the role has no write permissions,
# so a plan can run automatically on a diff nobody has read yet.
#
# A push to the default branch assumes `gha-infra-apply`, which is pinned to
# the `production` environment. What that environment actually enforces is a
# deployment branch policy naming `main` alone — and deliberately no required
# reviewer, so a push to `main` applies with no human in the loop. See the note
# on the apply job for why, and how to verify both.
#
# Both roles are defined in infra/stacks-new/ci-deploy/infra-apply.tf, so this
# workflow's own permissions are reviewable in the same pull request as the
# infrastructure it changes.
#
# That also meant neither role existed until the ci-deploy stack had been
# applied once, and the job that would apply it is the one that needs the
# role — so the first apply was done by hand (infra/README.md, "Applying from
# CI"). That has happened: both roles exist in 916294258235, and the plan job
# no longer tolerates a failure to assume `gha-infra-plan`. The apply job
# still does, until one apply has been observed on `main` — see the note on
# that step.

name: infra

on:
  pull_request:
    paths: ["infra/stacks-new/**", "infra/modules/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/stacks-new/**", "infra/modules/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # required to exchange the OIDC token for a role
  pull-requests: write   # to post the plan

concurrency:
  # One apply at a time. Two concurrent applies would contend for the state
  # lock and one would fail partway, which is the worst moment to fail.
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"

jobs:
  discover:
    # Which stacks a change actually touches. Planning all five on every edit
    # would make the signal slow enough to ignore, and a stack nobody changed
    # still plans clean, so the extra runs say nothing.
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.pick.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pick
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          changed=$(git diff --name-only "$base" HEAD || true)

          # A module edit can change any stack that uses it, so widen to all.
          #
          # An edit to this workflow does the same, and used to widen to
          # nothing: `.github/workflows/infra.yml` is in the `paths` trigger
          # above, so a workflow-only change starts a run, but no path under
          # `infra/stacks-new/` changed, so `stacks` came out empty, the plan
          # matrix was empty, and `plan` was skipped. A skipped job reports
          # success, so a change to how planning works could only ever be
          # green here — including a change that broke planning outright.
          # A manual dispatch had the same hole from the other end: it carries
          # no base ref, so the fallback diffs one arbitrary commit.
          bootstrap_touched=no
          if echo "$changed" | grep -q '^infra/stacks-new/bootstrap/'; then
            bootstrap_touched=yes
          fi

          if echo "$changed" | grep -qE '^infra/modules/|^\.github/workflows/infra\.yml$' \
            || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            stacks=$(find infra/stacks-new -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          else
            stacks=$(echo "$changed" | sed -n 's#^infra/stacks-new/\([^/]*\)/.*#\1#p' | sort -u)
          fi

          # `bootstrap` is not one of the stacks CI can speak for. It creates
          # the state bucket and lock table every other stack's remote state
          # lives in, and it keeps its own state on a local backend -- so a
          # runner starts from an EMPTY state, sees all five resources as
          # absent, and plans to create the bucket and table that already
          # exist and are in use.
          #
          # That is not a hypothetical. `apply (bootstrap)` is first in the
          # matrix and the matrix is `fail-fast: true`, so its failure
          # cancelled every sibling apply: runs 34214816966 and 34215070294
          # both died on `BucketAlreadyExists` plus `ResourceInUseException:
          # Table already exists: oxagen-tflock`, and NOTHING has been applied
          # from `main` since the infrastructure moved into this repository.
          # `main` still carries an un-applied node replacement because of it.
          #
          # Its plan was the quieter half of the same bug: green, and reporting
          # five creations that must never happen.
          #
          # Dropped from both matrices until its state is remote. That is a
          # one-time hand migration -- apply once with a local backend, add the
          # `backend "s3"` block, `tofu init -migrate-state` -- after which
          # this filter and the warning below come out and the stack is
          # managed like any other. #2775 carries that work and the steps.
          stacks=$(echo "$stacks" | grep -vx 'bootstrap' || true)

          # Removing it must not turn a bootstrap-only change green by
          # accident. An empty matrix skips the job, and a skipped job reports
          # success -- the exact hole the comment above this one describes.
          if [ "$bootstrap_touched" = "yes" ]; then
            echo "::warning title=bootstrap not planned or applied::\
          infra/stacks-new/bootstrap changed. CI cannot plan or apply it: its \
          state is on a local backend, so a runner would try to re-create the \
          state bucket and lock table. Apply this stack by hand, or migrate \
          its state into S3 and take the filter out of discover."
          fi

          if [ -z "$stacks" ]; then
            echo 'stacks=[]' >> "$GITHUB_OUTPUT"
          else
            echo "stacks=$(echo "$stacks" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi
          echo "planning: ${stacks:-none}"

  plan:
    needs: discover
    if: needs.discover.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.discover.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@592200bd4b9bbf4772ace78f887668b1aee8f716 # v1.0.5
        with:
          tofu_version: 1.8.5
          # The wrapper this action installs by default swallows the one exit
          # code this workflow reads. `tofu plan -detailed-exitcode` returns 2
          # for "changes present", and the wrapper treats 2 exactly like 0:
          #
          #     if (exitCode === 0 || exitCode === 2) { return }
          #
          # so the shell always saw 0 and the plan comment below always said
          # "no changes". Every infra pull request that changed production was
          # summarised as changing nothing — including the one that added this
          # line, whose plan moved the app node's root volume from 20 GB to 50.
          # That is the surface a reviewer reads to decide whether merging
          # touches production.
          #
          # Nothing here wants the wrapper's stdout/stderr outputs; the plan is
          # read from plan.txt on disk. Without it tofu's own exit code reaches
          # the script written for it, and that script's `-eq 1` error branch
          # stops being unreachable.
          tofu_wrapper: false

      # The static checks come first and need no credentials, so a stack that
      # does not parse fails here whether or not the account is reachable.
      # `-backend=false` is what lets `init` run without the state bucket; the
      # plan below re-runs `init` with the backend once it has a role.
      - name: fmt
        working-directory: infra/stacks-new/${{ matrix.stack }}
        run: tofu fmt -check -diff .

      - name: validate
        working-directory: infra/stacks-new/${{ matrix.stack }}
        run: |
          tofu init -backend=false -input=false -no-color
          tofu validate -no-color

      # No `continue-on-error`. It was here for the bootstrap in the header —
      # the role did not exist and no pull request could create it — and
      # `gha-infra-plan` now exists in 916294258235, so the reason is spent.
      # Kept, it would mean the opposite of what it meant then: a revoked role
      # or an edited trust policy would skip the plan and report green, and a
      # plan that did not run must never read like a plan that found nothing.
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        id: credentials
        with:
          role-to-assume: arn:aws:iam::916294258235:role/gha-infra-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: init
        working-directory: infra/stacks-new/${{ matrix.stack }}
        run: tofu init -input=false -no-color

      - name: plan
        id: plan
        working-directory: infra/stacks-new/${{ matrix.stack }}
        # -detailed-exitcode: 0 no changes, 2 changes, 1 error. Without it a
        # failed plan and an empty one both exit 0 and read the same.
        run: |
          set +e
          tofu plan -input=false -no-color -lock-timeout=5m -detailed-exitcode -out=tf.plan > plan.txt 2>&1
          code=$?
          set -e
          tail -c 60000 plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 1 ] && exit 1
          exit 0

      - name: comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          STACK: ${{ matrix.stack }}
          CODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs')
            const raw = fs.readFileSync(`infra/stacks-new/${process.env.STACK}/plan.txt`, 'utf8')
            const body = raw.length > 60000 ? raw.slice(-60000) : raw
            const verdict = process.env.CODE === '2' ? 'changes' : 'no changes'
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### \`${process.env.STACK}\` — ${verdict}\n\n<details><summary>plan</summary>\n\n\`\`\`terraform\n${body}\n\`\`\`\n\n</details>`,
            })

  apply:
    needs: discover
    # `github.ref` is part of the guard, not decoration. `workflow_dispatch`
    # accepts any ref and is not a `pull_request`, so without this a dispatch
    # against any branch reached this job — and this job assumes a role with
    # AdministratorAccess and applies the Terraform from that branch.
    #
    # The `production` environment was supposed to be what stopped that. On
    # 2026-09-06 it had no protection rules and no deployment branch policy, so
    # it gated nothing and any branch could deploy to it — while the comment
    # here claimed the opposite. That is #2679, and it is now settled two ways:
    #
    #   - The environment has a deployment branch policy naming `main` alone,
    #     so the ref check below is a second line of defence rather than the
    #     only one. Verify with:
    #       gh api repos/macanderson/oxagen/environments/production/deployment-branch-policies
    #
    #   - There is deliberately NO required reviewer and no wait timer. A push
    #     to `main` applies with no human in the loop, and that is a decision
    #     rather than an omission (#2679, 2026-09-07): with no customers, the
    #     round-trip costs more than the risk it removes. Revisit it before the
    #     first paying customer, alongside the SCR-004 scope note that expires
    #     on the same event.
    #
    # Recorded here because the previous comment's failure was not being wrong
    # about a setting — it was that a control nobody had configured read as one
    # that existed, which stops anyone asking.
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && needs.discover.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    # The apply role's trust policy names this environment, so the role cannot
    # be assumed by a job that does not declare it. That half is real and is
    # what makes the `if:` above the second line of defence rather than the
    # only one.
    #
    # Both halves are checked rather than assumed (#2679):
    #   gh api repos/macanderson/oxagen/environments/production \
    #     --jq "[.protection_rules[]?.type]"   -> ["branch_policy"]
    environment: production
    strategy:
      fail-fast: true   # a later stack may depend on an earlier one
      max-parallel: 1
      matrix:
        stack: ${{ fromJSON(needs.discover.outputs.stacks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@592200bd4b9bbf4772ace78f887668b1aee8f716 # v1.0.5
        with:
          tofu_version: 1.8.5
          # Off for the reason the plan job gives, and because `tofu apply`
          # here reads its own exit code the same way with the wrapper gone:
          # 0 applied, anything else failed.
          tofu_wrapper: false

      # Still gated, unlike the plan job above, and for a reason that outlived
      # the bootstrap: this runs on `main`, so a failure here leaves the
      # default branch red, which blocks every open pull request through the
      # red-main hold. The plan job proves the OIDC provider and this
      # repository's federation work, but not this role — `gha-infra-apply`
      # is assumed under a different subject (`environment:production`), and
      # nothing has exercised it yet.
      #
      # Remove `continue-on-error` and the skip step below once one apply has
      # actually run on `main`. Until then a skip is not a pass: the step
      # writes a warning naming the stack that did not apply, so an un-applied
      # change is visible rather than silent.
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        id: credentials
        continue-on-error: true
        with:
          role-to-assume: arn:aws:iam::916294258235:role/gha-infra-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: apply skipped
        if: steps.credentials.outcome != 'success'
        run: |
          echo "::warning title=${{ matrix.stack }} not applied::\
          Could not assume gha-infra-apply, so this stack was NOT applied and \
          the account does not reflect this commit. The role is created by the \
          first apply of infra/stacks-new/ci-deploy, done by hand once -- see \
          infra/README.md. This gate clears itself once the role exists."

      - name: init
        if: steps.credentials.outcome == 'success'
        working-directory: infra/stacks-new/${{ matrix.stack }}
        run: tofu init -input=false -no-color

      - name: apply
        if: steps.credentials.outcome == 'success'
        working-directory: infra/stacks-new/${{ matrix.stack }}
        # Re-plans rather than reusing the pull request's plan file: that plan
        # was computed against a different base and the state may have moved.
        run: tofu apply -input=false -no-color -auto-approve -lock-timeout=5m
