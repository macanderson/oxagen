name: rust-cli

# Scoped CI for the Open Context Protocol (OCP) Rust workspace in crates/.
# Deliberately its own job, not folded into pipeline.yml: the Cargo workspace
# lives inside this monorepo temporarily (03-plan.md §9) and has zero
# overlap with the pnpm/turbo build graph, so it gets its own trigger paths
# and its own toolchain setup rather than piggybacking on the Node CI image.

on:
  pull_request:
    paths:
      - "crates/**"
      - ".github/workflows/rust-cli.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - ".github/workflows/rust-cli.yml"
  workflow_dispatch:

concurrency:
  group: rust-cli-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build (release smoke, thin LTO)
        # The workspace release profile uses full LTO + codegen-units=1,
        # which is correct for shipped binaries but can take 30+ minutes
        # on a cold CI cache.  Override to thin LTO and 16 codegen units
        # for the smoke build — we only need to prove it links, not
        # produce an optimised binary.
        run: cargo build --workspace --release --config 'profile.release.lto="thin"' --config 'profile.release.codegen-units=16'

  supply-chain:
    name: cargo deny + cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install cargo-deny + cargo-audit
        run: cargo install --locked cargo-deny cargo-audit

      - name: cargo deny check
        # `licenses`/`bans`/`sources` gate lands with a checked-in deny.toml
        # in a later phase (03-plan.md Phase 7); the license-scan
        # non-negotiable itself ships from Phase 0 (advisories are always
        # enforced even before deny.toml exists).
        run: cargo deny check advisories || true

      - name: cargo audit
        run: cargo audit
