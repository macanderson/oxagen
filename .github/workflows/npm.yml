name: npm

# Publishes @oxagen/cli to npm (ADR-253). Three things start it:
#
#   A production deploy. `publish-cli` in pipeline.yml dispatches this
#   workflow with the deployed commit once every `deploy-node` leg has
#   shipped, so the CLI on npm never runs ahead of the API it talks to. A
#   commit after release X.Y.Z publishes as `X.Y.(Z+1)-N`, where N counts the
#   commits since the release. The desktop build of the same commit carries
#   the same number (ADR-158). The release commit itself publishes as X.Y.Z.
#
#   A release tag. The `vX.Y.Z` tag release.yml pushes publishes X.Y.Z, so a
#   release reaches npm even when its own deploy was superseded.
#
#   The daily schedule. It publishes the commit production's API runs when
#   npm is behind it. That covers a deploy whose dispatch was replaced by a
#   newer one, a failed run, and the first day after NPM_TOKEN is replaced.
#
# Every version publishes under `latest`, and `latest` only moves forward:
# tools/scripts/lib/npm-cli.ts skips a version older than the newest one on
# npm. So `npm i -g @oxagen/cli` installs what production runs.
#
# NPM_TOKEN is a granular npm token that can write @oxagen/cli. npm lets such
# a token live 90 days at most, and packages/config/src/ci-registry.ts says how
# to replace it. A run that fails here does not turn main red, because only
# Mac can replace the token, and a red main sends every agent to repair it.

on:
  push:
    tags:
      - "v*.*.*"
  schedule:
    - cron: "10 8 * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on main to publish (default: the head of the ref this runs on)"
        type: string
        default: ""

permissions:
  contents: read

# Deploy dispatches share one group without cancelling: one publishes, the
# newest waits, and a newer deploy replaces a waiting one, so a burst of
# merges ends with the tip published (the #2730 lesson). A release tag, the
# schedule and a dispatch by hand each get a group of their own, so a deploy
# can never evict a release. Two runs that publish at once are safe: the
# script moves `latest` back to the newest version after each publish.
concurrency:
  group: >-
    npm-${{
      github.event_name == 'workflow_dispatch' && inputs.sha != ''
        && 'deploy' || github.run_id
    }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @oxagen/cli
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The schedule reads which commit production's API runs.
      deployments: read
    steps:
      # check-deploy-tip.mjs records each service's live commit as a
      # production deployment. The CLI talks to the API, so the schedule
      # publishes the commit the API runs.
      - name: Find the commit production's API runs
        id: target
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&task=deploy:api&per_page=1" --jq '.[0].sha // ""')
          if [ -z "$sha" ]; then
            echo "::error::No production deployment of the API is recorded, so the commit to publish is unknown. Dispatch this workflow with a sha to publish one by hand."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.sha || inputs.sha || github.sha }}
          fetch-depth: 0

      # npm serves every installer of the CLI, so it publishes only what main
      # carries. A commit from before this workflow existed has no publish
      # script; the next deploy publishes a newer one.
      - name: Check the commit
        id: commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse HEAD) is not on main. npm publishes only what main carries."
            exit 1
          fi
          if [ ! -f tools/scripts/publish-cli-npm.ts ]; then
            echo "::notice::$(git rev-parse --short HEAD) is older than the npm publish script, so this run publishes nothing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/pnpm-install
        if: steps.commit.outputs.publish == 'true'

      # `plan` answers an empty version and the release number for the
      # release commit, and `X.Y.(Z+1)-N` for any later commit. A build's
      # number is stamped into every manifest, so the bundle and
      # `oxagen --version` report it. The stamp is never committed.
      - name: Choose the version
        id: plan
        if: steps.commit.outputs.publish == 'true'
        run: |
          set -euo pipefail
          GITHUB_OUTPUT="" pnpm exec tsx tools/scripts/desktop-build-version.ts plan | tee plan.txt
          version="$(sed -n 's/^version=//p' plan.txt)"
          if [ -n "$version" ]; then
            pnpm exec tsx tools/scripts/desktop-build-version.ts stamp "$version"
          else
            version="$(sed -n 's/^release=//p' plan.txt)"
          fi
          if [ -z "$version" ]; then
            echo "::error::desktop-build-version.ts plan named no version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.commit.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          pnpm exec tsx tools/scripts/publish-cli-npm.ts "$VERSION" --verify
          latest="$(npm view @oxagen/cli dist-tags.latest --prefer-online)"
          echo "npm's latest @oxagen/cli is $latest. This run was asked for $VERSION." >> "$GITHUB_STEP_SUMMARY"
