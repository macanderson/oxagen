# DoD merge check (oxagen #1321) — SCR-003 enforcement.
#
# SCR-003: an issue closes only when every definition-of-done item is satisfied
# and verified. The task issue template makes a DoD exist; this check makes it
# binding. Two halves:
#
#   1. A pull request must link the issue it closes (escape hatch: the
#      `no-issue` label, for genuinely trivial changes).
#   2. Every linked issue's DoD checklist must be fully ticked before the PR
#      can merge — which is what stops the close from happening early.
#
# ## Why this is a reusable workflow rather than five copies
#
# SCR-003 applies in all five org repos. Copying this file into each would put
# five drifting implementations of a rule whose sibling check (scr-corpus-check)
# exists to police drift. Instead this is a `workflow_call` workflow living once
# in oxagen; the other four repos carry a ~12-line caller. All five repos are
# public, so `uses: macanderson/oxagen/.github/workflows/dod-check.yml@main`
# resolves with no extra credentials. See ADR-039.
#
# ## Why the check runs on the PR, not on the close
#
# GitHub closes an issue the instant a PR containing `Closes #N` merges, and no
# webhook can veto that — an `issues: closed` handler only ever arrives after
# the fact. Gating the PR inverts the ordering: unchecked boxes fail a required
# check, the merge is blocked, and the premature close never happens. The
# `issues: closed` safety net for hand-closed issues lives in dod-close-guard.yml.
name: dod-check

on:
  workflow_call: {}
  # oxagen runs the check on its own PRs through the same file it exports, so
  # this implementation can never be stale relative to the callers'.
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: read

# One verdict per pull request at a time. Several of this workflow's triggers
# fire within seconds of each other — automation that opens a PR and labels it,
# or a push landing on top of an edit — and two runs then race to publish a
# status under one check name, where the loser is whichever finishes first
# rather than whichever read the newer state.
#
# Cancelling the older run is the cheap half. The live PR read in the job below
# is what makes the outcome correct, because a cancellation can arrive too late
# to stop a run that has already reported. Keyed by repository as well as PR
# number: this workflow is called by four other repos through `workflow_call`,
# and their PR numbers collide with each other's and with oxagen's.
concurrency:
  group: dod-check-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A reusable workflow's steps run against the *caller's* repository, so
      # the checker module is not present in the four consumer repos. Fetch it
      # from oxagen explicitly.
      #
      # The ref is the whole subtlety. When oxagen runs this check on its own
      # pull request, `github.sha` is that pull request's merge commit and the
      # module travels in it, so the workflow and the logic it drives are read
      # from one tree. Pinning `main` here instead made the check unsatisfiable
      # by the pull request that introduced it: the module does not reach main
      # until that merge, so every run could only fail with
      # ERR_MODULE_NOT_FOUND (#1323). Elsewhere `github.repository` is the
      # calling repo, `github.sha` is a commit oxagen does not have, and main
      # is both correct and the only ref a caller can rely on.
      - name: Fetch the SCR tooling
        uses: actions/checkout@v5
        with:
          repository: macanderson/oxagen
          ref: ${{ github.repository == 'macanderson/oxagen' && github.sha || 'main' }}
          path: .scr-tools
          sparse-checkout: tools/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify the definition of done
        uses: actions/github-script@v7
        with:
          script: |
            const { linkedIssues, verdict, formatVerdict } = await import(
              `${process.env.GITHUB_WORKSPACE}/.scr-tools/tools/scripts/scr-dod-check.mjs`)

            // Read the pull request live rather than from the event payload.
            //
            // A payload is a snapshot taken when the event fired, and two
            // events on one head routinely disagree about the PR. Release
            // automation opens a PR and labels it moments later, so the
            // `opened` payload carries no labels at all: stella#5792 was opened
            // at 18:29:40, labelled `no-issue` at 18:29:43, and its two runs
            // reached opposite verdicts on the same commit. The stale one
            // queued longer and finished last, so `dod / dod` read red on a PR
            // that plainly carried the waiver, over a sticky comment asking for
            // the label it already had.
            //
            // The issue half below has always read live (`issues.get`), which
            // is why ticking a DoD box takes effect with no new event. This
            // makes both halves agree on where truth lives. Ordering then stops
            // mattering: whichever run publishes last read the same PR.
            //
            // The payload is the fallback, not the source: if this read fails
            // the check still runs on what the event carried rather than
            // erroring out, since a transient API failure must not be able to
            // block a merge.
            const payloadPr = context.payload.pull_request
            let pr = payloadPr
            try {
              const { data } = await github.rest.pulls.get({
                ...context.repo, pull_number: payloadPr.number })
              pr = data
            } catch (error) {
              core.warning(
                `Could not re-read the pull request, falling back to the event ` +
                `payload: ${error.message}`)
            }
            const labels = (pr.labels ?? []).map(l => (typeof l === 'string' ? l : l.name))

            // Resolve each linked issue's body. A reference to an issue that
            // does not exist, or that lives somewhere unreadable, is reported
            // as a failure rather than skipped — a typo'd `Closes #13221`
            // must not read as "no DoD problems found".
            const issues = []
            for (const link of linkedIssues(pr.body)) {
              const owner = link.owner ?? context.repo.owner
              const repo = link.repo ?? context.repo.repo
              const ref = `${owner}/${repo}#${link.number}`
              try {
                const { data } = await github.rest.issues.get({
                  owner, repo, issue_number: link.number })
                // A PR is an issue to this endpoint; a PR "closing" a PR is a
                // stacked branch, not a DoD claim, so it carries no checklist.
                if (data.pull_request) continue
                issues.push({ ref, body: data.body })
              } catch (error) {
                issues.push({ ref, body: null })
                core.warning(`Could not read ${ref}: ${error.message}`)
              }
            }

            const result = verdict({ body: pr.body, labels }, issues)
            const summary = formatVerdict(result)
            core.summary.addRaw(summary).write()

            // One sticky comment, edited in place. A fresh comment per push
            // would bury the PR under a running commentary of a checklist the
            // author is actively ticking.
            const MARKER = '<!-- scr-dod-check -->'
            const body = `${MARKER}\n${summary}`
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr.number, per_page: 100 })
            const mine = comments.find(c => c.body?.startsWith(MARKER))
            if (mine) {
              if (mine.body !== body) {
                await github.rest.issues.updateComment({
                  ...context.repo, comment_id: mine.id, body })
              }
            } else if (!result.ok) {
              // Stay silent while passing: a green check needs no comment, and
              // an unconditional "all good" note on every PR is noise.
              await github.rest.issues.createComment({
                ...context.repo, issue_number: pr.number, body })
            }

            if (!result.ok) core.setFailed(summary)
