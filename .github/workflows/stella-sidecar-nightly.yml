name: stella-sidecar-nightly

# Nightly drift check for oxagen #1081: runs the exact same sidecar-transport
# smoke test (packages/stella-engine-client/src/stella-serve.smoke.test.ts)
# against stella's `latest` GitHub release instead of the pinned version in
# sidecar.config.json. Stella releases daily (docs/adr/ADR-033-stella-engine-core.md);
# the pinned-version job in stella-sidecar.yml only runs on PRs that touch the
# sidecar package, so it cannot see a wire-contract rename that ships in an
# unrelated stella release between oxagen changes. This job closes that gap
# by catching upstream drift within a day, independent of oxagen activity.
#
# A red run here means: stella changed something the sidecar transport
# depends on. It does NOT mean oxagen's pinned integration is broken — that
# is exactly the point of keeping the pin and the drift check separate.

on:
  schedule: [{ cron: "0 9 * * *" }]
  workflow_dispatch: {}

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/pnpm-install

      - name: Install stella (latest release)
        run: |
          set -euo pipefail
          LATEST="$(curl -fsSL https://api.github.com/repos/macanderson/stella/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')"
          echo "Latest stella release: $LATEST"
          curl -fsSL "https://github.com/macanderson/stella/releases/download/v${LATEST}/stella-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/stella.tar.gz || {
              echo "::warning::could not download stella latest (v${LATEST}) release asset — smoke test will SKIP, not fail";
              exit 0;
            }
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/stella.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sidecar transport smoke test (against stella latest)
        working-directory: packages/stella-engine-client
        run: pnpm vitest run src/stella-serve.smoke.test.ts

      - name: File a Linear ticket on drift
        if: failure()
        continue-on-error: true
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_PROJECT_ID: ${{ vars.LINEAR_PROJECT_ID || 'oxagen-v2-355ea6b2a3f7' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "stella latest drift detected — see run $GITHUB_RUN_ID. Wire manual ticket filing here if/when a scripted filer exists for this workflow (see tools/scripts/oxagen-run-wrapup-reminder.sh for the pattern used elsewhere)."
