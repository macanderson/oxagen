# Fail CI when this repo's copies of the brand kit fall behind the kit.
#
# oxageninc/brand is the one source for every colour, face, mark, and
# icon Oxagen and Stella ship. tools/scripts/sync-brand-assets.mjs copies the
# files this repo uses byte for byte, and its --check lists every file that
# differs, is missing, or should not be here. This job runs that check
# against the kit's main branch, never a pinned commit, so a kit change turns
# this repo red until the sync lands (#4804). The kit's fan-out workflow opens
# that sync PR after each kit merge.
#
# The check also runs the literal guard (tools/scripts/lib/brand-literals.mjs):
# each stylesheet it lists takes its corners, shadows, font sizes, and page wrap
# from the kit's tokens, so a theme change in the kit reaches every site with no
# hand edit (oxageninc/brand#63). It reads the classes in the docs chrome's
# markup the same way. A literal is reported under its file's path, so the pull
# request rule below fails only the pull request that touches that file.
#
# The main ruleset requires this job, `Brand drift`, on every pull request
# (Mac, 2026-10-02, #5131). So the workflow takes no `paths` filter and the job
# takes no `if:`: a required check that never runs blocks the merge for good.
# The pull request rule below keeps the gate from failing every pull request
# after a kit merge, which is what took the blocking check offline in #4938.
#
# The same command runs in pipeline.yml's checks job as an advisory step with
# no scoping, so the two cannot disagree. This file is the one the kit's
# conformance check looks for, and its daily run catches a kit change on a day
# with no push here.
#
# The kit is a public repository, so the checkout needs no token. The check
# needs Node alone: no pnpm install, no rsvg-convert.
name: brand-drift

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brand-drift:
    name: Brand drift
    runs-on: ${{ vars.CI_RUNNERS == 'aws' && format('oxagen-small-{0}', vars.CI_RUNNER_ARCH || 'x64') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check out the brand kit
        uses: actions/checkout@v5
        with:
          repository: oxageninc/brand
          ref: main
          path: .brand-kit
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Brand files match the kit
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if out=$(node tools/scripts/sync-brand-assets.mjs --brand .brand-kit --check 2>&1); then echo "$out"; exit 0; fi
          echo "$out"
          # Drift fails a push to main, the daily run, and a manual run. A pull request fails only
          # when it changes a file that differs from the kit or holds a literal, the sync script,
          # the literal guard, or this workflow.
          # Any other pull request passes with a warning: a kit change is not that pull request's
          # doing, and the kit's fan-out opens the sync pull request that fixes it
          # (oxageninc/brand#53).
          if [ "$EVENT" = pull_request ]; then
            flat=" $(printf '%s' "$out" | tr '\n\t' '  ') "
            touched=""
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in tools/scripts/sync-brand-assets.mjs|tools/scripts/lib/brand-literals.mjs|.github/workflows/brand-drift.yml) touched="$f"; break ;; esac
              case "$flat" in *" $f "*) touched="$f"; break ;; esac
            done < <(git diff --name-only HEAD^1 HEAD)
            if [ -z "$touched" ]; then
              echo "::warning::The brand files here differ from oxageninc/brand main. This pull request changes none of them, so the check passes. The kit's fan-out opens the sync pull request."
              exit 0
            fi
            echo "::error::This pull request changes $touched, and the brand files differ from oxageninc/brand main."
          fi
          echo "::error::Run node tools/scripts/sync-brand-assets.mjs --brand <oxageninc/brand checkout> and commit the result. If the desktop icons are stale, also run pnpm --filter @oxagen/desktop icons. For a literal, write the token its line names, or keep it in KEEP in tools/scripts/lib/brand-literals.mjs with its reason."
          exit 1
