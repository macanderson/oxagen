name: Task
description: A unit of work with an explicit definition of done, such as an improvement, a defect the PR could not carry, or a chore
body:
  - type: markdown
    attributes:
      value: |
        File the issue complete. Title it `<Priority> <Tier> <Size> <Kind> (<Area>): <Statement>`. Apply one priority label, one `MODEL:` tier, one `SIZE:`, one `KIND:` (`BUG`, `FEATURE`, `IMPROVEMENT`, `CHORE`, `DOCUMENTATION`, or `DEVOPS`), and one `AREA:`, then `JOB:`, `PILLAR:`, and `NEEDS:DECISION` or `NEEDS:RIG` where they apply. Set the issue type to the kind, and set the Priority, Model Tier, Minutes Estimated, and Area(s) fields. Apply `MIGRATION-REQUIRED` once you know the work changes a schema. CLAUDE.md has the rules under Issue titles and Oxagen issue fields, and `/triage-issues` has the tier, size, kind, and area tables.

        Fix over file (SCR-004): a defect noticed during a task is fixed in that task's PR. File only when the fix needs a maintainer decision, a rig, a credential or real spend, or is larger than one session, and say which. One issue carries the full weight of the change; use checklist items in the definition of done rather than sub-issues.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this exists; link the origin task, spec section or mockup route. Name the file paths, how to reproduce, the constraints already found, and which SCR-004 case stopped the fix riding a PR.
    validations:
      required: true
  - type: dropdown
    id: pillar
    attributes:
      label: Pillar this moves
      description: An issue earns its place only if fixing it moves at least one (SCR-004).
      multiple: true
      options:
        - stability
        - reliability
        - maintainability
        - innovation
        - efficiency
        - performance
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of done
      description: Checklist the closer must verify line-by-line (SCR-003). Every part of the change (backend, surface, UI, tests, and docs) is an item here.
      # No "CI green" item (#4200). Branch protection already blocks a merge
      # while CI is red. The `dod` check is part of CI, so a box about CI can
      # never be ticked while `dod` reads it. `scr-dod-check.mjs` in
      # oxageninc/.github skips one if an issue still carries it.
      value: |
        - [ ] Implementation complete
        - [ ] Scoped tests added/updated and passing
        - [ ] Code comments and docs updated
        - [ ] Residue fixed in the same PR, or filed as a complete issue
    validations:
      required: true
