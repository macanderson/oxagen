name: Task
description: A unit of work with an explicit definition of done — a gap, a defect the PR could not carry, or debt
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        Creators apply exactly one label, `triage` (SCR-005). The triage pass replaces it with one priority label and the descriptive dimensions: one `kind:*` (`defect`, `gap`, `feature`, `debt`), one `size/*`, one `area:*`, one `job:*`, one or two `pillar:*`, and `needs:decision` or `needs:rig` when SCR-004's deferral cases apply. Do not add those yourself. Title it `Queued <Kind> (<Area>): <statement>` (see `/triage-issues`).

        Fix over file (SCR-004): a defect noticed during a task is fixed in that task's PR. File only when the fix needs a maintainer decision, a rig, a credential or real spend, or is larger than one session — and say which. One issue carries the full weight of the change; use checklist items in the definition of done rather than sub-issues.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this exists; link the origin task, spec section or mockup route. Name the file paths, how to reproduce, the constraints already found, and which SCR-004 case stopped the fix riding a PR.
    validations:
      required: true
  - type: dropdown
    id: pillar
    attributes:
      label: Pillar this moves
      description: An issue earns its place only if fixing it moves at least one (SCR-004).
      multiple: true
      options:
        - stability
        - reliability
        - maintainability
        - innovation
        - efficiency
        - performance
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of done
      description: Checklist the closer must verify line-by-line (SCR-003). Every part of the change — backend, surface, UI, tests, docs — is an item here.
      value: |
        - [ ] Implementation complete
        - [ ] Scoped tests added/updated and passing
        - [ ] Full CI green
        - [ ] Code comments and docs updated
        - [ ] Residue fixed in the same PR, or filed with the `triage` label only
    validations:
      required: true
