name: Feature request
description: Propose a new capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is painful?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Oxagen do? If this is a new user-facing action, remember it ships as a typed capability with API/MCP/CLI/UI parity.
    validations:
      required: true
  - type: textarea
    id: vision
    attributes:
      label: Vision alignment
      description: How does this help a team that builds and resells AI agents meter, govern, ground, or bill their product? (See docs/VISION.md — feature work is judged against the wedge.)
