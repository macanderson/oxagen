name: Bug report
description: Something that exists behaves wrongly (KIND:BUG)
# The form sets the kind twice over, as the issue type and as its label. The creator still
# applies the priority, tier, size, and domain labels and fills the filing fields.
type: Bug
labels: ["KIND:BUG"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities must NOT be reported here.** Use [private vulnerability reporting](https://github.com/oxageninc/product/security/advisories/new) or `security@oxagen.sh` (see SECURITY.md).

        File the issue complete. Title it `<Priority> <Tier> <Size> Bug (<Domain>): <what goes wrong>` in plain words. Apply one priority label, one `MODEL:` tier, one `SIZE:`, `KIND:BUG`, and one `DOMAIN:`, then `JOB:` and one or two `PILLAR:` labels where they apply. Set the issue type to Bug, and set the Priority, Model Tier, Minutes Estimated, and Area(s) fields. Apply `MIGRATION-REQUIRED` once you know the work changes a schema. CLAUDE.md has the rules under Issue titles and Oxagen issue fields.

        Before filing: if you can fix it in the branch you are on, fix it there (SCR-004). File only when the fix needs a maintainer decision, a rig, a credential or real spend, or is larger than one session.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Where does the defect occur?
      options:
        - Web app (app.oxagen.sh / apps/app)
        - API (api.oxagen.sh / apps/api)
        - MCP server (mcp.oxagen.sh / apps/mcp)
        - CLI (oxagen)
        - Docs (docs.oxagen.sh / apps/docs)
        - Ingestion / connectors
        - Billing / metering
        - Knowledge graph / ontology
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Name the file paths and how to reproduce.
      placeholder: Steps to reproduce, expected behavior, actual behavior, file:line.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, `oxagen --version` (for CLI), browser (for web app).
      placeholder: |
        macOS 15.5 · Node 24.1 · oxagen 2.4.10
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: For CLI issues, `OXAGEN_CLI_DEBUG=1` + `oxagen logs` excerpts help. Redact anything sensitive.
      render: shell
  - type: textarea
    id: dod
    attributes:
      label: Definition of done
      description: Checklist the closer must verify line-by-line (SCR-003). One issue carries the whole fix; add items rather than filing sub-issues.
      # No "CI green" item (#4200). Branch protection already blocks a merge
      # while CI is red. The `dod` check is part of CI, so a box about CI can
      # never be ticked while `dod` reads it. `scr-dod-check.mjs` skips one if
      # an issue still carries it.
      value: |
        - [ ] Defect fixed at the named path; the repro no longer reproduces
        - [ ] Scoped tests added/updated and passing
        - [ ] Code comments and docs updated
        - [ ] Residue fixed in the same PR, or filed as a complete issue
    validations:
      required: true
