pre-commit:
  parallel: true
  commands:
    atlas-validate:
      # Only run when migration files are staged — avoids the overhead on
      # every commit. Catches stale atlas.sum before it reaches CI.
      glob: "packages/database/atlas/migrations/**"
      run: cd packages/database && atlas migrate validate --dir "file://atlas/migrations"

    # Lint staged TS/JS, auto-fix, and re-stage the fixes.
    # docs/, .agents/, and .claude/ are excluded (docs + agent/skill assets
    # are not part of the typed source tree).
    #
    # ADR-015: Biome is installed as the formatter and `pnpm format` is wired,
    # but the pre-commit Biome-format step is intentionally NOT enabled yet — it
    # must follow the one-shot `pnpm format` sweep (a coordinated, isolated commit
    # in a quiet window) so unrelated PRs don't each carry whole-file reformatting.
    # Until then pre-commit stays ESLint-only; pre-push already moved to the
    # import-graph test selection below.
    lint:
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts}"
      exclude:
        - "docs/**"
        - ".agents/**"
        - ".claude/**"
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    # Typecheck the monorepo, but only when non-excluded TS/JS is staged.
    # (pnpm typecheck is whole-repo; the glob/exclude just gates whether it runs.)
    typecheck:
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts}"
      exclude:
        - "docs/**"
        - ".agents/**"
        - ".claude/**"
        - "scripts/**"
      run: pnpm typecheck

# pre-push is the test gate for direct-to-main: this repo pushes straight to
# main (no PR), and CI on a push is post-hoc — it can flag a red main but can't
# stop the commit from landing. pre-commit already covers lint + typecheck, so
# pre-push covers what it can't: the test suite plus the contract/env integrity
# checks that have repeatedly broken CI when skipped. All three were chosen
# because they are fast and high-signal; the full build/migrate gate stays in CI.
pre-push:
  parallel: true
  commands:
    # Contract definitions must stay internally consistent (manifest parity is
    # warn-only in CI; this is the hard check).
    contracts:
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts}"
      exclude:
        - "docs/**"
        - ".agents/**"
        - ".claude/**"
        - "scripts/**"
      run: pnpm check:contracts

    # Registered env vars must validate against the schema — an unregistered var
    # (NEXT_PUBLIC_DOCS_URL, OXAGEN_LOCAL_DEV, …) silently red-jobs the CI gate.
    env-check:
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts}"
      exclude:
        - "docs/**"
        - ".agents/**"
        - ".claude/**"
        - "scripts/**"
      run: pnpm env:check

    # Import-graph-scoped tests (ADR-015): run only the suites whose module-import
    # edges reach a file changed since origin/main. Vitest's `--changed` walks the
    # module graph to select affected tests — replacing the blunt turbo
    # `...[origin/main]` dependency-closure fan-out that herded every core when
    # several sessions pushed at once. CI still runs the full fan-out as the
    # authoritative gate; this hook is fast, local, related-only feedback.
    test-related:
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts}"
      exclude:
        - "docs/**"
        - ".agents/**"
        - ".claude/**"
        - "scripts/**"
      run: pnpm exec vitest run --changed origin/main --passWithNoTests
