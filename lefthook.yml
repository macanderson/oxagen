pre-commit:
  parallel: true
  commands:
    atlas-validate:
      # Only run when migration files are staged — avoids the overhead on
      # every commit. Catches stale atlas.sum before it reaches CI.
      glob: "packages/database/atlas/migrations/**"
      run: cd packages/database && atlas migrate validate --dir "file://atlas/migrations"

    # Lint staged TS/JS, auto-fix, and re-stage the fixes.
    # docs/, .agents/, and .claude/ are excluded (docs + agent/skill assets
    # are not part of the typed source tree).
    #
    # ADR-015: Biome is installed as the formatter and `pnpm format` is wired,
    # but the pre-commit Biome-format step is intentionally NOT enabled yet — it
    # must follow the one-shot `pnpm format` sweep (a coordinated, isolated commit
    # in a quiet window) so unrelated PRs don't each carry whole-file reformatting.
    # Until then pre-commit stays ESLint-only. Test suites run in CI, not in any
    # git hook (see the pre-push note below).
    lint:
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts}"
      exclude:
        - "docs/**"
        - ".agents/**"
        - ".claude/**"
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    # Typecheck ONLY the staged files, never the whole repo. The wrapper groups
    # the changed files by their owning package tsconfig and runs `tsc-files`
    # per group, so tsc loads only those files plus their import closure — fast,
    # local feedback. The authoritative affected-package typecheck runs in CI
    # (`turbo run typecheck --filter=...[origin/main]`).
    typecheck:
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts}"
      exclude:
        - "docs/**"
        - ".agents/**"
        - ".claude/**"
        - "scripts/**"
      run: node tools/scripts/typecheck-staged.mjs {staged_files}

# pre-push stays light. The unit-test and e2e suites are NOT run here — they run
# in CI on every pull request and on push to `main` (see .github/workflows/
# pipeline.yml: `test` and `e2e` jobs, affected-only). Keeping heavy suites out
# of the push hook is deliberate: stacked vitest/playwright herds from parallel
# sessions could saturate the machine. pre-push keeps only the two fast,
# high-signal integrity checks that have repeatedly broken CI when skipped —
# contract consistency and env-schema validation. No test runner, no full build.
pre-push:
  parallel: true
  commands:
    # Contract definitions must stay internally consistent (manifest parity is
    # warn-only in CI; this is the hard check).
    contracts:
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts}"
      exclude:
        - "docs/**"
        - ".agents/**"
        - ".claude/**"
        - "scripts/**"
      run: pnpm check:contracts

    # Registered env vars must validate against the schema — an unregistered var
    # (NEXT_PUBLIC_DOCS_URL, OXAGEN_LOCAL_DEV, …) silently red-jobs the CI gate.
    env-check:
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts}"
      exclude:
        - "docs/**"
        - ".agents/**"
        - ".claude/**"
        - "scripts/**"
      run: pnpm env:check
