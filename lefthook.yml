pre-commit:
  parallel: true
  commands:
    atlas-validate:
      # Only run when migration files are staged — avoids the overhead on
      # every commit. Catches stale atlas.sum before it reaches CI.
      glob: "packages/database/atlas/migrations/**"
      run: cd packages/database && atlas migrate validate --dir "file://atlas/migrations"

    # Format staged TS/TSX/JS/JSON files with Biome (the sole formatter — see
    # ADR-015) and re-stage the result. Scoped to staged files only — this is
    # NOT the one-shot repo-wide `pnpm format` sweep ADR-015 still calls for
    # before Biome is made a hard gate; it just keeps new changes formatted
    # going forward without reformatting whole files on unrelated PRs.
    # --no-errors-on-unmatched: a commit whose only staged match is a file
    # biome.json ignores (packages/database/storage-manifest.json, which
    # `pnpm schema:manifest` regenerates and CI requires committed) is not a
    # formatting failure; without the flag Biome exits 1 on "no files were
    # processed" and the commit is refused.
    format:
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts,json,jsonc}"
      exclude:
        - "docs/**"
        - ".agents/**"
        - ".claude/**"
      # --no-errors-on-unmatched: this glob can match only files biome.json
      # excludes (generated JSON such as packages/database/storage-manifest.json),
      # and Biome then exits non-zero on "no files were processed", failing the
      # commit over nothing to format. The lint step below carries the same
      # guard as --no-warn-ignored.
      run: pnpm exec biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # Lint staged TS/JS, auto-fix, and re-stage the fixes.
    # docs/, .agents/, and .claude/ are excluded (docs + agent/skill assets
    # are not part of the typed source tree).
    #
    # ADR-015: Biome (above) now covers pre-commit formatting on staged files;
    # a full-repo `pnpm format` sweep is still pending before Biome becomes a
    # hard CI gate. Test suites run in CI, not in any git hook (see the
    # pre-push note below).
    lint:
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts}"
      exclude:
        - "docs/**"
        - ".agents/**"
        - ".claude/**"
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    # The root config ignores apps/app, apps/app_deprecated and apps/docs,
    # because each lints with its own eslint.config.mjs. The command above
    # therefore skipped every file in them, and --no-warn-ignored hid the skip,
    # so a commit there reported lint passed having checked nothing. #4066
    # reached CI with four lint errors that way. Each app gets its own command,
    # run from the app's directory so ESLint finds that app's config, with the
    # warning limit that app's own `lint` script sets.
    lint-app:
      root: "apps/app/"
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts}"
      run: pnpm exec eslint --fix --no-warn-ignored --max-warnings 0 {staged_files}
      stage_fixed: true
    lint-app-deprecated:
      root: "apps/app_deprecated/"
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts}"
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true
    lint-docs:
      root: "apps/docs/"
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts}"
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    # Typecheck ONLY the staged files, never the whole repo. The wrapper groups
    # the changed files by their owning package tsconfig and runs `tsc-files`
    # per group, so tsc loads only those files plus their import closure — fast,
    # local feedback. The authoritative affected-package typecheck runs in CI
    # (`turbo run typecheck --filter=...[origin/main]`).
    typecheck:
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts}"
      exclude:
        - "docs/**"
        - ".agents/**"
        - ".claude/**"
        - "scripts/**"
      run: node tools/scripts/typecheck-staged.mjs {staged_files}

# pre-push stays light. The unit-test and e2e suites are NOT run here — they run
# in CI on every pull request and on push to `main` (see .github/workflows/
# pipeline.yml: `test` and `e2e` jobs, affected-only). Keeping heavy suites out
# of the push hook is deliberate: stacked vitest/playwright herds from parallel
# sessions could saturate the machine. pre-push keeps only the two fast,
# high-signal integrity checks that have repeatedly broken CI when skipped —
# contract consistency and env-schema validation. No test runner, no full build.
pre-push:
  parallel: true
  commands:
    # Contract definitions must stay internally consistent (manifest parity is
    # warn-only in CI; this is the hard check).
    contracts:
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts}"
      exclude:
        - "docs/**"
        - ".agents/**"
        - ".claude/**"
        - "scripts/**"
      run: pnpm check:contracts

    # src/i18n/messages.d.ts is GENERATED from messages/*.json and is what types
    # every t() key. A catalogue that gains or renames a key without the file
    # being regenerated leaves the two disagreeing, and tsc believes the file —
    # so the error surfaces as `Argument of type '"someKey"' is not assignable to
    # NamespacedMessageKeys<…>` on a key the catalogue plainly holds. That broke
    # CI three times on 2026-09-19 alone, each time a red run and a round trip
    # for one regenerated file. The staged typecheck does not catch it, because
    # the stale declaration is consistent with itself. Fixed by running the
    # generator's own check here, where it costs seconds.
    app-messages:
      glob: "apps/app/{messages/*.json,src/i18n/messages.d.ts,src/**/*.tsx,src/**/*.ts}"
      run: pnpm --filter @oxagen/app check:messages

    # The house prose rules for the two customer-facing sites: no em dash, no
    # exclamation point, no avoid-list word, no retired positioning line. This
    # ran nowhere for as long as it existed, while three files of contributor
    # docs said CI enforced it, so apps/web/read/index.html reached main with
    # seven em dashes. It is a gate in CI now; catching it here saves the round
    # trip, and it reads only the two sites it scans.
    prose:
      # Kept broad on purpose: the script decides what it scans, and a glob
      # carrying the literal parentheses of apps/docs/src/app/(home) is a bet on
      # the matcher's escaping that a hook should not make.
      glob: "apps/{web,docs}/**"
      run: pnpm check:prose

    # Registered env vars must validate against the schema — an unregistered var
    # (NEXT_PUBLIC_DOCS_URL, OXAGEN_LOCAL_DEV, …) silently red-jobs the CI gate.
    env-check:
      glob: "*.{ts,tsx,js,jsx,mjs,mts,cts}"
      exclude:
        - "docs/**"
        - ".agents/**"
        - ".claude/**"
        - "scripts/**"
      run: pnpm env:check

    # The vendored Context Graph Protocol conformance fixtures are a pinned,
    # byte-for-byte mirror of the canonical upstream (ADR-035). An unenforced
    # mirror silently diverges — the exact failure #1082 describes — so any edit
    # to the fixtures, their manifest, or the frozen-digest check must re-run the
    # offline drift check. Set CONTEXT_GRAPH_PROTOCOL_DIR to upgrade to full
    # byte-parity against a local canonical checkout.
    contextgraph-fixtures:
      glob:
        - "packages/run-evidence/fixtures/contextgraph/**"
        - "tools/scripts/check-contextgraph-fixtures.ts"
      run: pnpm check:contextgraph-fixtures
