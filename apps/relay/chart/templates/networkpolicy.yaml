{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oxagen-relay.fullname" . }}
  labels:
    {{- include "oxagen-relay.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "oxagen-relay.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # No ingress rules: the relay accepts no inbound connection.
  ingress: []
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
