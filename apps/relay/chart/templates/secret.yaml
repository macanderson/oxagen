{{- if and .Values.token.value (not .Values.token.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oxagen-relay.tokenSecretName" . }}
  labels:
    {{- include "oxagen-relay.labels" . | nindent 4 }}
type: Opaque
data:
  RELAY_TOKEN: {{ .Values.token.value | b64enc | quote }}
{{- end }}
