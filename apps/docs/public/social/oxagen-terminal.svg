<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Oxagen CLI building a feature — animated terminal">
  <title>Oxagen — animated terminal building a feature</title>
  <desc>An animated recreation of the Oxagen CLI terminal UI: the OXAGEN pixel logo, a running turn, a completed task card, live token/tool/repo footer panels. Adapts to light and dark colour schemes and honours reduced-motion.</desc>

  <style>
    /* ---- palette sampled directly from the provided screenshot (dark) ---- */
    :root {
      --bg:        #0d0d0d;   /* terminal background            */
      --panelbg:   #121212;   /* footer / card fill             */
      --tabbg:     #202020;   /* active tab pill                */
      --tabbar:    #161616;   /* top tab strip                  */
      --border:    #363636;   /* box borders                    */
      --border2:   #2a2a2a;   /* subtle borders                 */
      --fg:        #e2e2e2;   /* bright text                    */
      --muted:     #8a8a8a;   /* muted grey text                */
      --muted2:    #6b6b6b;   /* dimmest labels                 */
      --cyan:      #4ec9d4;   /* links / prompt caret           */
      --purple:    #9d7cd8;   /* model name / thinking / agent  */
      --green:     #52c07a;   /* success, checks, complete      */
      --gold:      #e6b34a;   /* quality / cost / logo top      */
      --orange:    #e0793a;   /* logo mid                       */
      --redorange: #d94f2a;   /* logo bottom                    */
      --pink:      #d47ba8;   /* REPO header                    */
      --warn:      #e6b34a;   /* scroll marker                  */
      --dot-r:     #ff5f57;
      --dot-y:     #febc2e;
      --dot-g:     #28c840;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg:        #fbfbfa;
        --panelbg:   #ffffff;
        --tabbg:     #ececeb;
        --tabbar:    #f2f2f1;
        --border:    #d7d7d4;
        --border2:   #e4e4e1;
        --fg:        #26262a;
        --muted:     #6f6f74;
        --muted2:    #9a9a9e;
        --cyan:      #0c8fa0;
        --purple:    #7a56c9;
        --green:     #2f9e57;
        --gold:      #b9822a;
        --orange:    #cf6a2b;
        --redorange: #c2401f;
        --pink:      #b85688;
        --warn:      #b9822a;
      }
    }

    text { fill: var(--fg); }
    .mut  { fill: var(--muted); }
    .mut2 { fill: var(--muted2); }
    .cyan { fill: var(--cyan); }
    .purp { fill: var(--purple); }
    .grn  { fill: var(--green); }
    .gold { fill: var(--gold); }
    .pink { fill: var(--pink); }
    .b    { font-weight: 700; }
    .sm   { font-size: 12px; }
    .xs   { font-size: 11px; }
    .lbl  { font-size: 11px; letter-spacing: .12em; font-weight: 700; }

    .box  { fill: var(--panelbg); stroke: var(--border); stroke-width: 1; rx: 8; }

    /* ---- animation timings (single 12s loop) ---- */
    .fade { opacity: 0; }
    .caret { animation: blink 1s steps(1) infinite; }

    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

    /* staged reveals */
    .s1 { animation: pop .01s linear forwards; animation-delay: 0.6s; }
    .s2 { animation: pop .01s linear forwards; animation-delay: 1.6s; }
    .s3 { animation: pop .01s linear forwards; animation-delay: 2.6s; }
    .s4 { animation: pop .01s linear forwards; animation-delay: 3.6s; }
    .s5 { animation: pop .01s linear forwards; animation-delay: 4.8s; }
    .s6 { animation: pop .01s linear forwards; animation-delay: 6.0s; }
    .s7 { animation: pop .01s linear forwards; animation-delay: 7.0s; }
    @keyframes pop { to { opacity: 1 } }

    /* logo pixels shimmer in */
    .px { opacity: 0; animation: litpx .5s ease-out forwards; }
    @keyframes litpx { from { opacity: 0 } to { opacity: 1 } }

    /* spinner for "running" */
    .spin { transform-origin: 872px 400px; animation: rot 1.1s linear infinite; }
    @keyframes rot { to { transform: rotate(360deg) } }

    /* progress bar sweep in the running card */
    .barfill { animation: grow 4s ease-in-out infinite; }
    @keyframes grow { 0% { width: 6px } 55% { width: 150px } 100% { width: 150px } }

    /* token counter pulse */
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }

    @media (prefers-reduced-motion: reduce) {
      .fade, .px { opacity: 1; animation: none; }
      .caret { animation: none; opacity: 1; }
      .spin  { animation: none; }
      .barfill { width: 150px; animation: none; }
      .pulse { animation: none; }
      .s1,.s2,.s3,.s4,.s5,.s6,.s7 { opacity: 1; animation: none; }
    }
  </style>

  <defs>
    <clipPath id="screen"><rect x="0" y="0" width="960" height="620" rx="12"/></clipPath>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="var(--gold)"/>
      <stop offset="0.5" stop-color="var(--orange)"/>
      <stop offset="1"   stop-color="var(--redorange)"/>
    </linearGradient>
  </defs>

  <!-- ===== window ===== -->
  <g clip-path="url(#screen)">
    <rect x="0" y="0" width="960" height="620" fill="var(--bg)"/>

    <!-- tab strip -->
    <rect x="0" y="0" width="960" height="26" fill="var(--tabbar)"/>
    <rect x="8" y="4" width="290" height="18" rx="5" fill="var(--tabbg)"/>
    <text x="120" y="16" class="xs mut">· agent tools consolidation</text>
    <rect x="322" y="4" width="316" height="18" rx="5" fill="var(--tabbg)"/>
    <text x="462" y="16" class="xs" fill="var(--fg)">oxagen</text>
    <text x="820" y="16" class="xs mut">oxagen</text>
    <text x="946" y="16" class="mut" font-size="15">+</text>

    <!-- ===== OXAGEN pixel logo (sampled gold→red-orange gradient) ===== -->
    <!-- built from a 5px grid; each glyph ~ 5 cols wide. Pixels shimmer in. -->
    <g transform="translate(16,40)" fill="url(#logo)">
      <!-- O -->
      <g>
        <rect class="px" style="animation-delay:.02s" x="0"  y="0"  width="9" height="9"/>
        <rect class="px" style="animation-delay:.04s" x="10" y="0"  width="9" height="9"/>
        <rect class="px" style="animation-delay:.06s" x="20" y="0"  width="9" height="9"/>
        <rect class="px" style="animation-delay:.08s" x="0"  y="10" width="9" height="9"/>
        <rect class="px" style="animation-delay:.10s" x="20" y="10" width="9" height="9"/>
        <rect class="px" style="animation-delay:.12s" x="0"  y="20" width="9" height="9"/>
        <rect class="px" style="animation-delay:.14s" x="20" y="20" width="9" height="9"/>
        <rect class="px" style="animation-delay:.16s" x="0"  y="30" width="9" height="9"/>
        <rect class="px" style="animation-delay:.18s" x="20" y="30" width="9" height="9"/>
        <rect class="px" style="animation-delay:.20s" x="0"  y="40" width="9" height="9"/>
        <rect class="px" style="animation-delay:.22s" x="10" y="40" width="9" height="9"/>
        <rect class="px" style="animation-delay:.24s" x="20" y="40" width="9" height="9"/>
      </g>
      <!-- X -->
      <g transform="translate(40,0)">
        <rect class="px" style="animation-delay:.05s" x="0"  y="0"  width="9" height="9"/>
        <rect class="px" style="animation-delay:.07s" x="20" y="0"  width="9" height="9"/>
        <rect class="px" style="animation-delay:.09s" x="10" y="10" width="9" height="9"/>
        <rect class="px" style="animation-delay:.11s" x="10" y="20" width="9" height="9"/>
        <rect class="px" style="animation-delay:.13s" x="10" y="30" width="9" height="9"/>
        <rect class="px" style="animation-delay:.15s" x="0"  y="40" width="9" height="9"/>
        <rect class="px" style="animation-delay:.17s" x="20" y="40" width="9" height="9"/>
      </g>
      <!-- A -->
      <g transform="translate(80,0)">
        <rect class="px" style="animation-delay:.06s" x="10" y="0"  width="9" height="9"/>
        <rect class="px" style="animation-delay:.08s" x="0"  y="10" width="9" height="9"/>
        <rect class="px" style="animation-delay:.10s" x="20" y="10" width="9" height="9"/>
        <rect class="px" style="animation-delay:.12s" x="0"  y="20" width="9" height="9"/>
        <rect class="px" style="animation-delay:.14s" x="10" y="20" width="9" height="9"/>
        <rect class="px" style="animation-delay:.16s" x="20" y="20" width="9" height="9"/>
        <rect class="px" style="animation-delay:.18s" x="0"  y="30" width="9" height="9"/>
        <rect class="px" style="animation-delay:.20s" x="20" y="30" width="9" height="9"/>
        <rect class="px" style="animation-delay:.22s" x="0"  y="40" width="9" height="9"/>
        <rect class="px" style="animation-delay:.24s" x="20" y="40" width="9" height="9"/>
      </g>
      <!-- G -->
      <g transform="translate(120,0)">
        <rect class="px" style="animation-delay:.10s" x="10" y="0"  width="9" height="9"/>
        <rect class="px" style="animation-delay:.11s" x="20" y="0"  width="9" height="9"/>
        <rect class="px" style="animation-delay:.12s" x="0"  y="10" width="9" height="9"/>
        <rect class="px" style="animation-delay:.14s" x="0"  y="20" width="9" height="9"/>
        <rect class="px" style="animation-delay:.16s" x="20" y="20" width="9" height="9"/>
        <rect class="px" style="animation-delay:.18s" x="0"  y="30" width="9" height="9"/>
        <rect class="px" style="animation-delay:.20s" x="20" y="30" width="9" height="9"/>
        <rect class="px" style="animation-delay:.22s" x="10" y="40" width="9" height="9"/>
        <rect class="px" style="animation-delay:.24s" x="20" y="40" width="9" height="9"/>
      </g>
      <!-- E -->
      <g transform="translate(160,0)">
        <rect class="px" style="animation-delay:.14s" x="0"  y="0"  width="9" height="9"/>
        <rect class="px" style="animation-delay:.15s" x="10" y="0"  width="9" height="9"/>
        <rect class="px" style="animation-delay:.16s" x="20" y="0"  width="9" height="9"/>
        <rect class="px" style="animation-delay:.17s" x="0"  y="10" width="9" height="9"/>
        <rect class="px" style="animation-delay:.18s" x="0"  y="20" width="9" height="9"/>
        <rect class="px" style="animation-delay:.19s" x="10" y="20" width="9" height="9"/>
        <rect class="px" style="animation-delay:.20s" x="0"  y="30" width="9" height="9"/>
        <rect class="px" style="animation-delay:.22s" x="0"  y="40" width="9" height="9"/>
        <rect class="px" style="animation-delay:.23s" x="10" y="40" width="9" height="9"/>
        <rect class="px" style="animation-delay:.24s" x="20" y="40" width="9" height="9"/>
      </g>
      <!-- N -->
      <g transform="translate(200,0)">
        <rect class="px" style="animation-delay:.18s" x="0"  y="0"  width="9" height="9"/>
        <rect class="px" style="animation-delay:.19s" x="20" y="0"  width="9" height="9"/>
        <rect class="px" style="animation-delay:.20s" x="0"  y="10" width="9" height="9"/>
        <rect class="px" style="animation-delay:.21s" x="10" y="10" width="9" height="9"/>
        <rect class="px" style="animation-delay:.22s" x="20" y="10" width="9" height="9"/>
        <rect class="px" style="animation-delay:.23s" x="0"  y="20" width="9" height="9"/>
        <rect class="px" style="animation-delay:.24s" x="20" y="20" width="9" height="9"/>
        <rect class="px" style="animation-delay:.25s" x="0"  y="30" width="9" height="9"/>
        <rect class="px" style="animation-delay:.26s" x="20" y="30" width="9" height="9"/>
        <rect class="px" style="animation-delay:.27s" x="0"  y="40" width="9" height="9"/>
        <rect class="px" style="animation-delay:.28s" x="20" y="40" width="9" height="9"/>
      </g>
    </g>

    <!-- ===== status line ===== -->
    <text x="16" y="118" class="sm">
      <tspan class="cyan">◇</tspan>
      <tspan class="b" fill="var(--fg)"> OXAGEN</tspan>
      <tspan class="mut"> v1.1.0 · mac-anderson3/default · oxagen-platform · </tspan>
      <tspan class="cyan">feat/chat-agents-list-card</tspan>
    </text>
    <text x="944" y="118" text-anchor="end" class="sm">
      <tspan class="cyan b">claude-opus-4-8</tspan>
      <tspan class="mut"> · 14:59:09 · </tspan>
      <tspan class="grn">$194.69</tspan>
    </text>

    <!-- scroll marker -->
    <text x="16" y="138" class="sm">
      <tspan fill="var(--warn)">▲ 293 lines above</tspan>
      <tspan class="mut2"> · End to jump</tspan>
    </text>

    <!-- ===== transcript body (left column) ===== -->
    <g font-size="12.5" class="fade s1">
      <text x="16" y="162" class="mut">suggest) to use it. A drift-guard test fails CI if the generated file goes stale.</text>
    </g>
    <g font-size="12.5" class="fade s2">
      <text x="16" y="188"><tspan class="b" fill="var(--fg)">Defect I fixed while landing it:</tspan><tspan class="mut"> the new </tspan><tspan class="cyan">scripts/embed-skills.ts</tspan><tspan class="mut"> was outside tsconfig's rootDir.</tspan></text>
      <text x="16" y="206" class="mut">I widened the skills tsconfig to include <tspan class="cyan">scripts/**</tspan> and removed two unused directives.</text>
    </g>
    <g font-size="12.5" class="fade s3">
      <text x="16" y="234" class="b" fill="var(--fg)">Verification:</text>
      <text x="34" y="256" class="mut">* <tspan class="cyan">gen:skills</tspan> → <tspan class="b" fill="var(--fg)">no drift</tspan> on the committed generated file.</text>
      <text x="34" y="274" class="mut">* <tspan class="cyan">@oxagen/skills</tspan>: typecheck <tspan class="grn">✓</tspan>, unit tests <tspan class="grn">✓</tspan> (35 passed).</text>
      <text x="34" y="292" class="mut">* <tspan class="cyan">@oxagen/handlers</tspan>: typecheck <tspan class="grn">✓</tspan>, suggest/seed/install tests <tspan class="grn">✓</tspan>.</text>
    </g>
    <g font-size="12.5" class="fade s4">
      <text x="16" y="320"><tspan class="b" fill="var(--fg)">Published:</tspan><tspan class="mut"> commit </tspan><tspan class="cyan">699bb8d6</tspan><tspan class="mut">, </tspan><tspan class="b" fill="var(--fg)">PR #714</tspan><tspan class="mut"> open against </tspan><tspan class="cyan">main</tspan><tspan class="mut">. CI (run </tspan><tspan class="cyan">28978580791</tspan><tspan class="mut">) running.</tspan></text>
    </g>

    <!-- ===== completed task card (left) ===== -->
    <g class="fade s6">
      <rect x="16" y="338" width="360" height="78" rx="8" fill="var(--panelbg)" stroke="var(--green)" stroke-width="1"/>
      <text x="32" y="366" font-size="13"><tspan class="grn b">✓ complete</tspan><tspan class="mut">      quality </tspan><tspan class="gold b">60/100</tspan></text>
      <text x="32" y="390" font-size="12.5"><tspan class="mut2">files   </tspan><tspan class="mut">packages/skills/tsconfig.json </tspan><tspan class="grn">(+1)</tspan></text>
      <text x="32" y="408" font-size="12.5"><tspan class="mut2">cost    </tspan><tspan class="gold b">$14.01</tspan></text>
    </g>

    <!-- ===== Agent Team card (right) ===== -->
    <g class="fade s5">
      <rect x="700" y="150" width="244" height="118" rx="8" fill="var(--panelbg)" stroke="var(--border)"/>
      <text x="718" y="176" font-size="13"><tspan class="purp">◎</tspan><tspan class="purp b"> Agent Team</tspan></text>
      <text x="718" y="202" class="mut sm">0 running · 1 total</text>
      <!-- animated running spinner + progress -->
      <g class="spin"><path d="M868 400 a8 8 0 1 1 -8 8" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round"/></g>
      <text x="718" y="234" class="sm"><tspan class="grn">✓ </tspan><tspan class="b" fill="var(--fg)">turn</tspan><tspan class="mut"> resume</tspan></text>
      <text x="718" y="252" class="mut2 xs">5m11s · Fable · turn complete</text>
    </g>

    <!-- ===== Task Progress card (right) with live bar ===== -->
    <g class="fade s5">
      <rect x="700" y="284" width="244" height="118" rx="8" fill="var(--panelbg)" stroke="var(--border)"/>
      <text x="718" y="310" font-size="13"><tspan class="purp">◎</tspan><tspan class="purp b"> Task Progress</tspan></text>
      <text x="718" y="336" class="mut sm">1/1 done</text>
      <rect x="718" y="350" width="150" height="6" rx="3" fill="var(--border2)"/>
      <rect x="718" y="350" height="6" rx="3" fill="var(--green)" class="barfill" width="150"/>
      <text x="718" y="384" class="sm"><tspan class="grn">✓ </tspan><tspan class="mut">resume</tspan></text>
    </g>

    <!-- ===== thinking / prompt (bottom) ===== -->
    <g class="fade s7">
      <text x="16" y="452" class="sm"><tspan class="purp">☁ thinking</tspan><tspan class="mut"> debug · enhanced prompt sent to the model:</tspan></text>
      <text x="16" y="472" class="mut sm">resume</text>

      <!-- prompt input box -->
      <rect x="16" y="486" width="928" height="34" rx="6" fill="var(--panelbg)" stroke="var(--cyan)" stroke-width="1"/>
      <text x="30" y="507" class="cyan" font-size="14">›</text>
      <rect x="44" y="496" width="8" height="15" fill="var(--cyan)" class="caret"/>
    </g>

    <!-- ===== footer stat panels ===== -->
    <g class="fade s1">
      <!-- MODELS -->
      <rect x="16" y="536" width="176" height="72" class="box" rx="8" fill="var(--panelbg)" stroke="var(--border)"/>
      <text x="30" y="556" class="lbl purp">MODELS</text>
      <text x="30" y="574" class="xs"><tspan class="mut2">triage </tspan><tspan class="mut">anthropic/claude-ha…</tspan></text>
      <text x="30" y="588" class="xs"><tspan class="mut2">worker </tspan><tspan class="mut">claude-opus-4-8</tspan></text>
      <text x="30" y="602" class="xs"><tspan class="mut2">judge  </tspan><tspan class="mut">gpt-5-5</tspan></text>

      <!-- TURN -->
      <rect x="200" y="536" width="168" height="72" rx="8" fill="var(--panelbg)" stroke="var(--border)"/>
      <text x="214" y="556" class="lbl purp">TURN</text>
      <text x="214" y="574" class="xs"><tspan class="mut2">phase </tspan><tspan class="grn">complete</tspan></text>
      <text x="214" y="588" class="xs"><tspan class="mut2">step  </tspan><tspan class="mut">35/256</tspan></text>
      <text x="214" y="602" class="xs"><tspan class="mut2">round </tspan><tspan class="mut">0 · 5m11s</tspan></text>

      <!-- TOKENS -->
      <rect x="376" y="536" width="200" height="72" rx="8" fill="var(--panelbg)" stroke="var(--border)"/>
      <text x="390" y="556" class="lbl purp">TOKENS</text>
      <text x="390" y="574" class="xs pulse"><tspan class="grn">↑14.6M</tspan><tspan class="mut">  </tspan><tspan class="cyan">↓61k</tspan></text>
      <text x="390" y="588" class="xs"><tspan class="mut2">cache </tspan><tspan class="mut">2.1Mhit</tspan></text>
      <text x="390" y="602" class="xs"><tspan class="gold b">$194.69</tspan><tspan class="mut"> · 0tok/s</tspan></text>

      <!-- TOOLS -->
      <rect x="584" y="536" width="200" height="72" rx="8" fill="var(--panelbg)" stroke="var(--border)"/>
      <text x="598" y="556" class="lbl purp">TOOLS</text>
      <text x="598" y="574" class="xs"><tspan class="mut">code_graph </tspan><tspan class="cyan">8</tspan><tspan class="mut">  edit_file </tspan><tspan class="cyan">23</tspan></text>
      <text x="598" y="588" class="xs"><tspan class="mut">write_file </tspan><tspan class="cyan">5</tspan><tspan class="mut">  read_file </tspan><tspan class="cyan">36</tspan></text>
      <text x="598" y="602" class="xs"><tspan class="mut">bash </tspan><tspan class="cyan">73</tspan><tspan class="mut">  grep </tspan><tspan class="cyan">19</tspan></text>

      <!-- REPO -->
      <rect x="792" y="536" width="152" height="72" rx="8" fill="var(--panelbg)" stroke="var(--border)"/>
      <text x="806" y="556" class="lbl pink">REPO</text>
      <text x="806" y="574" class="xs mut">~/…/oxagen-platform</text>
      <text x="806" y="588" class="xs cyan">feat/chat-agents…</text>
      <text x="806" y="602" class="xs mut2">#714</text>
    </g>
  </g>
</svg>
