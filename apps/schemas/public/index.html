<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oxagen Schemas</title>
    <meta
      name="description"
      content="JSON Schemas for Oxagen configuration files, served for editor validation and autocompletion."
    />
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0a0a0a;
        color: #e4e4e7;
        font-family:
          ui-monospace,
          "SF Mono",
          "Cascadia Code",
          "JetBrains Mono",
          Menlo,
          Consolas,
          monospace;
        display: flex;
        justify-content: center;
        padding: 4rem 1.5rem;
      }

      main {
        width: 100%;
        max-width: 40rem;
      }

      h1 {
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #a1a1aa;
        margin: 0 0 0.5rem;
      }

      p.lede {
        color: #71717a;
        margin: 0 0 2.5rem;
        line-height: 1.6;
        font-size: 0.875rem;
      }

      p.status {
        color: #a1a1aa;
        font-size: 0.8rem;
        line-height: 1.5;
        margin: 0;
        padding: 1.25rem 1.5rem;
        border: 1px solid #27272a;
        border-radius: 8px;
      }

      footer {
        margin-top: 2.5rem;
        color: #52525b;
        font-size: 0.75rem;
      }

      footer a {
        color: #71717a;
      }

      code {
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 4px;
        padding: 0.1rem 0.35rem;
        font-size: 0.8em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Oxagen Schemas</h1>
      <p class="lede">
        JSON Schemas for Oxagen configuration files. Reference one from <code>$schema</code> and
        your editor validates the file and completes its fields as you type.
      </p>
      <p class="status">No schema documents are published on this domain yet.</p>
      <footer>
        Served from the
        <a href="https://github.com/oxagen/oxagen-monorepo">oxagen-monorepo</a>.
      </footer>
    </main>
  </body>
</html>
