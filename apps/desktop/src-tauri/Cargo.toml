[package]
name = "oxagen-desktop"
version = "2.1.3"
description = "The Oxagen desktop app: CLI + Tacho wrapper installer and host management"
authors = ["Oxagen"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "oxagen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-shell = "2.3.6"
tauri-plugin-opener = "2.5.5"
# Desktop-only: the in-app updater (minisign-verified, GitHub releases
# latest.json) and the relaunch it ends with.
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["json"] }
dirs = "7.0.0"

# macOS only: `src/macos_quit.rs` adds `applicationShouldTerminate:` to tao's
# app delegate and answers it on the main queue. The versions are the ones
# tauri and tao already pull in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
dispatch2 = "0.3.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
