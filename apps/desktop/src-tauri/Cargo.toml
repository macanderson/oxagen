[package]
name = "oxagen-desktop"
version = "2.1.1"
description = "The Oxagen desktop app: CLI + Tacho wrapper installer and host management"
authors = ["Oxagen"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "oxagen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
# Desktop-only: the in-app updater (minisign-verified, GitHub releases
# latest.json) and the relaunch it ends with.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
