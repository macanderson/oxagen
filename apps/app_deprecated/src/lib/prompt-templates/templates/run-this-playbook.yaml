id: run-this-playbook
title: Run this playbook
description: Start a new run of this playbook, filling in required parameters.
category: create
tags: [playbook, run, execute]
applicableTo:
  - routePattern: /{org}/{ws}/workbench/playbooks/:playbookId
capability: playbook.run.create
autoSubmit: false
variables:
  - name: playbook_id
    resolver: param
    source: params.playbookId
    required: true
  - name: playbook_name
    resolver: page
    source: page.entity.label
    required: false
body: |
  I want to run playbook {{playbook_name}} ({{playbook_id}}). Help me fill in the required
  parameters for this run. Show me what each parameter does and suggest sensible defaults
  based on recent runs.
