# The blog's pillars. Every post links to one or more of these by `slug`, and
# the build refuses a post whose pillar is not listed here.
#
# Fields:
#   slug         the URL segment: /blog/pillars/<slug>
#   name         the short label shown on chips and the index
#   tagline      one line under the name on the pillar page
#   description  a short paragraph for the pillar page and its <meta>
#   order        display order on the index
#   treatment    which of the seven drawings the build puts on the pillar's
#                banner and card: graph, ontology, loop, terminal, gate,
#                ledger or meter (scripts/lib/art.mjs). Optional; a pillar
#                without one takes the next drawing in order.
#
# A pillar's banner, thumbnail and share card are generated by the build
# (scripts/lib/images.mjs); nothing is stored in the repo.
pillars:
  - slug: ontologies
    name: Ontologies
    tagline: The structured facts an agent reasons over.
    description: >-
      Typed entities, relationships, and dated facts, stored so an agent can
      cite them. Posts cover description logics, knowledge graphs, retrieval
      over a graph, and research on basing an answer on structure instead of
      on text similarity.
    order: 1
    treatment: ontology

  - slug: ai-agents
    name: AI agents
    tagline: Models that take actions, and what makes them reliable.
    description: >-
      The science of agents: planning, tool use, memory, and evaluation. Posts
      run from ReAct and Reflexion to the benchmarks that measure whether an
      agent finishes a task, and what each run costs.
    order: 2
    treatment: loop

  - slug: coding-agents
    name: Coding agents
    tagline: Agents that read, write, and fix code.
    description: >-
      What SWE-bench and similar benchmarks measure. How coding agents plan
      and repair a change across a whole repository. What a team needs before
      it can trust the result in production code.
    order: 3
    treatment: terminal

  - slug: self-improving-models
    name: Self-improving models
    tagline: Models that train on their own output.
    description: >-
      Research on models that learn from their own reasoning and score their
      own answers. Posts also cover the limits the research keeps finding,
      such as model collapse, where training on its own output makes a model
      worse, and self-correction that fails without outside feedback.
    order: 4
    treatment: meter

  - slug: self-evolving-agents
    name: Self-evolving agents
    tagline: Agents that change their own skills and code.
    description: >-
      Skill libraries, workflow memory, automated agent design, and code that
      modifies itself. Posts cover what the evidence shows and where these
      methods fail.
    order: 5
    treatment: gate

  - slug: autonomous-agents
    name: Autonomous agents
    tagline: Agents that work for days without a person watching.
    description: >-
      Agents can now keep working on one task for longer. Practices that work
      for a ten-minute run fail over a week. Posts cover what the measurements
      show about long runs. They also cover what an operator has to set
      before a long run starts: the context the agent gets, the steering it
      runs under, and the record it leaves.
    order: 6
    treatment: ledger
