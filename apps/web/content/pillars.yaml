# The blog's pillars. Every post links to one or more of these by `slug`, and
# the build refuses a post whose pillar is not listed here.
#
# Fields:
#   slug         the URL segment: /blog/pillars/<slug>
#   name         the short label shown on chips and the index
#   tagline      one line under the name on the pillar page
#   description  a short paragraph for the pillar page and its <meta>
#   order        display order on the index
#   treatment    which of the seven drawings the build puts on the pillar's
#                banner and card: graph, ontology, loop, terminal, gate,
#                ledger or meter (scripts/lib/art.mjs). Optional; a pillar
#                without one takes the next drawing in order.
#
# A pillar's banner, thumbnail and share card are generated by the build
# (scripts/lib/images.mjs); nothing is stored in the repo.
pillars:
  - slug: ontologies
    name: Ontologies
    tagline: The map an agent reasons over.
    description: >-
      Typed entities, relationships, and time-aware facts that turn a pile of
      documents into a map an agent can cite: description logics, knowledge
      graphs, graph-grounded retrieval, and the research on grounding an
      answer in structure instead of similarity.
    order: 1
    treatment: ontology

  - slug: ai-agents
    name: AI agents
    tagline: Models that act, and what makes them reliable.
    description: >-
      The science of agents: planning, tool use, memory, and evaluation. From
      ReAct and Reflexion to the benchmarks that measure whether an agent
      finishes the job, and what each run costs.
    order: 2
    treatment: loop

  - slug: coding-agents
    name: Coding agents
    tagline: Agents that read, write, and fix code.
    description: >-
      What SWE-bench and its peers measure, how these agents plan and repair
      a change across a whole repository, and what a team needs to trust the
      result before it reaches a production tree.
    order: 3
    treatment: terminal

  - slug: self-improving-models
    name: Self-improving models
    tagline: Models that train on their own output.
    description: >-
      Bootstrapped reasoning, self-rewarding training, and the hard limits the
      research keeps finding: model collapse and the myth of unaided
      self-correction.
    order: 4
    treatment: meter

  - slug: self-evolving-agents
    name: Self-evolving agents
    tagline: Agents that rewrite their own playbook.
    description: >-
      Skill libraries, workflow memory, automated agent design, and code that
      modifies itself. What the evidence shows, and where it breaks.
    order: 5
    treatment: gate

  - slug: autonomous-agents
    name: Autonomous agents
    tagline: Work that runs for days without you watching.
    description: >-
      The horizon an agent can hold is getting longer, and the practices that
      work at ten minutes do not survive a week. What the measurements show
      about long runs, and what an operator has to set before starting one:
      the context an agent is handed, the steering it runs under, and the
      record it leaves.
    order: 6
    treatment: ledger
