[project]
name = "oxagen-rag-eval"
version = "0.1.0"
description = "RAGAS + DeepEval RAG-quality suite for Oxagen's context/retrieval engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ragas>=0.2.0",
    "deepeval>=1.4.0",
    "datasets>=3.0.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

# No importable package — runner is a top-level script, so the project
# itself is never built or installed; uv only manages its dependencies.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
